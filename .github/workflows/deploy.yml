name: Deploy

on:
  push:
    branches:
      - '**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Inject Supabase credentials
        # supabase-client.js is committed with {{SUPABASE_URL}} /
        # {{SUPABASE_ANON_KEY}} placeholders still in it - these are
        # filled in here, on the checked-out runner copy only, from
        # repo secrets. Nothing here is ever written back to git -
        # the real values never appear in git history, only in the
        # deployed files on the FTP server.
        # main branch → production Supabase project
        # all other branches → dev Supabase project
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          else
            SUPABASE_URL="${{ secrets.SUPABASE_URL_DEV }}"
            SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY_DEV }}"
          fi
          sed -i "s|{{SUPABASE_URL}}|${SUPABASE_URL}|g" assets/js/supabase-client.js
          sed -i "s|{{SUPABASE_ANON_KEY}}|${SUPABASE_ANON_KEY}|g" assets/js/supabase-client.js

      - name: Determine deploy target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=public_html/${{ vars.PROJECT_CODE }}/" >> "$GITHUB_OUTPUT"
          else
            echo "dir=public_html/${{ vars.PROJECT_CODE }}/${{ github.ref_name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Sanitize branch name for state file
        id: branch_safe
        run: echo "name=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.target.outputs.dir }}
          local-dir: ./
          state-name: .ftp-deploy-sync-state-${{ steps.branch_safe.outputs.name }}.json
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            Backup/**
            deploy.bat
            project.conf
            CHANGES.txt
            supabase/**
            README.md
            debug.html

      - name: Notify Slack
        if: success() && vars.SLACK_NOTIFY == 'true'
        continue-on-error: true
        run: |
          TIMESTAMP=$(TZ="Europe/London" date '+%d/%m/%y %H:%M')
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH_NAME="${{ github.ref_name }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          curl -s -X POST -H 'Content-type: application/json' \
            --connect-timeout 10 \
            --max-time 15 \
            --data "$(jq -n \
              --arg text "${TIMESTAMP} - ${REPO_NAME} [${BRANCH_NAME}] Published: ${COMMIT_MSG}" \
              '{text: $text}')" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
