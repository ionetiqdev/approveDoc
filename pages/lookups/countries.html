<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-app-root="../../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countries - approveDoc</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/theme.css?r=jew618sk" />

  <script>
    (function() {
      try {
        var root = document.documentElement.dataset.appRoot || './';
        var absoluteRoot = new URL(root, window.location.href).pathname;
        var suffix = ':' + absoluteRoot;
        var savedTheme = localStorage.getItem('app_theme');
        var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
        var accent = localStorage.getItem('app_accent' + suffix);
        if (accent) {
          document.documentElement.style.setProperty('--tblr-primary', accent);
          var ah = accent.replace('#','');
          if (ah.length === 3) ah = ah.split('').map(function(c){return c+c;}).join('');
          document.documentElement.style.setProperty('--tblr-primary-rgb', parseInt(ah.slice(0,2),16) + ', ' + parseInt(ah.slice(2,4),16) + ', ' + parseInt(ah.slice(4,6),16));
        }
        var sidebarBg = localStorage.getItem('app_sidebar_bg' + suffix);
        if (sidebarBg) {
          document.documentElement.style.setProperty('--bg-sidebar', sidebarBg);
          var hex = sidebarBg.replace('#', '');
          if (hex.length === 3) hex = hex.split('').map(function(c){return c+c;}).join('');
          var r = parseInt(hex.slice(0,2),16) / 255, g = parseInt(hex.slice(2,4),16) / 255, b = parseInt(hex.slice(4,6),16) / 255;
          var toLinear = function(c){ return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
          var isLight = (0.2126*toLinear(r) + 0.7152*toLinear(g) + 0.0722*toLinear(b)) > 0.5;
          document.documentElement.style.setProperty('--sidebar-fg', isLight ? '#0f172a' : '#ffffff');
          document.documentElement.style.setProperty('--sidebar-fg-rgb', isLight ? '15,23,42' : '255,255,255');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    /* Fixed to the viewport height - header + toolbar + table + pager,
       no page-level scroll, and no internal table scroll either.
       Pagination (not scrolling) is what keeps rows within the
       available height - see calcRowsPerPage() in the script below. */
    html, body { height: 100%; overflow: hidden; }
    .app-content-wrapper { height: 100vh; display: flex; flex-direction: column; }
    .page-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 1rem; padding-bottom: 1rem; }
    .page-body > .container-fluid { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .lookup-card { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .col-10pct { width: 5%; }
    .col-80pct { width: 90%; }
    table.table-fixed { table-layout: fixed; }
    .col-10pct img { width: 32px; height: 24px; border-radius: 3px; display: block; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  </style>
</head>
<body>

  <aside id="sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app-content-wrapper">

    <header class="navbar navbar-expand-md d-print-none border-bottom">
      <div class="container-fluid">
        <button id="sidebarToggle" class="btn btn-icon" aria-label="Toggle sidebar" title="Toggle sidebar">
          <i class="ti ti-menu-2"></i>
        </button>
        <h1 class="navbar-brand d-none d-sm-inline-block ms-2 mb-0 page-title-lg">Countries</h1>
        <div class="navbar-nav flex-row order-md-last align-items-center gap-2">
          <div data-active-organisation></div>
          <button class="btn btn-icon" data-theme-toggle title="Toggle dark mode"><i class="ti ti-moon"></i></button>
          <button class="btn btn-icon" id="headerPreferencesBtn" title="Preferences">
            <i class="ti ti-adjustments"></i>
          </button>
          <span class="avatar avatar-sm rounded-circle bg-primary-lt" data-user-initials>?</span>
          <span class="d-none d-xl-block">
            <span class="d-block fw-semibold" style="font-size:.8125rem" data-user-name>—</span>
            <span class="d-block text-secondary" style="font-size:.7rem" data-user-email>—</span>
          </span>
        </div>
      </div>
    </header>

    <div class="page-body">
      <div class="container-fluid">

        <div class="card lookup-card">
          <div class="card-header">
            <div class="text-secondary me-2">Search:</div>
            <input type="text" id="searchInput" class="form-control form-control-sm" style="max-width:400px" />
          </div>
          <div style="flex:1; min-height:0; overflow:hidden">
            <table class="table table-vcenter card-table table-hover table-fixed mb-0">
              <thead>
                <tr>
                  <th class="col-10pct"></th>
                  <th class="col-10pct">Code</th>
                  <th class="col-80pct">Name</th>
                </tr>
              </thead>
              <tbody id="itemsBody">
                <tr><td colspan="3" class="text-center py-4 text-secondary">
                  <span class="spinner-border spinner-border-sm me-2"></span>Loading…
                </td></tr>
              </tbody>
            </table>
          </div>
          <div class="card-footer d-flex align-items-center" style="flex-shrink:0">
            <p class="m-0 text-secondary" id="pageInfo"></p>
            <ul class="pagination m-0 ms-auto" id="pagerList"></ul>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/version.js?r=jew618sk"></script>
  <script src="../../assets/js/supabase-client.js?r=jew618sk"></script>
  <script src="../../assets/js/auth.js?r=jew618sk"></script>
  <script src="../../assets/js/app.js?r=jew618sk"></script>
  <script src="../../assets/js/theme.js?r=jew618sk"></script>
  <script src="../../assets/js/sidebar-html.js?r=jew618sk"></script>
  <script src="../../assets/js/sidebar.js?r=jew618sk"></script>
  <script src="../../assets/js/profile-modal.js?r=jew618sk"></script>
  <script>
// Countries is a fixed, view-only ISO 3166-1 reference list - no
// add/edit/delete. Unlike the other lookup pages, this one is not
// organisation-scoped (it's shared, global data - see
// supabase/11-country-remove-org-scope-add-alpha2.sql), so any
// authenticated user can view it, not just admins.

let allItems = [];
let currentPage = 1;
let rowsPerPage = 20; // recalculated to fit the viewport - see calcRowsPerPage()

(async () => {
  const session = await Auth.requireAuth();
  if (!session) return;
  SidebarHtml.inject('../../');
  Sidebar.init();
  Auth.refreshUI();

  await loadItems();

  document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; renderTable(); });
  window.addEventListener('resize', () => { calcRowsPerPage(); renderTable(); });
})();

async function loadItems() {
  const { data, error } = await sb.from('ad_country').select('*').order('name');

  if (error) {
    console.error('[Countries] Load error:', error);
    App.toast('Failed to load countries: ' + error.message, 'danger');
    return;
  }

  allItems = data || [];
  calcRowsPerPage();
  renderTable();
}

function getFiltered() {
  const search = (document.getElementById('searchInput').value || '').toLowerCase();
  return allItems.filter(item => {
    if (search && !item.name?.toLowerCase().includes(search) && !item.country_code?.toLowerCase().includes(search)) return false;
    return true;
  });
}

// Works out how many rows fit in the visible table area without
// scrolling, based on actual rendered row height - so pagination,
// not scrolling, handles overflow, regardless of viewport size.
function calcRowsPerPage() {
  const wrapper = document.querySelector('.lookup-card > div[style*="overflow:hidden"]');
  const headerRow = document.querySelector('thead tr');
  if (!wrapper || !headerRow) return;

  const availableHeight = wrapper.clientHeight - headerRow.clientHeight;
  const sampleRowHeight = 49; // Tabler's default table-vcenter row height
  rowsPerPage = Math.max(5, Math.floor(availableHeight / sampleRowHeight));
}

function renderPager(totalPages) {
  const pagerList = document.getElementById('pagerList');
  const items = [];

  items.push(`<li class="page-item ${currentPage <= 1 ? 'disabled' : ''}">
    <a class="page-link" href="#" data-page="${currentPage - 1}" aria-label="Previous">
      <i class="ti ti-chevron-left"></i> prev
    </a>
  </li>`);

  let start = Math.max(1, currentPage - 2);
  let end = Math.min(totalPages, start + 4);
  start = Math.max(1, end - 4);

  for (let p = start; p <= end; p++) {
    items.push(`<li class="page-item ${p === currentPage ? 'active' : ''}">
      <a class="page-link" href="#" data-page="${p}">${p}</a>
    </li>`);
  }

  items.push(`<li class="page-item ${currentPage >= totalPages ? 'disabled' : ''}">
    <a class="page-link" href="#" data-page="${currentPage + 1}" aria-label="Next">
      next <i class="ti ti-chevron-right"></i>
    </a>
  </li>`);

  pagerList.innerHTML = items.join('');

  pagerList.querySelectorAll('a[data-page]').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const page = parseInt(a.dataset.page, 10);
      if (page < 1 || page > totalPages || page === currentPage) return;
      currentPage = page;
      renderTable();
    });
  });
}

function renderTable() {
  const filtered = getFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length / rowsPerPage));
  currentPage = Math.min(Math.max(1, currentPage), totalPages);

  const start = (currentPage - 1) * rowsPerPage;
  const pageItems = filtered.slice(start, start + rowsPerPage);

  document.getElementById('pageInfo').textContent = filtered.length
    ? ''
    : 'No matching entries found';

  renderPager(totalPages);

  const tbody = document.getElementById('itemsBody');

  if (!pageItems.length) {
    tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-secondary">
      <i class="ti ti-world mb-1 d-block" style="font-size:1.5rem"></i>No countries found
    </td></tr>`;
    return;
  }

  tbody.innerHTML = pageItems.map(item => {
    const flag = item.alpha2
      ? `<img src="https://flagcdn.com/32x24/${item.alpha2.toLowerCase()}.png" alt="" onerror="this.style.visibility='hidden'">`
      : `<span class="avatar avatar-sm rounded-circle bg-secondary-lt" style="font-size:.6rem">?</span>`;

    return `<tr>
      <td class="col-10pct">${flag}</td>
      <td class="col-10pct"><span class="badge bg-secondary-lt">${App.escHtml(item.country_code)}</span></td>
      <td class="col-80pct fw-semibold">${App.escHtml(item.name)}</td>
    </tr>`;
  }).join('');
}
  </script>
</body>
</html>
