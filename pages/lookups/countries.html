<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-app-root="../../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countries - approveDoc</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/theme.css?r=by26h7dr" />

  <script>
    (function() {
      try {
        var root = document.documentElement.dataset.appRoot || './';
        var absoluteRoot = new URL(root, window.location.href).pathname;
        var suffix = ':' + absoluteRoot;
        var savedTheme = localStorage.getItem('app_theme');
        var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
        var accent = localStorage.getItem('app_accent' + suffix);
        if (accent) {
          document.documentElement.style.setProperty('--tblr-primary', accent);
          var ah = accent.replace('#','');
          if (ah.length === 3) ah = ah.split('').map(function(c){return c+c;}).join('');
          document.documentElement.style.setProperty('--tblr-primary-rgb', parseInt(ah.slice(0,2),16) + ', ' + parseInt(ah.slice(2,4),16) + ', ' + parseInt(ah.slice(4,6),16));
        }
        var sidebarBg = localStorage.getItem('app_sidebar_bg' + suffix);
        if (sidebarBg) {
          document.documentElement.style.setProperty('--bg-sidebar', sidebarBg);
          var hex = sidebarBg.replace('#', '');
          if (hex.length === 3) hex = hex.split('').map(function(c){return c+c;}).join('');
          var r = parseInt(hex.slice(0,2),16) / 255, g = parseInt(hex.slice(2,4),16) / 255, b = parseInt(hex.slice(4,6),16) / 255;
          var toLinear = function(c){ return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
          var isLight = (0.2126*toLinear(r) + 0.7152*toLinear(g) + 0.0722*toLinear(b)) > 0.5;
          document.documentElement.style.setProperty('--sidebar-fg', isLight ? '#0f172a' : '#ffffff');
          document.documentElement.style.setProperty('--sidebar-fg-rgb', isLight ? '15,23,42' : '255,255,255');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    /* This page's layout is fixed to the viewport height (header +
       toolbar + table + pager, no page-level scroll). Only the table
       body scrolls internally, if a single page's rows ever exceed
       the available height - normally they won't, since pagination
       keeps each page short. */
    html, body { height: 100%; overflow: hidden; }
    .app-content-wrapper { height: 100vh; display: flex; flex-direction: column; }
    .page-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 1rem; padding-bottom: 1rem; }
    .page-body > .container-fluid { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .countries-card { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .countries-table-scroll { flex: 1; min-height: 0; overflow-y: auto; }
    .flag-cell { width: 64px; }
    .flag-cell img { width: 32px; height: 24px; border-radius: 3px; display: block; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  </style>
</head>
<body>

  <aside id="sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app-content-wrapper">

    <header class="navbar navbar-expand-md d-print-none border-bottom">
      <div class="container-fluid">
        <button id="sidebarToggle" class="btn btn-icon" aria-label="Toggle sidebar" title="Toggle sidebar">
          <i class="ti ti-menu-2"></i>
        </button>
        <h1 class="navbar-brand d-none d-sm-inline-block ms-2 mb-0 fs-5">Countries</h1>
        <div class="navbar-nav flex-row order-md-last align-items-center gap-2">
          <div data-active-organisation></div>
          <button class="btn btn-icon" data-theme-toggle title="Toggle dark mode"><i class="ti ti-moon"></i></button>
          <button class="btn btn-icon" id="headerPreferencesBtn" title="Preferences">
            <i class="ti ti-adjustments"></i>
          </button>
          <span class="avatar avatar-sm rounded-circle bg-primary-lt" data-user-initials>?</span>
          <span class="d-none d-xl-block">
            <span class="d-block fw-semibold" style="font-size:.8125rem" data-user-name>—</span>
            <span class="d-block text-secondary" style="font-size:.7rem" data-user-email>—</span>
          </span>
        </div>
      </div>
    </header>

    <div class="page-body">
      <div class="container-fluid">

        <div class="card mb-3" style="flex-shrink:0">
          <div class="card-body py-2">
            <div class="d-flex align-items-center gap-3 flex-wrap">
              <div class="input-icon" style="max-width:280px">
                <span class="input-icon-addon"><i class="ti ti-search"></i></span>
                <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search countries…" />
              </div>
              <span class="text-secondary small ms-auto" id="recordCount"></span>
            </div>
          </div>
        </div>

        <div class="card countries-card">
          <div class="countries-table-scroll">
            <table class="table table-vcenter card-table mb-0">
              <thead>
                <tr>
                  <th class="flag-cell"></th>
                  <th>Code</th>
                  <th>Name</th>
                </tr>
              </thead>
              <tbody id="itemsBody">
                <tr><td colspan="3" class="text-center py-4 text-secondary">
                  <span class="spinner-border spinner-border-sm me-2"></span>Loading…
                </td></tr>
              </tbody>
            </table>
          </div>
          <div class="card-footer d-flex align-items-center justify-content-between" style="flex-shrink:0">
            <div class="text-secondary small" id="pageInfo"></div>
            <div class="d-flex align-items-center gap-2">
              <select id="pageSizeSelect" class="form-select form-select-sm" style="width:auto">
                <option value="25">25 / page</option>
                <option value="50" selected>50 / page</option>
                <option value="100">100 / page</option>
              </select>
              <div class="btn-group">
                <button class="btn btn-sm btn-icon" id="prevPageBtn" title="Previous page"><i class="ti ti-chevron-left"></i></button>
                <button class="btn btn-sm btn-icon" id="nextPageBtn" title="Next page"><i class="ti ti-chevron-right"></i></button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/version.js?r=by26h7dr"></script>
  <script src="../../assets/js/supabase-client.js?r=by26h7dr"></script>
  <script src="../../assets/js/auth.js?r=by26h7dr"></script>
  <script src="../../assets/js/app.js?r=by26h7dr"></script>
  <script src="../../assets/js/theme.js?r=by26h7dr"></script>
  <script src="../../assets/js/sidebar-html.js?r=by26h7dr"></script>
  <script src="../../assets/js/sidebar.js?r=by26h7dr"></script>
  <script src="../../assets/js/profile-modal.js?r=by26h7dr"></script>
  <script>
// Countries is a fixed, view-only ISO 3166-1 reference list - no
// add/edit/delete. Unlike the other lookup pages, this one is not
// organisation-scoped (it's shared, global data - see
// supabase/11-country-remove-org-scope-add-alpha2.sql), so any
// authenticated user can view it, not just admins.

let allItems = [];
let currentPage = 1;
let pageSize = 50;

(async () => {
  const session = await Auth.requireAuth();
  if (!session) return;
  SidebarHtml.inject('../../');
  Sidebar.init();
  Auth.refreshUI();

  await loadItems();

  document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; renderTable(); });
  document.getElementById('pageSizeSelect').addEventListener('change', (e) => {
    pageSize = parseInt(e.target.value, 10);
    currentPage = 1;
    renderTable();
  });
  document.getElementById('prevPageBtn').addEventListener('click', () => { currentPage--; renderTable(); });
  document.getElementById('nextPageBtn').addEventListener('click', () => { currentPage++; renderTable(); });
})();

async function loadItems() {
  const { data, error } = await sb.from('ad_country').select('*').order('name');

  if (error) {
    console.error('[Countries] Load error:', error);
    App.toast('Failed to load countries: ' + error.message, 'danger');
    return;
  }

  allItems = data || [];
  renderTable();
}

function getFiltered() {
  const search = (document.getElementById('searchInput').value || '').toLowerCase();
  return allItems.filter(item => {
    if (search && !item.name?.toLowerCase().includes(search) && !item.country_code?.toLowerCase().includes(search)) return false;
    return true;
  });
}

function renderTable() {
  const filtered = getFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  currentPage = Math.min(Math.max(1, currentPage), totalPages);

  const start = (currentPage - 1) * pageSize;
  const pageItems = filtered.slice(start, start + pageSize);

  document.getElementById('recordCount').textContent = `${filtered.length} countries`;
  document.getElementById('pageInfo').textContent = filtered.length
    ? `Showing ${start + 1}-${Math.min(start + pageSize, filtered.length)} of ${filtered.length}`
    : 'No results';

  document.getElementById('prevPageBtn').disabled = currentPage <= 1;
  document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;

  const tbody = document.getElementById('itemsBody');

  if (!pageItems.length) {
    tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-secondary">
      <i class="ti ti-world mb-1 d-block" style="font-size:1.5rem"></i>No countries found
    </td></tr>`;
    return;
  }

  tbody.innerHTML = pageItems.map(item => {
    const flag = item.alpha2
      ? `<img src="https://flagcdn.com/32x24/${item.alpha2.toLowerCase()}.png" alt="" onerror="this.style.visibility='hidden'">`
      : `<span class="avatar avatar-sm rounded-circle bg-secondary-lt" style="font-size:.6rem">?</span>`;

    return `<tr>
      <td class="flag-cell">${flag}</td>
      <td><span class="badge bg-secondary-lt">${App.escHtml(item.country_code)}</span></td>
      <td class="fw-semibold">${App.escHtml(item.name)}</td>
    </tr>`;
  }).join('');
}
  </script>
</body>
</html>
