<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-app-root="../../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Roles - approveDoc</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/theme.css?r=sa5ozc96" />

  <script>
    (function() {
      try {
        var root = document.documentElement.dataset.appRoot || './';
        var absoluteRoot = new URL(root, window.location.href).pathname;
        var suffix = ':' + absoluteRoot;
        var savedTheme = localStorage.getItem('app_theme');
        var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
        var accent = localStorage.getItem('app_accent' + suffix);
        if (accent) {
          document.documentElement.style.setProperty('--tblr-primary', accent);
          var ah = accent.replace('#','');
          if (ah.length === 3) ah = ah.split('').map(function(c){return c+c;}).join('');
          document.documentElement.style.setProperty('--tblr-primary-rgb', parseInt(ah.slice(0,2),16) + ', ' + parseInt(ah.slice(2,4),16) + ', ' + parseInt(ah.slice(4,6),16));
        }
        var sidebarBg = localStorage.getItem('app_sidebar_bg' + suffix);
        if (sidebarBg) {
          document.documentElement.style.setProperty('--bg-sidebar', sidebarBg);
          var hex = sidebarBg.replace('#', '');
          if (hex.length === 3) hex = hex.split('').map(function(c){return c+c;}).join('');
          var r = parseInt(hex.slice(0,2),16) / 255, g = parseInt(hex.slice(2,4),16) / 255, b = parseInt(hex.slice(4,6),16) / 255;
          var toLinear = function(c){ return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
          var isLight = (0.2126*toLinear(r) + 0.7152*toLinear(g) + 0.0722*toLinear(b)) > 0.5;
          document.documentElement.style.setProperty('--sidebar-fg', isLight ? '#0f172a' : '#ffffff');
          document.documentElement.style.setProperty('--sidebar-fg-rgb', isLight ? '15,23,42' : '255,255,255');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    html, body { height: 100%; overflow: hidden; }
    .app-content-wrapper { height: 100vh; display: flex; flex-direction: column; }
    .page-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 1rem; padding-bottom: 1rem; }
    .page-body > .container-fluid { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .lookup-card { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

    /* Drag-to-reorder - no pagination on this page (dragging across
       page boundaries would be awkward), so the table body scrolls
       internally instead. */
    .job-role-row { cursor: default; }
    .job-role-row.dragging { opacity: .4; }
    .job-role-row.drag-over-top { box-shadow: inset 0 2px 0 0 var(--tblr-primary); }
    .job-role-row.drag-over-bottom { box-shadow: inset 0 -2px 0 0 var(--tblr-primary); }
    .drag-handle { cursor: grab; color: var(--tblr-secondary-color); }
    .drag-handle:active { cursor: grabbing; }
  </style>
</head>
<body>

  <aside id="sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app-content-wrapper">

    <header class="navbar navbar-expand-md d-print-none border-bottom">
      <div class="container-fluid">
        <button id="sidebarToggle" class="btn btn-icon" aria-label="Toggle sidebar" title="Toggle sidebar">
          <i class="ti ti-menu-2"></i>
        </button>
        <h1 class="navbar-brand d-none d-sm-inline-block ms-2 mb-0 page-title-lg">Job Roles</h1>
        <div class="navbar-nav flex-row order-md-last align-items-center gap-2">
          <div data-active-organisation></div>
          <button class="btn btn-icon" data-theme-toggle title="Toggle dark mode"><i class="ti ti-moon"></i></button>
          <button class="btn btn-icon" id="headerPreferencesBtn" title="Preferences">
            <i class="ti ti-adjustments"></i>
          </button>
          <span class="avatar avatar-sm rounded-circle bg-primary-lt" data-user-initials>?</span>
          <span class="d-none d-xl-block">
            <span class="d-block fw-semibold" style="font-size:.8125rem" data-user-name>—</span>
            <span class="d-block text-secondary" style="font-size:.7rem" data-user-email>—</span>
          </span>
        </div>
      </div>
    </header>

    <div class="page-body">
      <div class="container-fluid">

        <div class="card lookup-card">
          <div class="card-header">
            <div class="text-secondary me-2">Search:</div>
            <input type="text" id="searchInput" class="form-control form-control-sm" style="max-width:200px" />
            <button class="btn btn-primary btn-sm ms-3" id="addItemBtn">
              <i class="ti ti-plus me-1"></i>Add job role
            </button>
          </div>
          <div style="flex:1; min-height:0; overflow-y:auto" id="tableScrollPane">
            <table class="table table-vcenter card-table table-hover mb-0">
              <thead>
                <tr>
                  <th style="width:36px"></th>
                  <th>Name</th>
                  <th>Department</th>
                  <th class="w-1"></th>
                </tr>
              </thead>
              <tbody id="itemsBody">
                <tr><td colspan="4" class="text-center py-4 text-secondary">
                  <span class="spinner-border spinner-border-sm me-2"></span>Loading…
                </td></tr>
              </tbody>
            </table>
          </div>
          <div class="card-footer" style="flex-shrink:0">
            <p class="m-0 text-secondary" id="pageInfo"></p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="modal modal-blur fade" id="itemModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="itemModalTitle">Add job role</h5>
          <button type="button" class="modal-close-btn" data-bs-dismiss="modal" aria-label="Close"><i class="ti ti-x"></i></button>
        </div>
        <div class="modal-body">
          <div id="itemModalError" class="alert alert-danger d-none py-2 small mb-3"></div>
          <input type="hidden" id="itemId" />

          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Name <span class="text-danger">*</span></label>
              <input type="text" id="itemName" class="form-control" placeholder="e.g. Account Manager" />
            </div>
            <div class="col-12">
              <label class="form-label">Department</label>
              <select id="itemDepartment" class="form-select">
                <option value="">— None —</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveItemBtn">
            <span id="saveItemLabel">Save</span>
            <span id="saveItemSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal modal-blur fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-status bg-danger"></div>
        <div class="modal-body text-center py-4" style="min-height:175px">
          <i class="ti ti-trash text-danger mb-2" style="font-size:2.2rem"></i>
          <div style="font-size:16px;font-weight:600;margin-top:20px;margin-bottom:4px">Delete job role "<span id="deleteItemName"></span>"?</div>
          <div style="font-size:14px;color:#d63939;margin-top:10px">This may also affect data linked to this record.</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/version.js?r=sa5ozc96"></script>
  <script src="../../assets/js/supabase-client.js?r=sa5ozc96"></script>
  <script src="../../assets/js/auth.js?r=sa5ozc96"></script>
  <script src="../../assets/js/app.js?r=sa5ozc96"></script>
  <script src="../../assets/js/theme.js?r=sa5ozc96"></script>
  <script src="../../assets/js/sidebar-html.js?r=sa5ozc96"></script>
  <script src="../../assets/js/sidebar.js?r=sa5ozc96"></script>
  <script src="../../assets/js/profile-modal.js?r=sa5ozc96"></script>
  <script>
let itemModal, deleteModal;
let allItems = [];
let allDepartments = [];
let pendingDeleteId = null;

(async () => {
  const session = await Auth.requireAuth();
  if (!session) return;
  SidebarHtml.inject('../../');
  Sidebar.init();
  Auth.refreshUI();

  if (!Auth.isAdmin()) {
    App.toast('You do not have access to this page', 'danger');
    window.location.href = '../../index.html';
    return;
  }

  itemModal   = new bootstrap.Modal(document.getElementById('itemModal'));
  deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));

  await loadDepartments();
  await loadItems();

  document.getElementById('searchInput').addEventListener('input', renderTable);
  document.getElementById('addItemBtn').addEventListener('click', () => openModal());
  document.getElementById('saveItemBtn').addEventListener('click', saveItem);
  document.getElementById('confirmDeleteBtn').addEventListener('click', confirmDelete);
  document.getElementById('itemModal').addEventListener('hidden.bs.modal', resetModal);
})();

async function loadDepartments() {
  const { data, error } = await sb.from('ad_department').select('*').eq('organisation_id', Auth.getOrganisationId()).order('name');
  if (error) { console.error('[Job Roles] departments load error:', error); return; }
  allDepartments = data || [];

  const select = document.getElementById('itemDepartment');
  allDepartments.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.department_id;
    opt.textContent = d.name;
    select.appendChild(opt);
  });
}

async function loadItems() {
  const { data, error } = await sb.from('ad_job_role').select('*').eq('organisation_id', Auth.getOrganisationId()).order('sort_order');

  if (error) {
    console.error('[Job Roles] Load error:', error);
    App.toast('Failed to load job roles: ' + error.message, 'danger');
    return;
  }

  allItems = data || [];
  renderTable();
}

function getFiltered() {
  const search = (document.getElementById('searchInput').value || '').toLowerCase();
  return allItems.filter(item => {
    if (search && !item.name?.toLowerCase().includes(search)) return false;
    return true;
  });
}

function departmentName(departmentId) {
  if (!departmentId) return null;
  const dept = allDepartments.find(d => d.department_id === departmentId);
  return dept ? dept.name : null;
}

function renderTable() {
  const filtered = getFiltered();
  const searching = !!(document.getElementById('searchInput').value || '').trim();

  document.getElementById('pageInfo').textContent = filtered.length
    ? `${filtered.length} job role${filtered.length === 1 ? '' : 's'}`
    : 'No matching entries found';

  const tbody = document.getElementById('itemsBody');

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-secondary">
      <i class="ti ti-id-badge mb-1 d-block" style="font-size:1.5rem"></i>No job roles found
    </td></tr>`;
    return;
  }

  // Drag-to-reorder only makes sense against the full, unfiltered
  // order - disable the handle while a search is active so dragging
  // a filtered subset can't silently scramble the real sort_order.
  tbody.innerHTML = filtered.map(item => {
    const deptName = departmentName(item.department_id);

    return `<tr class="job-role-row" data-id="${item.job_role_id}" draggable="${searching ? 'false' : 'true'}">
      <td>${searching ? '' : '<i class="ti ti-grip-vertical drag-handle"></i>'}</td>
      <td class="fw-semibold">${App.escHtml(item.name)}</td>
      <td class="text-secondary">${deptName ? App.escHtml(deptName) : '—'}</td>
      <td>
        <div class="btn-list flex-nowrap">
          <button class="btn btn-icon btn-icon-lg edit-btn" data-id="${item.job_role_id}" title="Edit"><i class="ti ti-edit"></i></button>
          <button class="btn btn-icon btn-icon-lg text-danger delete-btn" data-id="${item.job_role_id}" data-name="${App.escHtml(item.name)}" title="Delete"><i class="ti ti-trash"></i></button>
        </div>
      </td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = allItems.find(i => String(i.job_role_id) === btn.dataset.id);
      if (item) openModal(item);
    });
  });

  tbody.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      pendingDeleteId = btn.dataset.id;
      document.getElementById('deleteItemName').textContent = btn.dataset.name;
      deleteModal.show();
    });
  });

  if (!searching) wireUpDragReorder(tbody);
}

// Native HTML5 drag-and-drop, reordering rows within the same table.
// On drop, recomputes sort_order for the WHOLE list (not just the
// two rows involved) to keep values clean/sequential, then writes
// every changed row back in one batch.
function wireUpDragReorder(tbody) {
  let draggedId = null;

  tbody.querySelectorAll('.job-role-row').forEach(row => {
    row.addEventListener('dragstart', () => {
      draggedId = row.dataset.id;
      row.classList.add('dragging');
    });

    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      tbody.querySelectorAll('.job-role-row').forEach(r => r.classList.remove('drag-over-top', 'drag-over-bottom'));
    });

    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (row.dataset.id === draggedId) return;

      const rect = row.getBoundingClientRect();
      const isTopHalf = (e.clientY - rect.top) < rect.height / 2;
      row.classList.toggle('drag-over-top', isTopHalf);
      row.classList.toggle('drag-over-bottom', !isTopHalf);
    });

    row.addEventListener('dragleave', () => {
      row.classList.remove('drag-over-top', 'drag-over-bottom');
    });

    row.addEventListener('drop', async (e) => {
      e.preventDefault();
      row.classList.remove('drag-over-top', 'drag-over-bottom');
      if (!draggedId || row.dataset.id === draggedId) return;

      const rect = row.getBoundingClientRect();
      const dropBefore = (e.clientY - rect.top) < rect.height / 2;
      await reorderItems(draggedId, row.dataset.id, dropBefore);
    });
  });
}

async function reorderItems(draggedId, targetId, dropBefore) {
  const ordered = [...allItems].sort((a, b) => a.sort_order - b.sort_order);
  const draggedIndex = ordered.findIndex(i => i.job_role_id === draggedId);
  if (draggedIndex === -1) return;

  const [draggedItem] = ordered.splice(draggedIndex, 1);
  let targetIndex = ordered.findIndex(i => i.job_role_id === targetId);
  if (targetIndex === -1) return;
  if (!dropBefore) targetIndex += 1;

  ordered.splice(targetIndex, 0, draggedItem);

  // Recompute sequential sort_order for the whole list, then only
  // write back the rows whose value actually changed.
  const updates = [];
  ordered.forEach((item, index) => {
    const newSortOrder = index;
    if (item.sort_order !== newSortOrder) {
      updates.push({ job_role_id: item.job_role_id, sort_order: newSortOrder });
    }
  });

  if (!updates.length) return;

  const results = await Promise.all(
    updates.map(u => sb.from('ad_job_role').update({ sort_order: u.sort_order }).eq('job_role_id', u.job_role_id))
  );
  const failed = results.find(r => r.error);
  if (failed) {
    App.toast('Failed to save new order: ' + failed.error.message, 'danger');
    await loadItems();
    return;
  }

  await loadItems();
}

function openModal(item = null) {
  resetModal();
  if (item) {
    document.getElementById('itemModalTitle').textContent = 'Edit job role';
    document.getElementById('saveItemLabel').textContent  = 'Update';
    document.getElementById('itemId').value   = item.job_role_id;
    document.getElementById('itemName').value = item.name || '';
    document.getElementById('itemDepartment').value = item.department_id || '';
  }
  itemModal.show();
  setTimeout(() => document.getElementById('itemName').focus(), 300);
}

function resetModal() {
  document.getElementById('itemModalTitle').textContent = 'Add job role';
  document.getElementById('saveItemLabel').textContent  = 'Save';
  document.getElementById('itemModalError').classList.add('d-none');
  document.getElementById('itemId').value   = '';
  document.getElementById('itemName').value = '';
  document.getElementById('itemDepartment').value = '';
}

async function saveItem() {
  const errorEl = document.getElementById('itemModalError');
  errorEl.classList.add('d-none');

  const id   = document.getElementById('itemId').value;
  const name = document.getElementById('itemName').value.trim();
  const departmentId = document.getElementById('itemDepartment').value || null;

  if (!name) {
    errorEl.textContent = 'Name is required.';
    errorEl.classList.remove('d-none');
    return;
  }

  document.getElementById('saveItemLabel').textContent = id ? 'Saving…' : 'Adding…';
  document.getElementById('saveItemSpinner').classList.remove('d-none');
  document.getElementById('saveItemBtn').disabled = true;

  let error;
  if (id) {
    const payload = { name, department_id: departmentId };
    ({ error } = await sb.from('ad_job_role').update(payload).eq('job_role_id', id));
  } else {
    // New roles go to the end of the current order.
    const maxSortOrder = allItems.reduce((max, i) => Math.max(max, i.sort_order ?? 0), -1);
    const payload = { name, department_id: departmentId, sort_order: maxSortOrder + 1, organisation_id: Auth.getOrganisationId() };
    ({ error } = await sb.from('ad_job_role').insert(payload));
  }

  document.getElementById('saveItemLabel').textContent = id ? 'Update' : 'Save';
  document.getElementById('saveItemSpinner').classList.add('d-none');
  document.getElementById('saveItemBtn').disabled = false;

  if (error) {
    errorEl.textContent = 'Save failed: ' + (error.message || 'Unknown error');
    errorEl.classList.remove('d-none');
    return;
  }

  itemModal.hide();
  App.toast(id ? 'Updated' : 'Added');
  await loadItems();
}

async function confirmDelete() {
  if (!pendingDeleteId) return;
  const { error } = await sb.from('ad_job_role').delete().eq('job_role_id', pendingDeleteId);
  deleteModal.hide();
  if (error) { App.toast('Delete failed: ' + error.message, 'danger'); return; }
  App.toast('Deleted');
  pendingDeleteId = null;
  await loadItems();
}
  </script>
</body>
