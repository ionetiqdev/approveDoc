<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-app-root="../../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Org Chart - approveDoc</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <script>
    (function() {
      try {
        var root = document.documentElement.dataset.appRoot || './';
        var absoluteRoot = new URL(root, window.location.href).pathname;
        var suffix = ':' + absoluteRoot;
        var savedTheme = localStorage.getItem('app_theme');
        var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
        var accent = localStorage.getItem('app_accent' + suffix);
        if (accent) {
          document.documentElement.style.setProperty('--tblr-primary', accent);
          var ah = accent.replace('#','');
          if (ah.length === 3) ah = ah.split('').map(function(c){return c+c;}).join('');
          document.documentElement.style.setProperty('--tblr-primary-rgb', parseInt(ah.slice(0,2),16) + ', ' + parseInt(ah.slice(2,4),16) + ', ' + parseInt(ah.slice(4,6),16));
        }
        var sidebarBg = localStorage.getItem('app_sidebar_bg' + suffix);
        if (sidebarBg) document.documentElement.style.setProperty('--bg-sidebar', sidebarBg);
      } catch(e) {}
    })();
  </script>
  <style>
    /* Tree structure */
    .org-tree { font-size: .875rem; }

    .org-level { margin-bottom: 1.25rem; }
    .org-level-label {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--tblr-secondary-color);
      padding: .35rem .75rem;
      margin-bottom: .5rem;
    }

    /* Senior manager row */
    .org-senior-manager {
      background: var(--tblr-primary);
      color: #fff;
      border-radius: var(--tblr-border-radius);
      padding: .5rem .75rem;
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: .35rem;
      cursor: pointer;
      transition: opacity .15s;
    }
    .org-senior-manager:hover { opacity: .85; }

    /* Manager row */
    .org-manager-block { margin-left: 1.5rem; margin-bottom: .75rem; }
    .org-manager {
      background: var(--tblr-card-bg, #fff);
      border: 1px solid var(--tblr-border-color);
      border-left: 3px solid var(--tblr-primary);
      border-radius: var(--tblr-border-radius);
      padding: .45rem .75rem;
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: .3rem;
      cursor: pointer;
      transition: background .15s;
    }
    .org-manager:hover { background: var(--tblr-bg-surface-secondary); }

    /* User rows */
    .org-users-block { margin-left: 3rem; }
    .org-user {
      padding: .35rem .6rem;
      display: flex;
      align-items: center;
      gap: .5rem;
      border-radius: var(--tblr-border-radius);
      cursor: pointer;
      transition: background .15s;
      margin-bottom: .2rem;
    }
    .org-user:hover { background: var(--tblr-bg-surface-secondary); }

    /* No manager group */
    .org-no-manager-block { margin-top: 2rem; }
    .org-no-manager-label {
      font-size: .75rem;
      font-weight: 600;
      color: var(--tblr-secondary-color);
      padding: .35rem .75rem;
      border-top: 1px solid var(--tblr-border-color);
      margin-bottom: .35rem;
    }

    /* Avatar inline */
    .org-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .65rem; font-weight: 600;
    }
    .org-avatar-img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .org-name { font-weight: 500; flex-grow: 1; }
    .org-email { font-size: .75rem; color: var(--tblr-secondary-color); }
    .org-edit-btn {
      opacity: 0;
      transition: opacity .15s;
      border: none; background: none;
      color: var(--tblr-secondary-color);
      padding: 2px 4px; border-radius: 4px; cursor: pointer;
      flex-shrink: 0;
    }
    .org-senior-manager .org-edit-btn { color: rgba(255,255,255,.7); }
    .org-senior-manager:hover .org-edit-btn,
    .org-manager:hover .org-edit-btn,
    .org-user:hover .org-edit-btn { opacity: 1; }

    /* User modal */
    .pw-toggle-btn {
      position: absolute; right: .65rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--tblr-secondary-color); cursor: pointer; padding: 0; font-size: 1rem; z-index: 5;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <aside class="navbar navbar-vertical navbar-expand-lg" id="sidebar"></aside>
    <div class="page-wrapper">
      <div class="page-header d-print-none">
        <div class="container-xl">
          <div class="row align-items-center">
            <div class="col">
              <h2 class="page-title">Org Chart</h2>
              <p class="text-secondary small mb-0">Organisation hierarchy — Senior Manager → Manager → User</p>
            </div>
          </div>
        </div>
      </div>
      <div class="page-body">
        <div class="container-xl">
          <div class="card">
            <div class="card-body">
              <div id="orgTree" class="org-tree">
                <div class="text-center py-5 text-secondary">
                  <div class="spinner-border spinner-border-sm me-2"></div>Loading…
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- User edit modal -->
  <div class="modal modal-blur fade" id="userModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit user</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="userModalError" class="alert alert-danger d-none py-2 small mb-3"></div>
          <input type="hidden" id="userId" />
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Display name <span class="text-danger">*</span></label>
              <input type="text" id="userDisplayName" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" id="userEmail" class="form-control" disabled />
            </div>
            <div class="col-md-6">
              <label class="form-label">Job title</label>
              <input type="text" id="userJobTitle" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Role</label>
              <select id="userRole" class="form-select">
                <option value="view">View</option>
                <option value="user">User</option>
                <option value="admin">Admin</option>
                <option value="super_admin">Super Admin</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Manager</label>
              <div class="input-group">
                <input type="text" id="managerSearch" class="form-control" placeholder="Search users…" autocomplete="off" />
                <button class="btn btn-outline-secondary" type="button" id="managerClear"><i class="ti ti-x"></i></button>
              </div>
              <input type="hidden" id="managerId" />
              <div id="managerDropdown" class="dropdown-menu w-100" style="display:none;max-height:180px;overflow-y:auto;position:absolute;z-index:9999"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Senior Manager</label>
              <div class="input-group">
                <input type="text" id="seniorManagerSearch" class="form-control" placeholder="Search users…" autocomplete="off" />
                <button class="btn btn-outline-secondary" type="button" id="seniorManagerClear"><i class="ti ti-x"></i></button>
              </div>
              <input type="hidden" id="seniorManagerId" />
              <div id="seniorManagerDropdown" class="dropdown-menu w-100" style="display:none;max-height:180px;overflow-y:auto;position:absolute;z-index:9999"></div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveUserBtn">
            <span id="saveUserLabel">Save</span>
            <span id="saveUserSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/version.js"></script>
  <script src="../../assets/js/supabase-client.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/sidebar-html.js"></script>
  <script src="../../assets/js/sidebar.js"></script>
  <script src="../../assets/js/profile-modal.js"></script>
  <script src="../../assets/js/status-widget.js"></script>
  <script>
let allUsers   = [];
let userModal  = null;

// ── Init ────────────────────────────────────────────────────────────────────
(async () => {
  const session = await Auth.requireAuth();
  if (!session) return;
  SidebarHtml.inject('../../');
  Sidebar.init();
  Auth.refreshUI();
  await loadAndRender();
  initModal();
})();

// ── Data ─────────────────────────────────────────────────────────────────────
async function loadAndRender() {
  const orgId = Auth.getOrganisationId();
  const { data, error } = await sb.from('ad_user')
    .select('user_id, first_name, last_name, email, manager_id, senior_manager_id')
    .eq('organisation_id', orgId);

  if (error) { document.getElementById('orgTree').textContent = 'Failed to load users.'; return; }

  // Also fetch profiles for display_name and avatar_url
  const { data: profiles } = await sb.from('profiles')
    .select('id, display_name, avatar_url')
    .eq('organisation_id', orgId);

  const profileMap = {};
  (profiles || []).forEach(p => { profileMap[p.id] = p; });

  allUsers = (data || []).map(u => ({
    ...u,
    display_name: profileMap[u.user_id]?.display_name || `${u.first_name} ${u.last_name}`.trim() || u.email,
    avatar_url:   profileMap[u.user_id]?.avatar_url || null,
  }));

  renderTree();
}

// ── Tree ─────────────────────────────────────────────────────────────────────
function renderTree() {
  const userMap = {};
  allUsers.forEach(u => { userMap[u.user_id] = u; });

  const sortName = (a, b) => (a.display_name || '').localeCompare(b.display_name || '');

  // Group users by senior_manager_id and manager_id
  // Structure: seniorMgr → { mgr → [users] }
  const tree = {}; // tree[senior_manager_id || '__none__'][manager_id || '__none__'] = [users]

  allUsers.forEach(u => {
    const smKey = u.senior_manager_id || '__none__';
    const mKey  = u.manager_id        || '__none__';
    if (!tree[smKey]) tree[smKey] = {};
    if (!tree[smKey][mKey]) tree[smKey][mKey] = [];
    tree[smKey][mKey].push(u);
  });

  // Collect distinct senior managers (excluding __none__)
  const seniorManagerIds = Object.keys(tree).filter(k => k !== '__none__').sort((a, b) => {
    const ua = userMap[a], ub = userMap[b];
    return sortName(ua || {display_name:''}, ub || {display_name:''});
  });

  let html = '';

  // ── Senior manager groups ──
  seniorManagerIds.forEach(smId => {
    const sm = userMap[smId];
    const smName = sm?.display_name || 'Unknown';

    html += `<div class="org-level">`;
    html += `<div class="org-senior-manager" data-id="${smId}">
      ${avatarHtml(sm, '#fff')}
      <div class="org-name">${App.escHtml(smName)}</div>
      <div class="org-email">${App.escHtml(sm?.email || '')}</div>
      <button class="org-edit-btn" data-id="${smId}" title="Edit"><i class="ti ti-edit" style="font-size:14px"></i></button>
    </div>`;

    // Managers under this senior manager
    const managers = Object.keys(tree[smId]).sort((a, b) => {
      if (a === '__none__') return 1;
      if (b === '__none__') return -1;
      return sortName(userMap[a] || {}, userMap[b] || {});
    });

    managers.forEach(mId => {
      const m = mId === '__none__' ? null : userMap[mId];
      const mName = m?.display_name || 'No manager';

      html += `<div class="org-manager-block">`;
      if (mId !== '__none__') {
        html += `<div class="org-manager" data-id="${mId}">
          ${avatarHtml(m)}
          <div class="org-name">${App.escHtml(mName)}</div>
          <div class="org-email">${App.escHtml(m?.email || '')}</div>
          <button class="org-edit-btn" data-id="${mId}" title="Edit"><i class="ti ti-edit" style="font-size:14px"></i></button>
        </div>`;
      }

      // Users under this manager
      const users = [...tree[smId][mId]].sort(sortName);
      if (users.length) {
        html += `<div class="org-users-block">`;
        users.forEach(u => {
          html += `<div class="org-user" data-id="${u.user_id}">
            ${avatarHtml(u)}
            <div class="org-name">${App.escHtml(u.display_name)}</div>
            <div class="org-email">${App.escHtml(u.email)}</div>
            <button class="org-edit-btn" data-id="${u.user_id}" title="Edit"><i class="ti ti-edit" style="font-size:14px"></i></button>
          </div>`;
        });
        html += `</div>`;
      }

      html += `</div>`; // manager-block
    });

    html += `</div>`; // org-level
  });

  // ── No manager set ──
  // Users who have no senior_manager_id — collect them
  const noMgrUsers = [];
  if (tree['__none__']) {
    Object.values(tree['__none__']).forEach(arr => arr.forEach(u => noMgrUsers.push(u)));
  }
  // Remove duplicates (user may appear under their own senior manager group above)
  const treeSMUserIds = new Set();
  seniorManagerIds.forEach(smId => {
    Object.values(tree[smId]).forEach(arr => arr.forEach(u => treeSMUserIds.add(u.user_id)));
    treeSMUserIds.add(smId); // the senior manager themselves
  });
  const unassigned = noMgrUsers.filter(u => !treeSMUserIds.has(u.user_id)).sort(sortName);

  if (unassigned.length) {
    html += `<div class="org-no-manager-block">
      <div class="org-no-manager-label"><i class="ti ti-user-off me-1"></i>No Manager Set</div>
      <div style="margin-left:1.5rem">`;
    unassigned.forEach(u => {
      html += `<div class="org-user" data-id="${u.user_id}">
        ${avatarHtml(u)}
        <div class="org-name">${App.escHtml(u.display_name)}</div>
        <div class="org-email">${App.escHtml(u.email)}</div>
        <button class="org-edit-btn" data-id="${u.user_id}" title="Edit"><i class="ti ti-edit" style="font-size:14px"></i></button>
      </div>`;
    });
    html += `</div></div>`;
  }

  if (!html) html = '<div class="text-secondary text-center py-4">No users found.</div>';

  const tree_el = document.getElementById('orgTree');
  tree_el.innerHTML = html;

  // Wire edit buttons
  tree_el.querySelectorAll('.org-edit-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openEditModal(btn.dataset.id);
    });
  });

  // Whole row also opens modal
  tree_el.querySelectorAll('[data-id]').forEach(el => {
    el.addEventListener('click', () => openEditModal(el.dataset.id));
  });
}

function avatarHtml(user, fallbackColor) {
  if (!user) return '';
  if (user.avatar_url) {
    return `<img src="${user.avatar_url}" class="org-avatar-img" alt="">`;
  }
  const initials = (user.display_name || user.email || '?').split(' ').map(w => w[0]).filter(Boolean).join('').toUpperCase().slice(0,2);
  const bg = fallbackColor || 'var(--tblr-primary)';
  const fg = fallbackColor ? 'var(--tblr-primary)' : '#fff';
  return `<div class="org-avatar" style="background:${bg === '#fff' ? 'rgba(255,255,255,.2)' : 'var(--tblr-primary-lt)'};color:${fg === '#fff' ? '#fff' : 'var(--tblr-primary)'}">${initials}</div>`;
}

// ── Edit modal ────────────────────────────────────────────────────────────────
function initModal() {
  userModal = new bootstrap.Modal(document.getElementById('userModal'));

  wirePickerField('managerSearch',       'managerId',       'managerDropdown',       'managerClear');
  wirePickerField('seniorManagerSearch', 'seniorManagerId', 'seniorManagerDropdown', 'seniorManagerClear');

  document.getElementById('saveUserBtn').addEventListener('click', saveUser);
}

function openEditModal(userId) {
  const user = allUsers.find(u => u.user_id === userId);
  if (!user) return;

  document.getElementById('userModalError').classList.add('d-none');
  document.getElementById('userId').value          = user.user_id;
  document.getElementById('userDisplayName').value = user.display_name || '';
  document.getElementById('userEmail').value        = user.email || '';
  document.getElementById('userJobTitle').value     = '';
  document.getElementById('userRole').value         = 'user';

  // Fetch full profile
  sb.from('profiles').select('job_title, role').eq('id', userId).single().then(({ data }) => {
    if (data?.job_title) document.getElementById('userJobTitle').value = data.job_title;
    if (data?.role)      document.getElementById('userRole').value     = data.role;
  });

  // Set manager pickers
  setPickerValue('managerSearch',       'managerId',       user.manager_id);
  setPickerValue('seniorManagerSearch', 'seniorManagerId', user.senior_manager_id);

  userModal.show();
}

async function saveUser() {
  const errEl = document.getElementById('userModalError');
  errEl.classList.add('d-none');

  const id          = document.getElementById('userId').value;
  const displayName = document.getElementById('userDisplayName').value.trim();
  const jobTitle    = document.getElementById('userJobTitle').value.trim();
  const role        = document.getElementById('userRole').value;
  const managerId   = document.getElementById('managerId').value || null;
  const seniorMgrId = document.getElementById('seniorManagerId').value || null;

  if (!displayName) {
    errEl.textContent = 'Display name is required.';
    errEl.classList.remove('d-none');
    return;
  }

  document.getElementById('saveUserLabel').textContent = 'Saving…';
  document.getElementById('saveUserSpinner').classList.remove('d-none');
  document.getElementById('saveUserBtn').disabled = true;

  try {
    const { error: pe } = await sb.from('profiles').update({
      display_name: displayName,
      job_title:    jobTitle || null,
      role,
      updated_at:   new Date().toISOString(),
    }).eq('id', id);
    if (pe) throw pe;

    const { error: ue } = await sb.from('ad_user').update({
      manager_id:        managerId,
      senior_manager_id: seniorMgrId,
    }).eq('user_id', id);
    if (ue) throw ue;

    userModal.hide();
    App.toast('User updated');
    await loadAndRender();

  } catch(err) {
    errEl.textContent = 'Save failed: ' + (err.message || err);
    errEl.classList.remove('d-none');
  } finally {
    document.getElementById('saveUserLabel').textContent = 'Save';
    document.getElementById('saveUserSpinner').classList.add('d-none');
    document.getElementById('saveUserBtn').disabled = false;
  }
}

// ── Picker helper ─────────────────────────────────────────────────────────────
function wirePickerField(inputId, hiddenId, dropdownId, clearId) {
  const input    = document.getElementById(inputId);
  const hidden   = document.getElementById(hiddenId);
  const dropdown = document.getElementById(dropdownId);
  const clearBtn = document.getElementById(clearId);

  function show(term) {
    const lower = term.toLowerCase();
    const matches = allUsers
      .filter(u => u.display_name?.toLowerCase().includes(lower) || u.email?.toLowerCase().includes(lower))
      .slice(0, 12);
    if (!matches.length) { dropdown.style.display = 'none'; return; }
    dropdown.innerHTML = matches.map(u =>
      `<button type="button" class="dropdown-item" data-id="${u.user_id}" data-name="${App.escHtml(u.display_name)}">
        ${App.escHtml(u.display_name)}
        <small class="text-secondary d-block">${App.escHtml(u.email)}</small>
       </button>`
    ).join('');
    dropdown.querySelectorAll('.dropdown-item').forEach(btn => {
      btn.addEventListener('click', () => {
        hidden.value = btn.dataset.id;
        input.value  = btn.dataset.name;
        dropdown.style.display = 'none';
      });
    });
    dropdown.style.display = 'block';
  }

  input.addEventListener('input', () => {
    hidden.value = '';
    const t = input.value.trim();
    t.length ? show(t) : (dropdown.style.display = 'none');
  });
  input.addEventListener('focus', () => { if (input.value.trim()) show(input.value.trim()); });
  clearBtn.addEventListener('click', () => { hidden.value = ''; input.value = ''; dropdown.style.display = 'none'; });
  document.addEventListener('click', e => {
    if (!input.contains(e.target) && !dropdown.contains(e.target)) dropdown.style.display = 'none';
  });
}

function setPickerValue(inputId, hiddenId, userId) {
  document.getElementById(hiddenId).value = userId || '';
  if (userId) {
    const u = allUsers.find(x => x.user_id === userId);
    document.getElementById(inputId).value = u?.display_name || '';
  } else {
    document.getElementById(inputId).value = '';
  }
}
  </script>
</body>
</html>
