<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-app-root="../../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Org Chart - approveDoc</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <script>
    (function() {
      try {
        var root = document.documentElement.dataset.appRoot || './';
        var absoluteRoot = new URL(root, window.location.href).pathname;
        var suffix = ':' + absoluteRoot;
        var savedTheme = localStorage.getItem('app_theme');
        var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
        var accent = localStorage.getItem('app_accent' + suffix);
        if (accent) {
          document.documentElement.style.setProperty('--tblr-primary', accent);
          var ah = accent.replace('#','');
          if (ah.length === 3) ah = ah.split('').map(function(c){return c+c;}).join('');
          document.documentElement.style.setProperty('--tblr-primary-rgb', parseInt(ah.slice(0,2),16) + ', ' + parseInt(ah.slice(2,4),16) + ', ' + parseInt(ah.slice(4,6),16));
        }
        var sidebarBg = localStorage.getItem('app_sidebar_bg' + suffix);
        if (sidebarBg) {
          document.documentElement.style.setProperty('--bg-sidebar', sidebarBg);
          var hex = sidebarBg.replace('#', '');
          if (hex.length === 3) hex = hex.split('').map(function(c){return c+c;}).join('');
          var r = parseInt(hex.slice(0,2),16) / 255, g = parseInt(hex.slice(2,4),16) / 255, b = parseInt(hex.slice(4,6),16) / 255;
          var toLinear = function(c){ return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
          var isLight = (0.2126*toLinear(r) + 0.7152*toLinear(g) + 0.0722*toLinear(b)) > 0.5;
          document.documentElement.style.setProperty('--sidebar-fg', isLight ? '#0f172a' : '#ffffff');
          document.documentElement.style.setProperty('--sidebar-fg-rgb', isLight ? '15,23,42' : '255,255,255');
        }
      } catch(e) {}
    })();
  </script>
  <style>
    html, body { height: 100%; overflow: hidden; }
    .app-content-wrapper { height: 100vh; display: flex; flex-direction: column; }
    .page-body { flex: 1; overflow-y: auto; }

    /* ── Tree ── */
    .org-tree { font-size: .875rem; padding: .5rem 0; }

    /* Senior manager */
    .org-sm-row {
      display: flex; align-items: center; gap: .65rem;
      padding: .5rem .75rem;
      background: rgb(var(--tblr-primary-rgb), .12);
      border-left: 3px solid var(--tblr-primary);
      border-radius: var(--tblr-border-radius);
      margin-bottom: .3rem;
      cursor: pointer;
      transition: background .15s;
      user-select: none;
    }
    .org-sm-row:hover { background: rgb(var(--tblr-primary-rgb), .2); }

    /* Manager */
    .org-m-block { margin-left: 2rem; margin-top: .4rem; margin-bottom: .5rem; }
    .org-m-row {
      display: flex; align-items: center; gap: .65rem;
      padding: .4rem .75rem;
      border-left: 2px solid var(--tblr-border-color);
      border-radius: 0 var(--tblr-border-radius) var(--tblr-border-radius) 0;
      margin-bottom: .25rem;
      cursor: pointer;
      transition: background .15s;
      user-select: none;
    }
    .org-m-row:hover { background: var(--tblr-bg-surface-secondary); }

    /* Users */
    .org-u-block { margin-left: 4rem; }
    .org-u-row {
      display: flex; align-items: center; gap: .55rem;
      padding: .3rem .5rem;
      border-radius: var(--tblr-border-radius);
      margin-bottom: .15rem;
      cursor: grab;
      transition: background .15s;
      user-select: none;
    }
    .org-u-row:hover { background: var(--tblr-bg-surface-secondary); }
    .org-u-row:active { cursor: grabbing; }

    /* No manager section */
    .org-no-mgr { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--tblr-border-color); }
    .org-no-mgr-label {
      font-size: .7rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
      color: var(--tblr-secondary-color); padding: 0 .25rem .5rem;
    }

    /* Shared row elements */
    .org-name { font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .org-email { font-size: .72rem; color: var(--tblr-secondary-color); white-space: nowrap; }
    .org-edit {
      opacity: 0; transition: opacity .15s;
      background: none; border: none; color: var(--tblr-secondary-color);
      padding: 2px 4px; cursor: pointer; border-radius: 4px; flex-shrink: 0;
    }
    .org-sm-row:hover .org-edit,
    .org-m-row:hover .org-edit,
    .org-u-row:hover .org-edit { opacity: 1; }

    /* Avatar */
    .org-av {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .6rem; font-weight: 700; overflow: hidden;
    }
    .org-av img { width: 100%; height: 100%; object-fit: cover; }

    /* Drag and drop */
    .org-dragging {
      opacity: .4;
    }
    .org-drop-target {
      outline: 2px dashed var(--tblr-primary);
      outline-offset: 2px;
      background: rgb(var(--tblr-primary-rgb), .08) !important;
    }
    .drag-hint {
      font-size: .72rem; color: var(--tblr-secondary-color);
      text-align: center; padding: .35rem;
      background: var(--tblr-bg-surface-secondary);
      border-radius: var(--tblr-border-radius);
      margin-bottom: .5rem;
    }

    /* Modal */
    .pw-toggle-btn {
      position: absolute; right: .65rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--tblr-secondary-color); cursor: pointer; padding: 0; font-size: 1rem; z-index: 5;
    }
  </style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>

  <script>
let allUsers  = [];
let userModal = null;
let dragUserId = null;

// ── Init ──────────────────────────────────────────────────────────────────────
(async () => {
  const session = await Auth.requireAuth();
  if (!session) return;
  SidebarHtml.inject('../../');
  Sidebar.init();
  Auth.refreshUI();
  await loadAndRender();
  userModal = new bootstrap.Modal(document.getElementById('userModal'));
  wirePickerField('managerSearch',       'managerId',       'managerDropdown',       'managerClear');
  wirePickerField('seniorManagerSearch', 'seniorManagerId', 'seniorManagerDropdown', 'seniorManagerClear');
  document.getElementById('saveUserBtn').addEventListener('click', saveUser);
})();

// ── Data ──────────────────────────────────────────────────────────────────────
async function loadAndRender() {
  const orgId = Auth.getOrganisationId();

  const [{ data: adUsers }, { data: profiles }] = await Promise.all([
    sb.from('ad_user').select('user_id,first_name,last_name,email,manager_id,senior_manager_id').eq('organisation_id', orgId),
    sb.from('profiles').select('id,display_name,avatar_url,role,job_title').eq('organisation_id', orgId),
  ]);

  const profMap = {};
  (profiles || []).forEach(p => { profMap[p.id] = p; });

  allUsers = (adUsers || []).map(u => ({
    ...u,
    display_name: profMap[u.user_id]?.display_name || `${u.first_name||''} ${u.last_name||''}`.trim() || u.email,
    avatar_url:   profMap[u.user_id]?.avatar_url || null,
    role:         profMap[u.user_id]?.role || 'user',
    job_title:    profMap[u.user_id]?.job_title || '',
  }));

  renderTree();
}

// ── Tree render ───────────────────────────────────────────────────────────────
function renderTree() {
  const byId  = {};
  allUsers.forEach(u => { byId[u.user_id] = u; });
  const sort  = (a, b) => (a.display_name||'').localeCompare(b.display_name||'');

  // Build senior manager → manager → users structure
  // Key: senior_manager_id (or '__none__') → manager_id (or '__none__') → [users]
  const tree = {};
  allUsers.forEach(u => {
    const sk = u.senior_manager_id || '__none__';
    const mk = u.manager_id        || '__none__';
    if (!tree[sk]) tree[sk] = {};
    if (!tree[sk][mk]) tree[sk][mk] = [];
    tree[sk][mk].push(u);
  });

  // Track which users have been placed in the tree to find truly unassigned
  const placed = new Set();

  const smIds = Object.keys(tree).filter(k => k !== '__none__').sort((a,b) => sort(byId[a]||{display_name:''}, byId[b]||{display_name:''}));

  const treeEl = document.getElementById('orgTree');
  treeEl.innerHTML = '';

  // ── Senior manager groups ──
  smIds.forEach(smId => {
    const sm = byId[smId];
    if (!sm) return;
    placed.add(smId);

    const smDiv = document.createElement('div');
    smDiv.className = 'mb-3';

    // Senior manager row
    const smRow = document.createElement('div');
    smRow.className = 'org-sm-row org-drop-zone';
    smRow.dataset.id   = smId;
    smRow.dataset.type = 'senior_manager';
    smRow.innerHTML = `${avHtml(sm, 'sm')}
      <div class="org-name">${App.escHtml(sm.display_name)}</div>
      <div class="org-email">${App.escHtml(sm.email)}</div>
      <button class="org-edit" data-id="${smId}" title="Edit"><i class="ti ti-edit" style="font-size:13px"></i></button>`;
    smDiv.appendChild(smRow);

    // Managers under this SM
    const mkIds = Object.keys(tree[smId]).sort((a,b) => {
      if (a === '__none__') return 1;
      if (b === '__none__') return -1;
      return sort(byId[a]||{display_name:''}, byId[b]||{display_name:''});
    });

    mkIds.forEach(mId => {
      const mBlock = document.createElement('div');
      mBlock.className = 'org-m-block';

      if (mId !== '__none__') {
        const m = byId[mId];
        if (m) {
          placed.add(mId);
          const mRow = document.createElement('div');
          mRow.className = 'org-m-row org-drop-zone';
          mRow.dataset.id   = mId;
          mRow.dataset.type = 'manager';
          mRow.innerHTML = `${avHtml(m, 'm')}
            <div class="org-name">${App.escHtml(m.display_name)}</div>
            <div class="org-email">${App.escHtml(m.email)}</div>
            <button class="org-edit" data-id="${mId}" title="Edit"><i class="ti ti-edit" style="font-size:13px"></i></button>`;
          mBlock.appendChild(mRow);
        }
      }

      // Users under this manager
      const users = [...tree[smId][mId]].sort(sort);
      if (users.length) {
        const uBlock = document.createElement('div');
        uBlock.className = 'org-u-block';
        users.forEach(u => {
          placed.add(u.user_id);
          uBlock.appendChild(makeUserRow(u));
        });
        mBlock.appendChild(uBlock);
      }

      smDiv.appendChild(mBlock);
    });

    treeEl.appendChild(smDiv);
  });

  // ── No manager set ──
  const unassigned = allUsers.filter(u => !placed.has(u.user_id)).sort(sort);
  if (unassigned.length) {
    const noMgr = document.createElement('div');
    noMgr.className = 'org-no-mgr';
    noMgr.innerHTML = `<div class="org-no-mgr-label"><i class="ti ti-user-off me-1"></i>No Manager Set</div>`;
    const uBlock = document.createElement('div');
    uBlock.style.marginLeft = '1rem';
    unassigned.forEach(u => uBlock.appendChild(makeUserRow(u)));
    noMgr.appendChild(uBlock);
    treeEl.appendChild(noMgr);
  }

  wireDragDrop();
  wireEditBtns();
}

function makeUserRow(u) {
  const row = document.createElement('div');
  row.className = 'org-u-row';
  row.draggable = true;
  row.dataset.id = u.user_id;
  row.dataset.type = 'user';
  row.innerHTML = `${avHtml(u, 'u')}
    <div class="org-name">${App.escHtml(u.display_name)}</div>
    <div class="org-email">${App.escHtml(u.email)}</div>
    <button class="org-edit" data-id="${u.user_id}" title="Edit"><i class="ti ti-edit" style="font-size:13px"></i></button>`;
  return row;
}

function avHtml(u, level) {
  if (!u) return '';
  if (u.avatar_url) return `<div class="org-av"><img src="${u.avatar_url}" alt=""></div>`;
  const initials = (u.display_name||u.email||'?').split(' ').map(w=>w[0]).filter(Boolean).join('').toUpperCase().slice(0,2);
  const bg = level === 'sm' ? 'rgb(var(--tblr-primary-rgb),.25)' : level === 'm' ? 'var(--tblr-bg-surface-secondary)' : 'var(--tblr-bg-surface-tertiary,#f1f5f9)';
  return `<div class="org-av" style="background:${bg}">${initials}</div>`;
}

// ── Drag and drop ─────────────────────────────────────────────────────────────
function wireDragDrop() {
  const treeEl = document.getElementById('orgTree');

  treeEl.querySelectorAll('.org-u-row').forEach(row => {
    row.addEventListener('dragstart', e => {
      dragUserId = row.dataset.id;
      setTimeout(() => row.classList.add('org-dragging'), 0);
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('org-dragging');
      dragUserId = null;
    });
  });

  treeEl.querySelectorAll('.org-drop-zone').forEach(zone => {
    zone.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      zone.classList.add('org-drop-target');
    });
    zone.addEventListener('dragleave', () => zone.classList.remove('org-drop-target'));
    zone.addEventListener('drop', async e => {
      e.preventDefault();
      zone.classList.remove('org-drop-target');
      if (!dragUserId || dragUserId === zone.dataset.id) return;

      const targetId   = zone.dataset.id;
      const targetType = zone.dataset.type; // 'senior_manager' or 'manager'

      // Build the update
      const update = {};
      if (targetType === 'manager') {
        update.manager_id = targetId;
        // Also inherit the senior manager of the dropped-onto manager
        const mgr = allUsers.find(u => u.user_id === targetId);
        if (mgr?.senior_manager_id) update.senior_manager_id = mgr.senior_manager_id;
      } else if (targetType === 'senior_manager') {
        update.senior_manager_id = targetId;
        update.manager_id = null; // clear manager when setting senior manager directly
      }

      const { error } = await sb.from('ad_user').update(update).eq('user_id', dragUserId);
      if (error) { App.toast('Failed to update: ' + error.message, 'danger'); return; }

      const u = allUsers.find(x => x.user_id === dragUserId);
      const targetName = allUsers.find(x => x.user_id === targetId)?.display_name || '';
      App.toast(`${u?.display_name || 'User'} assigned to ${targetName}`);
      await loadAndRender();
    });
  });
}

function wireEditBtns() {
  document.getElementById('orgTree').querySelectorAll('.org-edit').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); openEditModal(btn.dataset.id); });
  });
  // Also clicking the row itself (but not the edit button) opens edit
  document.getElementById('orgTree').querySelectorAll('[data-id]').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.org-edit')) return;
      openEditModal(el.dataset.id);
    });
  });
}

// ── Edit modal ────────────────────────────────────────────────────────────────
function openEditModal(userId) {
  const u = allUsers.find(x => x.user_id === userId);
  if (!u) return;
  document.getElementById('userModalError').classList.add('d-none');
  document.getElementById('userId').value          = u.user_id;
  document.getElementById('userDisplayName').value = u.display_name || '';
  document.getElementById('userEmail').value        = u.email || '';
  document.getElementById('userJobTitle').value     = u.job_title || '';
  document.getElementById('userRole').value         = u.role || 'user';
  setPickerValue('managerSearch',       'managerId',       u.manager_id);
  setPickerValue('seniorManagerSearch', 'seniorManagerId', u.senior_manager_id);
  userModal.show();
}

async function saveUser() {
  const errEl = document.getElementById('userModalError');
  errEl.classList.add('d-none');
  const id          = document.getElementById('userId').value;
  const displayName = document.getElementById('userDisplayName').value.trim();
  const jobTitle    = document.getElementById('userJobTitle').value.trim();
  const role        = document.getElementById('userRole').value;
  const managerId   = document.getElementById('managerId').value   || null;
  const seniorMgrId = document.getElementById('seniorManagerId').value || null;

  if (!displayName) { errEl.textContent = 'Display name is required.'; errEl.classList.remove('d-none'); return; }

  document.getElementById('saveUserLabel').textContent = 'Saving…';
  document.getElementById('saveUserSpinner').classList.remove('d-none');
  document.getElementById('saveUserBtn').disabled = true;

  try {
    await sb.from('profiles').update({ display_name: displayName, job_title: jobTitle||null, role, updated_at: new Date().toISOString() }).eq('id', id);
    await sb.from('ad_user').update({ manager_id: managerId, senior_manager_id: seniorMgrId }).eq('user_id', id);
    userModal.hide();
    App.toast('User updated');
    await loadAndRender();
  } catch(err) {
    errEl.textContent = 'Save failed: ' + (err.message || err);
    errEl.classList.remove('d-none');
  } finally {
    document.getElementById('saveUserLabel').textContent = 'Save';
    document.getElementById('saveUserSpinner').classList.add('d-none');
    document.getElementById('saveUserBtn').disabled = false;
  }
}

// ── Picker ────────────────────────────────────────────────────────────────────
function wirePickerField(inputId, hiddenId, dropdownId, clearId) {
  const input = document.getElementById(inputId);
  const hidden = document.getElementById(hiddenId);
  const dropdown = document.getElementById(dropdownId);
  const clearBtn = document.getElementById(clearId);

  function show(term) {
    const lower = term.toLowerCase();
    const matches = allUsers.filter(u => u.display_name?.toLowerCase().includes(lower) || u.email?.toLowerCase().includes(lower)).slice(0,12);
    if (!matches.length) { dropdown.style.display='none'; return; }
    dropdown.innerHTML = matches.map(u =>
      `<button type="button" class="dropdown-item" data-id="${u.user_id}" data-name="${App.escHtml(u.display_name)}">
        ${App.escHtml(u.display_name)}<small class="text-secondary d-block">${App.escHtml(u.email)}</small>
       </button>`).join('');
    dropdown.querySelectorAll('.dropdown-item').forEach(btn => {
      btn.addEventListener('click', () => { hidden.value=btn.dataset.id; input.value=btn.dataset.name; dropdown.style.display='none'; });
    });
    dropdown.style.display = 'block';
  }

  input.addEventListener('input', () => { hidden.value=''; const t=input.value.trim(); t.length?show(t):(dropdown.style.display='none'); });
  input.addEventListener('focus', () => { if(input.value.trim()) show(input.value.trim()); });
  clearBtn.addEventListener('click', () => { hidden.value=''; input.value=''; dropdown.style.display='none'; });
  document.addEventListener('click', e => { if(!input.contains(e.target)&&!dropdown.contains(e.target)) dropdown.style.display='none'; });
}

function setPickerValue(inputId, hiddenId, userId) {
  document.getElementById(hiddenId).value = userId || '';
  const u = userId ? allUsers.find(x => x.user_id === userId) : null;
  document.getElementById(inputId).value = u?.display_name || '';
}
  </script>
</body>
</html>
