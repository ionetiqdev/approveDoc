<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-app-root="../../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Org Chart - approveDoc</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <script>
    (function() {
      try {
        var root = document.documentElement.dataset.appRoot || './';
        var absoluteRoot = new URL(root, window.location.href).pathname;
        var suffix = ':' + absoluteRoot;
        var savedTheme = localStorage.getItem('app_theme');
        var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
        var accent = localStorage.getItem('app_accent' + suffix);
        if (accent) {
          document.documentElement.style.setProperty('--tblr-primary', accent);
          var ah = accent.replace('#','');
          if (ah.length === 3) ah = ah.split('').map(function(c){return c+c;}).join('');
          document.documentElement.style.setProperty('--tblr-primary-rgb', parseInt(ah.slice(0,2),16) + ', ' + parseInt(ah.slice(2,4),16) + ', ' + parseInt(ah.slice(4,6),16));
        }
        var sidebarBg = localStorage.getItem('app_sidebar_bg' + suffix);
        if (sidebarBg) {
          document.documentElement.style.setProperty('--bg-sidebar', sidebarBg);
          var hex = sidebarBg.replace('#', '');
          if (hex.length === 3) hex = hex.split('').map(function(c){return c+c;}).join('');
          var r = parseInt(hex.slice(0,2),16)/255, g = parseInt(hex.slice(2,4),16)/255, b = parseInt(hex.slice(4,6),16)/255;
          var toL = function(c){ return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4); };
          var isLight = (0.2126*toL(r)+0.7152*toL(g)+0.0722*toL(b))>0.5;
          document.documentElement.style.setProperty('--sidebar-fg', isLight?'#0f172a':'#ffffff');
          document.documentElement.style.setProperty('--sidebar-fg-rgb', isLight?'15,23,42':'255,255,255');
        }
      } catch(e) {}
    })();
  </script>
  <style>
    html, body { height: 100%; overflow: hidden; }
    .app-content-wrapper { height: 100vh; display: flex; flex-direction: column; }
    .page-body { flex: 1; overflow-y: auto; }

    /* ── Tree ── */
    .org-tree { font-size: .875rem; }

    .org-node { margin-bottom: .15rem; }

    .org-row {
      display: flex; align-items: center; gap: .6rem;
      padding: .35rem .6rem;
      border-radius: var(--tblr-border-radius);
      cursor: pointer;
      transition: background .12s;
      user-select: none;
      position: relative;
    }
    .org-row:hover { background: var(--tblr-bg-surface-secondary); }

    /* Top-level manager styling */
    .org-row.is-top {
      font-weight: 600;
      border-left: 3px solid var(--tblr-primary);
      background: rgba(var(--tblr-primary-rgb), .06);
      padding-left: .75rem;
    }
    .org-row.is-top:hover { background: rgba(var(--tblr-primary-rgb), .12); }

    /* Drop target highlight */
    .org-row.drag-over {
      outline: 2px dashed var(--tblr-primary);
      outline-offset: -2px;
      background: rgba(var(--tblr-primary-rgb), .1) !important;
    }

    /* Dragging source */
    .org-row.dragging { opacity: .35; }

    /* Children indented */
    .org-children { margin-left: 2rem; border-left: 1px solid var(--tblr-border-color-translucent); padding-left: .5rem; margin-top: .1rem; margin-bottom: .25rem; }

    /* No manager group */
    .org-unassigned { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px dashed var(--tblr-border-color); }
    .org-unassigned-label { font-size: .7rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--tblr-secondary-color); margin-bottom: .35rem; padding: 0 .25rem; }

    .org-name { font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .org-email { font-size: .72rem; color: var(--tblr-secondary-color); white-space: nowrap; }
    .org-top-badge { font-size: .6rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; background: rgba(var(--tblr-primary-rgb),.15); color: var(--tblr-primary); border-radius: 3px; padding: 1px 5px; flex-shrink: 0; }

    .org-edit {
      opacity: 0; transition: opacity .15s;
      background: none; border: none; color: var(--tblr-secondary-color);
      padding: 2px 5px; cursor: pointer; border-radius: 4px; flex-shrink: 0;
      font-size: .8rem;
    }
    .org-row:hover .org-edit { opacity: 1; }

    .org-av {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .6rem; font-weight: 700; overflow: hidden;
      background: var(--tblr-bg-surface-secondary);
    }
    .org-av img { width: 100%; height: 100%; object-fit: cover; }
    .is-top .org-av { background: rgba(var(--tblr-primary-rgb),.2); color: var(--tblr-primary); }

    /* Modal */
    .picker-wrap { position: relative; }
  </style>
</head>
<body>
  <aside id="sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app-content-wrapper">
    <header class="navbar navbar-expand-md d-print-none border-bottom">
      <div class="container-fluid">
        <button id="sidebarToggle" class="btn btn-icon"><i class="ti ti-menu-2"></i></button>
        <h1 class="navbar-brand d-none d-sm-inline-block ms-2 mb-0 page-title-lg">Org Chart</h1>
        <div class="navbar-nav flex-row order-md-last align-items-center gap-2">
          <div data-active-organisation></div>
          <button class="btn btn-icon" data-theme-toggle><i class="ti ti-moon"></i></button>
          <button class="btn btn-icon" id="headerPreferencesBtn"><i class="ti ti-adjustments"></i></button>
          <span class="avatar avatar-sm rounded-circle bg-primary-lt" data-user-initials>?</span>
          <span class="d-none d-xl-block">
            <span class="d-block fw-semibold" style="font-size:.8125rem" data-user-name>—</span>
            <span class="d-block text-secondary" style="font-size:.7rem" data-user-email>—</span>
          </span>
        </div>
      </div>
    </header>

    <div class="page-body">
      <div class="container-fluid py-3">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Organisation Hierarchy</h3>
            <div class="card-options text-secondary small">
              <i class="ti ti-drag-drop me-1"></i>Drag a user onto another to set their manager &nbsp;·&nbsp; Click to edit
            </div>
          </div>
          <div class="card-body">
            <div id="orgTree" class="org-tree">
              <div class="text-center py-5 text-secondary"><div class="spinner-border spinner-border-sm me-2"></div>Loading…</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit modal -->
  <div class="modal modal-blur fade" id="userModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit user</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="userModalError" class="alert alert-danger d-none py-2 small mb-3"></div>
          <input type="hidden" id="userId" />
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Display name <span class="text-danger">*</span></label>
              <input type="text" id="userDisplayName" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" id="userEmail" class="form-control" disabled />
            </div>
            <div class="col-md-6">
              <label class="form-label">Job title</label>
              <input type="text" id="userJobTitle" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Role</label>
              <select id="userRole" class="form-select">
                <option value="view">View</option>
                <option value="user">User</option>
                <option value="admin">Admin</option>
                <option value="super_admin">Super Admin</option>
              </select>
            </div>
            <div class="col-12">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="userIsTopLevel" role="switch">
                <label class="form-check-label" for="userIsTopLevel">
                  Top-level manager <span class="text-secondary small">(reports to no one — head of hierarchy)</span>
                </label>
              </div>
            </div>
            <div class="col-12 picker-wrap" id="managerFieldWrap">
              <label class="form-label">Manager</label>
              <div class="input-group">
                <input type="text" id="managerSearch" class="form-control" placeholder="Search users…" autocomplete="off" />
                <button class="btn btn-outline-secondary" type="button" id="managerClear"><i class="ti ti-x"></i></button>
              </div>
              <input type="hidden" id="managerId" />
              <div id="managerDropdown" class="dropdown-menu w-100" style="display:none;max-height:180px;overflow-y:auto;position:absolute;z-index:9999"></div>
              <div class="form-text">Leave blank if this user has no manager assigned yet.</div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveUserBtn">
            <span id="saveUserLabel">Save</span>
            <span id="saveUserSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/version.js"></script>
  <script src="../../assets/js/supabase-client.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/sidebar-html.js"></script>
  <script src="../../assets/js/sidebar.js"></script>
  <script src="../../assets/js/profile-modal.js"></script>
  <script src="../../assets/js/status-widget.js"></script>
  <script>
let allUsers  = [];
let userModal = null;
let dragId    = null;

// ── Init ──────────────────────────────────────────────────────────────────────
(async () => {
  const session = await Auth.requireAuth();
  if (!session) return;
  SidebarHtml.inject('../../');
  Sidebar.init();
  Auth.refreshUI();
  await loadAndRender();
  userModal = new bootstrap.Modal(document.getElementById('userModal'));
  wirePickerField('managerSearch', 'managerId', 'managerDropdown', 'managerClear');
  document.getElementById('saveUserBtn').addEventListener('click', saveUser);

  // Top-level toggle hides manager field
  document.getElementById('userIsTopLevel').addEventListener('change', function() {
    document.getElementById('managerFieldWrap').style.display = this.checked ? 'none' : '';
    if (this.checked) {
      document.getElementById('managerId').value = '';
      document.getElementById('managerSearch').value = '';
    }
  });
})();

// ── Data ──────────────────────────────────────────────────────────────────────
async function loadAndRender() {
  const orgId = Auth.getOrganisationId();
  const [{ data: adUsers }, { data: profiles }] = await Promise.all([
    sb.from('ad_user').select('user_id,first_name,last_name,email,manager_id,is_top_level').eq('organisation_id', orgId),
    sb.from('profiles').select('id,display_name,avatar_url,role,job_title').eq('organisation_id', orgId),
  ]);

  const profMap = {};
  (profiles || []).forEach(p => { profMap[p.id] = p; });

  allUsers = (adUsers || []).map(u => ({
    ...u,
    display_name: profMap[u.user_id]?.display_name || `${u.first_name||''} ${u.last_name||''}`.trim() || u.email,
    avatar_url:   profMap[u.user_id]?.avatar_url  || null,
    role:         profMap[u.user_id]?.role         || 'user',
    job_title:    profMap[u.user_id]?.job_title    || '',
  }));

  renderTree();
}

// ── Recursive tree render ─────────────────────────────────────────────────────
function renderTree() {
  const byId       = Object.fromEntries(allUsers.map(u => [u.user_id, u]));
  const childrenOf = {};
  allUsers.forEach(u => {
    if (u.manager_id) {
      if (!childrenOf[u.manager_id]) childrenOf[u.manager_id] = [];
      childrenOf[u.manager_id].push(u);
    }
  });

  const sort = (a, b) => (a.display_name||'').localeCompare(b.display_name||'');
  Object.values(childrenOf).forEach(arr => arr.sort(sort));

  // Roots = is_top_level users
  const roots = allUsers.filter(u => u.is_top_level).sort(sort);

  // Unassigned = no manager_id and not is_top_level
  const placed = new Set();
  function markPlaced(u) {
    placed.add(u.user_id);
    (childrenOf[u.user_id] || []).forEach(markPlaced);
  }
  roots.forEach(markPlaced);
  const unassigned = allUsers.filter(u => !placed.has(u.user_id) && !u.is_top_level).sort(sort);

  const treeEl = document.getElementById('orgTree');
  treeEl.innerHTML = '';

  // Render recursive node
  function renderNode(u, depth) {
    const node = document.createElement('div');
    node.className = 'org-node';

    const row = document.createElement('div');
    row.className = 'org-row' + (u.is_top_level ? ' is-top' : '');
    row.dataset.id = u.user_id;
    row.draggable  = true;

    row.innerHTML = `
      ${avHtml(u)}
      <div class="org-name">${App.escHtml(u.display_name)}</div>
      ${u.is_top_level ? '<span class="org-top-badge">Top Level</span>' : ''}
      <div class="org-email">${App.escHtml(u.email)}</div>
      <button class="org-edit" data-id="${u.user_id}" title="Edit"><i class="ti ti-edit"></i></button>`;

    node.appendChild(row);

    const kids = childrenOf[u.user_id];
    if (kids?.length) {
      const childBlock = document.createElement('div');
      childBlock.className = 'org-children';
      kids.forEach(k => childBlock.appendChild(renderNode(k, depth + 1)));
      node.appendChild(childBlock);
    }

    return node;
  }

  roots.forEach(r => treeEl.appendChild(renderNode(r, 0)));

  // Unassigned section
  if (unassigned.length) {
    const section = document.createElement('div');
    section.className = 'org-unassigned';
    section.innerHTML = `<div class="org-unassigned-label"><i class="ti ti-user-question me-1"></i>Not yet assigned</div>`;
    unassigned.forEach(u => {
      const row = document.createElement('div');
      row.className = 'org-row';
      row.dataset.id = u.user_id;
      row.draggable  = true;
      row.innerHTML = `
        ${avHtml(u)}
        <div class="org-name">${App.escHtml(u.display_name)}</div>
        <div class="org-email">${App.escHtml(u.email)}</div>
        <button class="org-edit" data-id="${u.user_id}" title="Edit"><i class="ti ti-edit"></i></button>`;
      section.appendChild(row);
    });
    treeEl.appendChild(section);
  }

  wireDragDrop();
  wireEditBtns();
}

function avHtml(u) {
  if (u.avatar_url) return `<div class="org-av"><img src="${u.avatar_url}" alt=""></div>`;
  const i = (u.display_name||u.email||'?').split(' ').map(w=>w[0]).filter(Boolean).join('').toUpperCase().slice(0,2);
  return `<div class="org-av">${i}</div>`;
}

// ── Drag and drop ─────────────────────────────────────────────────────────────
function wireDragDrop() {
  const rows = document.getElementById('orgTree').querySelectorAll('.org-row');

  rows.forEach(row => {
    row.addEventListener('dragstart', e => {
      dragId = row.dataset.id;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => row.classList.add('dragging'), 0);
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      dragId = null;
    });
    row.addEventListener('dragover', e => {
      if (!dragId || dragId === row.dataset.id) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', async e => {
      e.preventDefault();
      row.classList.remove('drag-over');
      const targetId = row.dataset.id;
      if (!dragId || dragId === targetId) return;

      // Prevent circular: don't allow dropping onto a descendant of the dragged user
      if (isDescendant(dragId, targetId)) {
        App.toast('Cannot assign a manager who reports to this user', 'warning');
        return;
      }

      const { error } = await sb.from('ad_user')
        .update({ manager_id: targetId, is_top_level: false })
        .eq('user_id', dragId);

      if (error) { App.toast('Failed: ' + error.message, 'danger'); return; }

      const u = allUsers.find(x => x.user_id === dragId);
      const t = allUsers.find(x => x.user_id === targetId);
      App.toast(`${u?.display_name || 'User'} now reports to ${t?.display_name || 'manager'}`);
      await loadAndRender();
    });
  });
}

function isDescendant(ancestorId, potentialDescendantId) {
  // Returns true if potentialDescendantId is a descendant of ancestorId
  const childrenOf = {};
  allUsers.forEach(u => {
    if (u.manager_id) {
      if (!childrenOf[u.manager_id]) childrenOf[u.manager_id] = [];
      childrenOf[u.manager_id].push(u.user_id);
    }
  });
  function check(id) {
    const kids = childrenOf[id] || [];
    if (kids.includes(potentialDescendantId)) return true;
    return kids.some(check);
  }
  return check(ancestorId);
}

function wireEditBtns() {
  document.getElementById('orgTree').querySelectorAll('.org-row').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('.org-edit')) return;
      openEditModal(row.dataset.id);
    });
    row.querySelector('.org-edit')?.addEventListener('click', e => {
      e.stopPropagation();
      openEditModal(row.dataset.id);
    });
  });
}

// ── Edit modal ────────────────────────────────────────────────────────────────
function openEditModal(userId) {
  const u = allUsers.find(x => x.user_id === userId);
  if (!u) return;
  document.getElementById('userModalError').classList.add('d-none');
  document.getElementById('userId').value          = u.user_id;
  document.getElementById('userDisplayName').value = u.display_name || '';
  document.getElementById('userEmail').value        = u.email || '';
  document.getElementById('userJobTitle').value     = u.job_title || '';
  document.getElementById('userRole').value         = u.role || 'user';
  document.getElementById('userIsTopLevel').checked = !!u.is_top_level;
  document.getElementById('managerFieldWrap').style.display = u.is_top_level ? 'none' : '';
  setPickerValue('managerSearch', 'managerId', u.manager_id);
  userModal.show();
}

async function saveUser() {
  const errEl       = document.getElementById('userModalError');
  errEl.classList.add('d-none');
  const id          = document.getElementById('userId').value;
  const displayName = document.getElementById('userDisplayName').value.trim();
  const jobTitle    = document.getElementById('userJobTitle').value.trim();
  const role        = document.getElementById('userRole').value;
  const isTopLevel  = document.getElementById('userIsTopLevel').checked;
  const managerId   = isTopLevel ? null : (document.getElementById('managerId').value || null);

  if (!displayName) { errEl.textContent = 'Display name is required.'; errEl.classList.remove('d-none'); return; }

  document.getElementById('saveUserLabel').textContent = 'Saving…';
  document.getElementById('saveUserSpinner').classList.remove('d-none');
  document.getElementById('saveUserBtn').disabled = true;

  try {
    await sb.from('profiles').update({ display_name: displayName, job_title: jobTitle||null, role, updated_at: new Date().toISOString() }).eq('id', id);
    await sb.from('ad_user').update({ manager_id: managerId, is_top_level: isTopLevel }).eq('user_id', id);
    userModal.hide();
    App.toast('User updated');
    await loadAndRender();
  } catch(err) {
    errEl.textContent = 'Save failed: ' + (err.message || err);
    errEl.classList.remove('d-none');
  } finally {
    document.getElementById('saveUserLabel').textContent = 'Save';
    document.getElementById('saveUserSpinner').classList.add('d-none');
    document.getElementById('saveUserBtn').disabled = false;
  }
}

// ── Picker ────────────────────────────────────────────────────────────────────
function wirePickerField(inputId, hiddenId, dropdownId, clearId) {
  const input    = document.getElementById(inputId);
  const hidden   = document.getElementById(hiddenId);
  const dropdown = document.getElementById(dropdownId);
  const clearBtn = document.getElementById(clearId);

  function show(term) {
    const lower   = term.toLowerCase();
    const matches = allUsers.filter(u => u.display_name?.toLowerCase().includes(lower) || u.email?.toLowerCase().includes(lower)).slice(0, 12);
    if (!matches.length) { dropdown.style.display = 'none'; return; }
    dropdown.innerHTML = matches.map(u =>
      `<button type="button" class="dropdown-item" data-id="${u.user_id}" data-name="${App.escHtml(u.display_name)}">
        ${App.escHtml(u.display_name)}<small class="text-secondary d-block">${App.escHtml(u.email)}</small>
       </button>`).join('');
    dropdown.querySelectorAll('.dropdown-item').forEach(btn => {
      btn.addEventListener('click', () => { hidden.value = btn.dataset.id; input.value = btn.dataset.name; dropdown.style.display = 'none'; });
    });
    dropdown.style.display = 'block';
  }

  input.addEventListener('input', () => { hidden.value = ''; const t = input.value.trim(); t.length ? show(t) : (dropdown.style.display = 'none'); });
  input.addEventListener('focus', () => { if (input.value.trim()) show(input.value.trim()); });
  clearBtn.addEventListener('click', () => { hidden.value = ''; input.value = ''; dropdown.style.display = 'none'; });
  document.addEventListener('click', e => { if (!input.contains(e.target) && !dropdown.contains(e.target)) dropdown.style.display = 'none'; });
}

function setPickerValue(inputId, hiddenId, userId) {
  document.getElementById(hiddenId).value = userId || '';
  const u = userId ? allUsers.find(x => x.user_id === userId) : null;
  document.getElementById(inputId).value = u?.display_name || '';
}
  </script>
</body>
