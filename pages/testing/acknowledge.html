<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-app-root="../../">
<head>
  <script>
    // Compute absolute app root URL for JS navigation
    (function() {
      var rel = document.documentElement.getAttribute('data-app-root') || './';
      window._appRootUrl = new URL(rel, window.location.href).href;
      if (!window._appRootUrl.endsWith('/')) window._appRootUrl += '/';
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acknowledge - approveDoc</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/theme.css?r=r91cfoyb" />

  <script>
    (function() {
      try {
        var root = document.documentElement.dataset.appRoot || './';
        var absoluteRoot = new URL(root, window.location.href).pathname;
        var suffix = ':' + window.location.hostname + absoluteRoot;
        var savedTheme = localStorage.getItem('app_theme');
        var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
        var accent = localStorage.getItem('app_accent' + suffix);
        if (accent) {
          document.documentElement.style.setProperty('--tblr-primary', accent);
          var ah = accent.replace('#','');
          if (ah.length === 3) ah = ah.split('').map(function(c){return c+c;}).join('');
          document.documentElement.style.setProperty('--tblr-primary-rgb', parseInt(ah.slice(0,2),16) + ', ' + parseInt(ah.slice(2,4),16) + ', ' + parseInt(ah.slice(4,6),16));
        }
        var sidebarBg = localStorage.getItem('app_sidebar_bg' + suffix);
        if (sidebarBg) {
          document.documentElement.style.setProperty('--bg-sidebar', sidebarBg);
          var hex = sidebarBg.replace('#', '');
          if (hex.length === 3) hex = hex.split('').map(function(c){return c+c;}).join('');
          var r = parseInt(hex.slice(0,2),16) / 255, g = parseInt(hex.slice(2,4),16) / 255, b = parseInt(hex.slice(4,6),16) / 255;
          var toLinear = function(c){ return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
          var isLight = (0.2126*toLinear(r) + 0.7152*toLinear(g) + 0.0722*toLinear(b)) > 0.5;
          document.documentElement.style.setProperty('--sidebar-fg', isLight ? '#0f172a' : '#ffffff');
          document.documentElement.style.setProperty('--sidebar-fg-rgb', isLight ? '15,23,42' : '255,255,255');
        }
      } catch(e) {}
    })();
  </script>

  <style>
    html, body { height: 100%; overflow: hidden; }
    .app-content-wrapper { height: 100vh; display: flex; flex-direction: column; }
    .page-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 1rem; }
    .content-row { flex: 1; min-height: 0; display: flex; gap: 1rem; }

    /* PDF viewer panel */
    .viewer-panel { flex: 0 0 75%; display: flex; flex-direction: column; min-height: 0; }
    .viewer-panel .card { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    #viewerLoadingState { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--tblr-card-bg, var(--tblr-bg-surface)); z-index: 1; }
    #pdfFrame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }

    /* Action panel */
    .action-panel { flex: 0 0 calc(25% - .5rem); display: flex; flex-direction: column; min-height: 0; gap: 1rem; }
    .action-card { flex: 1; min-height: 0; overflow-y: auto; }
  </style>
</head>
<body>

  <aside id="sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app-content-wrapper">
    <header class="navbar navbar-expand-md d-print-none border-bottom">
      <div class="container-fluid">
        <button id="sidebarToggle" class="btn btn-icon"><i class="ti ti-menu-2"></i></button>
        <h1 class="navbar-brand d-none d-sm-inline-block ms-2 mb-0 page-title-lg" id="pageTitle">Acknowledge document</h1>
        <div class="navbar-nav flex-row order-md-last align-items-center gap-2">
          <div data-active-organisation></div>
          <button class="btn btn-icon" data-theme-toggle><i class="ti ti-moon"></i></button>
          <button class="btn btn-icon" id="headerPreferencesBtn"><i class="ti ti-adjustments"></i></button>
          <span class="avatar avatar-sm rounded-circle bg-primary-lt" data-user-initials>?</span>
        </div>
      </div>
    </header>

    <div class="page-body">

      <!-- Back button -->
      <div class="d-flex align-items-center gap-3 mb-3">
        <button class="btn btn-outline-secondary btn-sm" id="backBtn">
          <i class="ti ti-arrow-left me-1"></i>Back to document list
        </button>
      </div>

      <div class="content-row">

        <!-- PDF viewer (left 75%) -->
        <div class="viewer-panel">
          <div class="card">
            <div id="viewerLoadingState" class="text-secondary">
              <span class="spinner-border spinner-border-sm me-2"></span>Loading document…
            </div>
            <iframe id="pdfFrame" style="display:none"></iframe>
          </div>
        </div>

        <!-- Action panel (right 25%) -->
        <div class="action-panel">
          <div class="card action-card">
            <div class="card-body d-flex flex-column gap-3">
              <div id="actionError" class="alert alert-danger d-none py-2 small"></div>

              <!-- Doc title and status -->
              <div>
                <div class="fw-semibold mb-1" id="docNameLabel"></div>
                <div id="currentStatusBadge"></div>
              </div>

              <!-- Distribution instructions -->
              <div id="instructionsBlock" style="display:none">
                <div class="text-secondary small" id="instructionsText"></div>
              </div>

              <hr class="my-1" />

              <button class="btn btn-success w-100" id="acknowledgeBtn" style="font-size:18px;padding:.6rem 1rem">
                <i class="ti ti-check" style="font-size:28px;vertical-align:middle"></i>
                <span style="vertical-align:middle;padding-left:10px"> Acknowledge</span>
              </button>

              <button class="btn btn-danger w-100" id="rejectBtn" style="font-size:18px;padding:.6rem 1rem">
                <i class="ti ti-x" style="font-size:28px;vertical-align:middle"></i>
                <span style="vertical-align:middle;padding-left:10px"> Reject</span>
              </button>

              <span id="referenceBtnWrap" data-bs-toggle="tooltip" data-bs-placement="top"
                title="Only acknowledged documents can be saved for reference">
                <button class="btn w-100" id="referenceBtn" style="font-size:18px;padding:.6rem 1rem;background:#e0e0e0;color:#1a237e;pointer-events:none" disabled>
                  <i class="ti ti-book" style="font-size:28px;vertical-align:middle"></i>
                  <span style="vertical-align:middle;padding-left:10px"> Add to reference</span>
                </button>
              </span>

            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Rejection reason modal -->
  <div class="modal modal-blur fade" id="rejectModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Reason for rejection</h5>
        </div>
        <div class="modal-body">
          <div id="rejectModalError" class="alert alert-danger d-none py-2 small mb-3"></div>
          <p class="text-secondary small mb-2">Please explain why you are rejecting this document. This will be recorded.</p>
          <textarea id="rejectReason" class="form-control" rows="4" placeholder="Enter your reason…"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" id="rejectCancelBtn">Cancel</button>
          <button type="button" class="btn btn-danger" id="rejectConfirmBtn">
            <span id="rejectConfirmLabel">Confirm rejection</span>
            <span id="rejectConfirmSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/version.js?r=r91cfoyb"></script>
  <script src="../../assets/js/supabase-client.js?r=r91cfoyb"></script>
  <script src="../../assets/js/auth.js?r=r91cfoyb"></script>
  <script src="../../assets/js/app.js?r=r91cfoyb"></script>
  <script src="../../assets/js/theme.js?r=r91cfoyb"></script>
  <script src="../../assets/js/sidebar-html.js?r=r91cfoyb"></script>
  <script src="../../assets/js/sidebar.js?r=r91cfoyb"></script>
  <script src="../../assets/js/profile-modal.js?r=r91cfoyb"></script>
  <script src="../../assets/js/status-widget.js?r=r91cfoyb"></script>
  <script>
const PDF_BUCKET          = 'documents';
const PDF_VIEWER_URL      = '../../assets/pdfjs/web/viewer.html';
const SIGNED_URL_EXPIRY   = 60;

let currentItem = null;
let rejectModal  = null;

(async () => {
  const session = await Auth.requireAuth();
  if (!session) return;
  SidebarHtml.inject(window._appRootUrl || '../../');
  Sidebar.init();
  Auth.refreshUI();
  StatusWidget.init();

  rejectModal = new bootstrap.Modal(document.getElementById('rejectModal'), { keyboard: false, backdrop: 'static' });

  document.getElementById('backBtn').addEventListener('click', () => {
    history.length > 1 ? history.back() : window.location.href = 'user-view.html';
  });

  const itemId = new URLSearchParams(window.location.search).get('item');
  if (!itemId) { App.toast('No distribution item specified', 'danger'); return; }

  await loadItem(itemId);

  document.getElementById('acknowledgeBtn').addEventListener('click', async () => {
    await saveAction('APPROVED', null);
    returnToList();
  });

  document.getElementById('rejectBtn').addEventListener('click', () => {
    document.getElementById('rejectReason').value = '';
    document.getElementById('rejectModalError').classList.add('d-none');
    rejectModal.show();
    setTimeout(() => document.getElementById('rejectReason').focus(), 300);
  });

  document.getElementById('rejectCancelBtn').addEventListener('click', () => rejectModal.hide());

  document.getElementById('rejectConfirmBtn').addEventListener('click', async () => {
    const reason = document.getElementById('rejectReason').value.trim();
    const errorEl = document.getElementById('rejectModalError');
    errorEl.classList.add('d-none');

    if (!reason) {
      errorEl.textContent = 'Please enter a reason for rejection.';
      errorEl.classList.remove('d-none');
      return;
    }

    document.getElementById('rejectConfirmSpinner').classList.remove('d-none');
    document.getElementById('rejectConfirmBtn').disabled = true;

    const ok = await saveAction('REJECTED', reason);

    document.getElementById('rejectConfirmSpinner').classList.add('d-none');
    document.getElementById('rejectConfirmBtn').disabled = false;

    if (ok) {
      rejectModal.hide();
      returnToList();
    }
  });

  document.getElementById('referenceBtn').addEventListener('click', async () => {
    if (!currentItem) return;
    const session = Auth.getSession();
    const userId  = session?.user?.id;
    if (!userId) return;

    // Get doc_id from the distribution
    const { data: dist } = await sb.from('ad_distribution')
      .select('doc_id').eq('distribution_id', currentItem.distribution_id).single();
    if (!dist?.doc_id) return;

    // Insert reference (ignore if already exists)
    await sb.from('ad_document_reference').upsert({
      organisation_id: Auth.getOrganisationId(),
      user_id:         userId,
      doc_id:          dist.doc_id,
      date_added:      new Date().toISOString().slice(0, 10),
    }, { onConflict: 'user_id,doc_id', ignoreDuplicates: true });

    // Update distribution item status to REFERENCE
    await sb.from('ad_distribution_item').update({
      status:     'REFERENCE',
      updated_at: new Date().toISOString(),
    }).eq('distrib_item_id', currentItem.distrib_item_id);

    currentItem.status = 'REFERENCE';
    renderStatusBadge(currentItem);
    updateReferenceBtn();
    App.toast('Document saved to reference library');
    await StatusWidget.refresh();
    returnToList();
  });
})();

function updateReferenceBtn() {
  const btn     = document.getElementById('referenceBtn');
  const wrap    = document.getElementById('referenceBtnWrap');
  const isApproved = currentItem?.status === 'APPROVED' || currentItem?.acknowledged === true;
  const isRef      = currentItem?.status === 'REFERENCE';
  const canAdd     = isApproved && !isRef;

  btn.disabled = !canAdd;
  btn.style.pointerEvents = canAdd ? '' : 'none';
  btn.style.opacity = canAdd ? '1' : '0.6';

  // Tooltip on the wrapper
  if (wrap._tt) { wrap._tt.dispose(); wrap._tt = null; }
  if (!canAdd) {
    wrap.setAttribute('title', isRef ? 'Already saved to reference' : 'Only acknowledged documents can be saved for reference');
    wrap._tt = new bootstrap.Tooltip(wrap);
  } else {
    wrap.removeAttribute('title');
  }
}

async function loadItem(itemId) {
  // Load the distribution item
  const { data: item, error: itemErr } = await sb
    .from('ad_distribution_item')
    .select('*')
    .eq('distrib_item_id', itemId)
    .single();

  if (itemErr || !item) {
    App.toast('Could not load distribution item', 'danger');
    return;
  }
  currentItem = item;

  // Update status badge and reference button state
  renderStatusBadge(item);
  updateReferenceBtn();

  // Load the distribution (to get doc_id)
  const { data: dist } = await sb
    .from('ad_distribution')
    .select('name, doc_id, instructions')
    .eq('distribution_id', item.distribution_id)
    .single();

  if (!dist?.doc_id) {
    document.getElementById('docNameLabel').textContent = dist?.name || 'Unknown distribution';
    document.getElementById('viewerLoadingState').innerHTML =
      '<i class="ti ti-file-off me-2"></i>No document attached to this distribution';
    return;
  }

  // Load the document record
  const { data: doc } = await sb
    .from('ad_document')
    .select('name, doc_id')
    .eq('doc_id', dist.doc_id)
    .single();

  document.getElementById('docNameLabel').textContent = doc?.name || dist.name;
  document.getElementById('pageTitle').textContent    = doc?.name || 'Acknowledge document';

  if (dist.instructions) {
    document.getElementById('instructionsText').textContent = dist.instructions;
    document.getElementById('instructionsBlock').style.display = '';
  }

  // Load the file record
  const { data: files } = await sb
    .from('ad_document_file')
    .select('storage_path, file_name, download_file_name')
    .eq('doc_id', dist.doc_id)
    .order('created_at', { ascending: false })
    .limit(1);

  const pdfFile = files?.[0];
  if (!pdfFile) {
    document.getElementById('viewerLoadingState').innerHTML =
      '<i class="ti ti-file-off me-2"></i>No file found for this document';
    return;
  }

  await loadPdf(pdfFile, doc?.name || dist.name);
}

async function loadPdf(pdfFile, docName) {
  console.log('[Acknowledge] loadPdf: storage_path =', pdfFile.storage_path);

  const { data: signedData, error: signErr } = await sb.storage
    .from(PDF_BUCKET)
    .createSignedUrl(pdfFile.storage_path, SIGNED_URL_EXPIRY);

  if (signErr || !signedData) {
    const msg = signErr?.message || 'Unknown error';
    console.error('[Acknowledge] createSignedUrl failed:', msg);
    document.getElementById('viewerLoadingState').innerHTML =
      `<div class="text-danger text-center p-4"><i class="ti ti-alert-circle d-block mb-2" style="font-size:2rem"></i>
      <strong>Could not get file URL</strong><br><span class="small">${msg}</span></div>`;
    return;
  }

  console.log('[Acknowledge] Signed URL obtained, fetching blob…');

  // Fetch as blob so pdf.js's validateFileURL never blocks it
  try {
    const resp = await fetch(signedData.signedUrl);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const blob     = await resp.blob();
    const fileName = pdfFile.download_file_name || docName.replace(/[^a-z0-9._-]/gi, '_') + '.pdf';
    const named    = new File([blob], fileName, { type: 'application/pdf' });
    const blobUrl  = URL.createObjectURL(named);

    const frame = document.getElementById('pdfFrame');
    const hash  = 'page=1&zoom=page-fit&pagemode=thumbs&toolbar=1&navpanes=1&locale=en-US';
    frame.style.visibility = 'hidden';
    frame.onload = () => {
      injectPdfStyles(frame);
      setTimeout(() => { frame.style.visibility = ''; }, 150);
    };
    frame.src = `${PDF_VIEWER_URL}?file=${encodeURIComponent(blobUrl)}#${hash}`;
    frame.removeAttribute('style');
    document.getElementById('viewerLoadingState').style.display = 'none';
  } catch (e) {
    document.getElementById('viewerLoadingState').innerHTML =
      `<div class="text-danger text-center p-4"><i class="ti ti-alert-circle d-block mb-2" style="font-size:2rem"></i>
      <strong>Could not load PDF</strong><br><span class="small">${e.message}</span><br>
      <span class="small text-secondary mt-1 d-block">Check browser console for CSP or network errors</span></div>`;
    App.toast('Could not load PDF: ' + e.message, 'danger');
  }
}

function injectPdfStyles(frame) {
  try {
    const doc = frame.contentDocument || frame.contentWindow.document;
    if (!doc || doc.getElementById('ionetiq-doc-patch')) return;
    const style = doc.createElement('style');
    style.id = 'ionetiq-doc-patch';
    style.textContent = `
      #scaleSelect, #scaleSelect option,
      .dropdownToolbarButton > select,
      .dropdownToolbarButton > select option {
        color: #000 !important;
        background-color: #fff !important;
      }
      /* Always hidden: overflow menu, print, download, separators, annotation editors */
      #secondaryToolbarToggle,
      #printButton, #secondaryPrintButton,
      #downloadButton, #secondaryDownloadButton,
      #editorFreeTextButton, #editorInkButton, #editorStampButton, #editorHighlightButton,
      #rotateCcwButton, #rotateCwButton,
      #openFileButton, #viewBookmarkButton, #documentPropertiesButton, #presentationModeButton,
      .verticalToolbarSeparator, .horizontalToolbarSeparator,
      .splitToolbarButtonSeparator,
      #editorModeSeparator,
      .verticalToolbarSeparator.hiddenMediumView {
        display: none !important;
      }
      #secondaryToolbar, .secondaryToolbar {
        background: #fff !important;
      }
      #findbar { background: #f9f9f9 !important; color: #000 !important; }
      #findInput { color: #000 !important; background: #fff !important; }`;
    doc.head.appendChild(style);
  } catch(e) {}
}

function renderStatusBadge(item) {
  const colours = {
    'APPROVED':  '#8BC34A', 'REJECTED': '#B33771',
    'OVERDUE':   '#EA2027', 'PENDING':  '#009432',
    'REFERENCE': '#0070C0',
  };
  const labels  = {
    'APPROVED':  'Acknowledged', 'REJECTED':  'Rejected',
    'OVERDUE':   'Overdue',      'PENDING':   'Pending',
    'REFERENCE': 'Reference',
  };
  const s   = (item.status || 'PENDING').toUpperCase();
  const col = colours[s] || '#0070C0';
  const lbl = labels[s]  || s;
  document.getElementById('currentStatusBadge').innerHTML =
    `<span class="badge" style="background:${col};color:#fff">${lbl}</span>`;
}

function returnToList() {
  history.length > 1 ? history.back() : window.location.href = 'user-view.html';
}

async function saveAction(newStatus, reason) {
  if (!currentItem) return false;

  const errorEl = document.getElementById('actionError');
  errorEl.classList.add('d-none');

  const today      = new Date().toISOString().slice(0, 10);
  const isApproved = newStatus === 'APPROVED';
  const isRejected = newStatus === 'REJECTED';

  const { error } = await sb.from('ad_distribution_item').update({
    status:            newStatus,
    acknowledged:      isApproved,
    acknowledged_date: isApproved ? today : null,
    rejected:          isRejected,
    rejected_date:     isRejected ? today : null,
    rejected_reason:   isRejected ? (reason || null) : null,
    updated_at:        new Date().toISOString(),
  }).eq('distrib_item_id', currentItem.distrib_item_id);

  if (error) {
    errorEl.textContent = 'Save failed: ' + error.message;
    errorEl.classList.remove('d-none');
    return false;
  }

  currentItem.status            = newStatus;
  currentItem.acknowledged      = isApproved;
  currentItem.acknowledged_date = isApproved ? today : null;
  currentItem.rejected          = isRejected;
  currentItem.rejected_date     = isRejected ? today : null;
  currentItem.rejected_reason   = isRejected ? reason : null;
  renderStatusBadge(currentItem);
  updateReferenceBtn();

  App.toast(isApproved ? 'Document acknowledged' : 'Document rejected');
  await StatusWidget.refresh();
  return true;
}
  </script>
</body>
</html>
