<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-app-root="../../">
<head>
  <script>
    // Compute absolute app root URL for JS navigation
    (function() {
      var rel = document.documentElement.getAttribute('data-app-root') || './';
      window._appRootUrl = new URL(rel, window.location.href).href;
      if (!window._appRootUrl.endsWith('/')) window._appRootUrl += '/';
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testing: User View - approveDoc</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/theme.css?r=kfmgxr0y" />

  <script>
    (function() {
      try {
        var root = document.documentElement.dataset.appRoot || './';
        var absoluteRoot = new URL(root, window.location.href).pathname;
        var suffix = ':' + window.location.hostname + absoluteRoot;
        var savedTheme = localStorage.getItem('app_theme');
        var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
        var accent = localStorage.getItem('app_accent' + suffix);
        if (accent) {
          document.documentElement.style.setProperty('--tblr-primary', accent);
          var ah = accent.replace('#','');
          if (ah.length === 3) ah = ah.split('').map(function(c){return c+c;}).join('');
          document.documentElement.style.setProperty('--tblr-primary-rgb', parseInt(ah.slice(0,2),16) + ', ' + parseInt(ah.slice(2,4),16) + ', ' + parseInt(ah.slice(4,6),16));
        }
        var sidebarBg = localStorage.getItem('app_sidebar_bg' + suffix);
        if (sidebarBg) {
          document.documentElement.style.setProperty('--bg-sidebar', sidebarBg);
          var hex = sidebarBg.replace('#', '');
          if (hex.length === 3) hex = hex.split('').map(function(c){return c+c;}).join('');
          var r = parseInt(hex.slice(0,2),16) / 255, g = parseInt(hex.slice(2,4),16) / 255, b = parseInt(hex.slice(4,6),16) / 255;
          var toLinear = function(c){ return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
          var isLight = (0.2126*toLinear(r) + 0.7152*toLinear(g) + 0.0722*toLinear(b)) > 0.5;
          document.documentElement.style.setProperty('--sidebar-fg', isLight ? '#0f172a' : '#ffffff');
          document.documentElement.style.setProperty('--sidebar-fg-rgb', isLight ? '15,23,42' : '255,255,255');
        }
      } catch(e) {}
    })();
  </script>

  <style>
    html, body { height: 100%; overflow: hidden; }
    .app-content-wrapper { height: 100vh; display: flex; flex-direction: column; }
    .page-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 1rem; padding-bottom: 1rem; }
    .page-body > .container-fluid { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 1rem; }

    /* Picker card */
    .picker-card .card-header { background: var(--tblr-bg-surface-secondary); padding-top: 10px; padding-bottom: 10px; }
    .picker-card .card-title { font-size: 14px; }

    /* Table card - fills remaining space */
    .table-card { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .table-scroll { flex: 1; min-height: 0; overflow-y: auto; }

    /* Section header rows within the single table */
    tr.section-header { background: #D3D3D3; color: #000; }
    [data-bs-theme="dark"] tr.section-header { background: var(--tblr-bg-surface-secondary); color: var(--tblr-body-color); }
    tr.section-header td { font-weight: 600; font-size: .8125rem; padding: 8px 12px; cursor: pointer; user-select: none; border-top: 2px solid var(--tblr-border-color); }
    tr.section-header:first-child td:first-child { border-top-left-radius: var(--tblr-border-radius); }
    tr.section-header:first-child td:last-child { border-top-right-radius: var(--tblr-border-radius); }
    tr.section-header:first-child td { border-top: none; }
    tr.section-header td i.section-chevron { transition: transform .2s; }
    tr.section-header.collapsed td i.section-chevron { transform: rotate(-90deg); }
    tr.section-body-row.hidden { display: none; }
    tr.section-col-titles th { background: var(--tblr-active-bg, rgba(var(--tblr-secondary-rgb),.06)); font-size: .75rem; color: var(--tblr-secondary-color); font-weight: 600; padding-top: 6px; padding-bottom: 6px; padding-left: 20px; padding-right: 20px; border-bottom: 1px solid var(--tblr-border-color); }
    tr.section-body-row td { padding-left: 20px; }
    tr.section-body-row.no-items td { padding-left: 20px !important; }
  </style>
</head>

  <script src="../../assets/js/supabase-client.js?r=kfmgxr0y"></script>
  <script src="../../assets/js/auth.js?r=kfmgxr0y"></script>
  <script src="../../assets/js/app.js?r=kfmgxr0y"></script>
  <script src="../../assets/js/theme.js?r=kfmgxr0y"></script>
  <script src="../../assets/js/sidebar-html.js?r=kfmgxr0y"></script>
  <script src="../../assets/js/sidebar.js?r=kfmgxr0y"></script>
  <script src="../../assets/js/profile-modal.js?r=kfmgxr0y"></script>
  <script src="../../assets/js/status-widget.js?r=kfmgxr0y"></script>
  <script>
// Lookup caches
let allDocuments = [];       // ad_document rows
let allDistributions = [];   // ad_distribution rows (for doc_id + audience lookup)
let allAudiences = [];       // ad_audience rows (for name lookup)
let audiencesByDist = {};    // distribution_id -> audience name(s) string
let allItems = [];           // current user's ad_distribution_item rows
let editItemModal;
let currentUserId = null;

const STATUS_COLOURS = [
  { key: 'ontime',       label: 'On time',     colour: '#009432' },
  { key: 'duesoon',      label: 'Due soon',     colour: '#F79F1F' },
  { key: 'overdue',      label: 'Overdue',      colour: '#EA2027' },
  { key: 'acknowledged', label: 'Acknowledged', colour: '#8BC34A' },
  { key: 'rejected',     label: 'Rejected',     colour: '#B33771' },
  { key: 'nodue',        label: 'No due date',  colour: '#0070C0' },
];

(async () => {
  const session = await Auth.requireAuth();
  if (!session) return;
  SidebarHtml.inject(window._appRootUrl || '../../');
  Sidebar.init();
  Auth.refreshUI();

  editItemModal = new bootstrap.Modal(document.getElementById('editItemModal'));
  document.getElementById('saveEditItemBtn').addEventListener('click', saveEditItem);

  await StatusWidget.init();

  const orgId   = Auth.getOrganisationId();
  const isAdmin = Auth.isAdmin();
  const profile = Auth.getProfile();

  // Load reference data
  const [
    { data: users },
    { data: documents },
    { data: distributions },
    { data: audiences },
    { data: distAuds },
  ] = await Promise.all([
    sb.from('ad_user').select('user_id, first_name, last_name, email').eq('organisation_id', orgId).order('first_name'),
    sb.from('ad_document').select('doc_id, name').eq('organisation_id', orgId),
    sb.from('ad_distribution').select('distribution_id, name, doc_id, instructions').eq('organisation_id', orgId),
    sb.from('ad_audience').select('audience_id, name').eq('organisation_id', orgId),
    sb.from('ad_distribution_audience').select('distribution_id, audience_id').eq('organisation_id', orgId),
  ]);

  allDocuments     = documents     || [];
  allDistributions = distributions || [];
  allAudiences     = audiences     || [];

  const audMap = Object.fromEntries((allAudiences).map(a => [a.audience_id, a.name]));
  (distAuds || []).forEach(da => {
    const name = audMap[da.audience_id];
    if (!name) return;
    if (!audiencesByDist[da.distribution_id]) audiencesByDist[da.distribution_id] = [];
    audiencesByDist[da.distribution_id].push(name);
  });

  const expandParam = new URLSearchParams(window.location.search).get('expand');

  if (isAdmin) {
    // Admin mode — show user picker
    const picker = document.getElementById('userSelect');
    picker.style.display = '';
    (users || []).forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.user_id;
      opt.textContent = [u.first_name, u.last_name].filter(Boolean).join(' ') || u.email;
      picker.appendChild(opt);
    });

    picker.addEventListener('change', () => {
      currentUserId = picker.value || null;
      StatusWidget.setUser(currentUserId);
      if (picker.value) loadItems(picker.value);
      else clearItems();
    });

    // Pre-select stored user if arriving from status widget
    const storedUser = localStorage.getItem('approvedoc_status_user_id');
    if (storedUser && (users || []).find(u => u.user_id === storedUser)) {
      picker.value  = storedUser;
      currentUserId = storedUser;
      const { data } = await sb.from('ad_distribution_item')
        .select('*').eq('user_id', storedUser)
        .eq('organisation_id', orgId)
        .order('due_date', { ascending: true, nullsFirst: false });
      allItems = data || [];
      renderSections(allItems, expandParam || null);
    }
  } else {
    // User mode — hide picker, auto-load current user's own data
    const myId   = session.user.id;
    const myName = profile?.display_name || session.user.email;
    currentUserId = myId;

    document.getElementById('pickerCard').style.display = 'none';

    StatusWidget.setUser(myId);
    await loadItems(myId);

    if (expandParam) {
      renderSections(allItems, expandParam);
    }
  }
})();

async function loadItems(userId) {
  const { data, error } = await sb.from('ad_distribution_item')
    .select('*')
    .eq('user_id', userId)
    .eq('organisation_id', Auth.getOrganisationId())
    .order('due_date', { ascending: true, nullsFirst: false });

  if (error) { App.toast('Failed to load items: ' + error.message, 'danger'); return; }
  allItems = data || [];
  renderSections(allItems);
}

function clearItems() {
  document.getElementById('rowCount').textContent = '';
  document.getElementById('statsRibbon').style.display = 'none';
  document.getElementById('tableCard').style.display = 'none';
  document.getElementById('emptyMsg').style.display = '';
}

function docName(distributionId) {
  const dist = allDistributions.find(d => d.distribution_id === distributionId);
  if (!dist?.doc_id) return '—';
  const doc = allDocuments.find(d => d.doc_id === dist.doc_id);
  return doc ? doc.name : '—';
}

function distInstructions(distributionId) {
  const dist = allDistributions.find(d => d.distribution_id === distributionId);
  return dist?.instructions || '';
}

function audienceNames(distributionId) {
  const names = audiencesByDist[distributionId];
  return names?.length ? names.join(', ') : '—';
}

function fmt(dateStr) {
  if (!dateStr) return '—';
  return new Date(dateStr).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function pill(label, colour) {
  return `<span class="badge" style="background:${colour};color:#fff">${label}</span>`;
}

function c(key) {
  return STATUS_COLOURS.find(s => s.key === key)?.colour || '#0070C0';
}

function dueStatus(item) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  if (item.rejected)     return pill('Rejected',     c('rejected'));
  if (item.acknowledged) return pill('Acknowledged', c('acknowledged'));
  if (!item.due_date)    return pill('No due date',  c('nodue'));

  const due = new Date(item.due_date);
  if (due < today)       return pill('Overdue',      c('overdue'));

  const warn = item.warning1 || item.warning2;
  if (warn && today >= new Date(warn)) return pill('Due soon', c('duesoon'));

  return pill('On time', c('ontime'));
}

function rowHtml(item, hidden) {
  return `<tr class="section-body-row${hidden ? ' hidden' : ''}" data-item-id="${item.distrib_item_id}" style="cursor:pointer" title="Double-click to edit">
    <td>${App.escHtml(docName(item.distribution_id))}</td>
    <td class="text-secondary">${fmt(item.due_date)}</td>
    <td>${dueStatus(item)}</td>
    <td class="text-secondary">${App.escHtml(audienceNames(item.distribution_id))}</td>
    <td class="text-secondary">${fmt(item.created_at)}</td>
    <td class="text-secondary">${App.escHtml(distInstructions(item.distribution_id))}</td>
    <td>
      <div class="btn-list flex-nowrap">
        <button class="btn btn-icon btn-icon-lg ack-row-btn" data-item-id="${item.distrib_item_id}" data-dist-id="${item.distribution_id}" title="Acknowledge"><i class="ti ti-checklist"></i></button>
      </div>
    </td>
  </tr>`;
}

function sectionHeaderRow(id, title, count, startCollapsed) {
  return `<tr class="section-header${startCollapsed ? ' collapsed' : ''}" data-section="${id}">
    <td colspan="7">
      <span>${title}</span>
      <span class="text-secondary fw-normal ms-1" style="font-size:.8rem">(${count})</span>
      <i class="ti ti-chevron-down section-chevron ms-2"></i>
    </td>
  </tr>`;
}

function renderRibbon(items) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const fmtDate = d => {
    if (!d) return null;
    const dt = new Date(d);
    return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
  };

  const daysDiff = (a, b) => Math.round((b - a) / 86400000);

  // Categorise items
  const ontimeItems      = items.filter(i => !i.acknowledged && !i.rejected && i.due_date && new Date(i.due_date) >= today);
  const overdueItems     = items.filter(i => !i.acknowledged && !i.rejected && i.due_date && new Date(i.due_date) < today);
  const acknowledgedItems = items.filter(i => i.acknowledged);
  const rejectedItems    = items.filter(i => i.rejected);
  const referenceItems   = [];

  // Second lines
  const nextDue = ontimeItems.length
    ? fmtDate(ontimeItems.sort((a,b) => new Date(a.due_date)-new Date(b.due_date))[0].due_date)
    : null;
  const mostOverdue = overdueItems.length
    ? overdueItems.sort((a,b) => new Date(a.due_date)-new Date(b.due_date))[0]
    : null;
  const lastAck = acknowledgedItems.length
    ? acknowledgedItems.sort((a,b) => new Date(b.acknowledged_date)-new Date(a.acknowledged_date))[0].acknowledged_date
    : null;
  const lastRej = rejectedItems.length
    ? rejectedItems.sort((a,b) => new Date(b.rejected_date)-new Date(a.rejected_date))[0].rejected_date
    : null;

  const ontimeSub  = nextDue ? `Next due: ${nextDue}` : '';
  const overdueSub = mostOverdue
    ? `Was due: ${fmtDate(mostOverdue.due_date)} (${daysDiff(new Date(mostOverdue.due_date), today)} days late)`
    : '';
  const ackSub     = lastAck ? `Last acknowledged: ${fmtDate(lastAck)}` : '';
  const rejSub     = lastRej ? `Last rejected: ${fmtDate(lastRej)}` : '';

  const STATS = [
    { key: 'ontime',       label: 'On time',      count: ontimeItems.length,       sub: ontimeSub,  colour: '#009432', bg: '#D9F2D0', textCol: null,      icon: 'ti-clock-check'  },
    { key: 'overdue',      label: 'Overdue',       count: overdueItems.length,      sub: overdueSub, colour: '#EA2027', bg: '#FFD9D9', textCol: null,      icon: 'ti-alert-circle' },
    { key: 'acknowledged', label: 'Acknowledged',  count: acknowledgedItems.length, sub: ackSub,     colour: '#8BC34A', bg: '#E3FDE3', textCol: null,      icon: 'ti-circle-check' },
    { key: 'rejected',     label: 'Rejected',      count: rejectedItems.length,     sub: rejSub,     colour: '#B33771', bg: '#F2CFEE', textCol: null,      icon: 'ti-circle-x'     },
    { key: 'reference',    label: 'Reference',     count: referenceItems.length,    sub: '',         colour: '#0070C0', bg: '#DCEAF7', textCol: '#7F7F7F', icon: 'ti-book'         },
  ];

  const ribbon = document.getElementById('statsRibbon');
  ribbon.innerHTML = `<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:.75rem;margin-bottom:.75rem">${
    STATS.map(s => `
      <div class="card mb-0" style="height:80px;background:${s.bg}">
        <div class="card-body d-flex align-items-center gap-3" style="height:100%;padding:.75rem !important">
          <span style="width:50px;height:50px;border-radius:6px;background:${s.colour};display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <i class="ti ${s.icon}" style="color:#fff;font-size:1.5rem"></i>
          </span>
          <div style="min-width:0">
            <div style="font-size:.9rem;font-weight:600;color:${s.textCol || s.colour};white-space:nowrap">${s.label} (${s.count})</div>
            <div class="text-secondary" style="font-size:.72rem;margin-top:2px;min-height:.9rem${s.textCol ? ';color:'+s.textCol+'!important' : ''}">${s.sub}</div>
          </div>
        </div>
      </div>`).join('')
  }</div>`;

  ribbon.style.display = '';
}

function renderSections(items, expandOnly = null) {
  renderRibbon(items);
  const total = items.length;
  document.getElementById('rowCount').textContent =
    `${total} document${total === 1 ? '' : 's'}`;

  document.getElementById('emptyMsg').style.display = 'none';
  document.getElementById('tableCard').style.display = '';

  const awaiting     = items.filter(i => i.status === 'PENDING' || i.status === 'OVERDUE' || (!i.acknowledged && !i.rejected && i.status !== 'REFERENCE'));
  const acknowledged = items.filter(i => i.status === 'APPROVED' || (i.acknowledged && i.status !== 'REFERENCE'));
  const rejected     = items.filter(i => i.status === 'REJECTED' || i.rejected);
  const reference    = items.filter(i => i.status === 'REFERENCE');

  // If expandOnly is set, only that section is open; otherwise empty sections
  // collapse and non-empty ones open.
  const SECTIONS = [
    { id: 'awaiting',     title: 'Awaiting Action', items: awaiting     },
    { id: 'acknowledged', title: 'Acknowledged',    items: acknowledged },
    { id: 'rejected',     title: 'Rejected',        items: rejected     },
    { id: 'reference',    title: 'Reference',       items: reference    },
  ].map(sec => ({
    ...sec,
    collapsed: expandOnly
      ? sec.id !== expandOnly
      : sec.items.length === 0,
  }));

  const tbody = document.getElementById('mainTableBody');
  tbody.innerHTML = SECTIONS.map(sec => {
    const headerRow = sectionHeaderRow(sec.id, sec.title, sec.items.length, sec.collapsed);
    const colTitles = `<tr class="section-body-row section-col-titles${sec.collapsed ? ' hidden' : ''}">
      <th>Document</th><th>Due date</th><th>Status</th>
      <th>Audience(s)</th><th>Date added</th><th>Instructions</th><th class="w-1"></th>
    </tr>`;
    const bodyRows = sec.items.length
      ? colTitles + sec.items.map(i => rowHtml(i, sec.collapsed)).join('')
      : `<tr class="section-body-row no-items${sec.collapsed ? ' hidden' : ''}">
           <td colspan="7" class="text-secondary small py-2">No items</td>
         </tr>`;
    return headerRow + bodyRows;
  }).join('');

  // Wire collapse toggles
  tbody.querySelectorAll('tr.section-header').forEach(header => {
    header.addEventListener('click', () => {
      const collapsed = header.classList.toggle('collapsed');
      let next = header.nextElementSibling;
      while (next && !next.classList.contains('section-header')) {
        next.classList.toggle('hidden', collapsed);
        next = next.nextElementSibling;
      }
    });
  });

  // Wire double-click and icon buttons — both open the acknowledge page
  tbody.querySelectorAll('tr.section-body-row[data-item-id]').forEach(row => {
    row.addEventListener('dblclick', () => {
      window.location.href = `acknowledge.html?item=${row.dataset.itemId}`;
    });
  });

  tbody.querySelectorAll('.ack-row-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      window.location.href = `acknowledge.html?item=${btn.dataset.itemId}`;
    });
  });
}

function openEditModal(item) {
  document.getElementById('editItemError').classList.add('d-none');
  document.getElementById('editItemId').value        = item.distrib_item_id;
  document.getElementById('editStatus').value        = item.status || 'PENDING';
  document.getElementById('editStartDate').value     = item.start_date || '';
  document.getElementById('editDueDate').value       = item.due_date || '';
  document.getElementById('editAcknowledged').checked = !!item.acknowledged;
  document.getElementById('editAckDate').value       = item.acknowledged_date || '';
  document.getElementById('editRejected').checked    = !!item.rejected;
  document.getElementById('editRejDate').value       = item.rejected_date || '';

  const today = new Date().toISOString().slice(0, 10);

  function syncStatus() {
    const ack = document.getElementById('editAcknowledged').checked;
    const rej = document.getElementById('editRejected').checked;
    document.getElementById('editStatus').value =
      ack ? 'APPROVED' : rej ? 'REJECTED' : 'PENDING';
  }

  document.getElementById('editAcknowledged').onchange = function() {
    document.getElementById('editAckDate').value = this.checked ? today : '';
    syncStatus();
  };
  document.getElementById('editRejected').onchange = function() {
    document.getElementById('editRejDate').value = this.checked ? today : '';
    syncStatus();
  };
  editItemModal.show();
}

async function saveEditItem() {
  const errorEl = document.getElementById('editItemError');
  errorEl.classList.add('d-none');
  document.getElementById('saveEditSpinner').classList.remove('d-none');
  document.getElementById('saveEditItemBtn').disabled = true;

  const itemId = document.getElementById('editItemId').value;
  const { error } = await sb.from('ad_distribution_item').update({
    status:            document.getElementById('editStatus').value,
    start_date:        document.getElementById('editStartDate').value || null,
    due_date:          document.getElementById('editDueDate').value || null,
    acknowledged:      document.getElementById('editAcknowledged').checked,
    acknowledged_date: document.getElementById('editAckDate').value || null,
    rejected:          document.getElementById('editRejected').checked,
    rejected_date:     document.getElementById('editRejDate').value || null,
    updated_at:        new Date().toISOString(),
  }).eq('distrib_item_id', itemId);

  document.getElementById('saveEditSpinner').classList.add('d-none');
  document.getElementById('saveEditItemBtn').disabled = false;

  if (error) {
    errorEl.textContent = 'Save failed: ' + error.message;
    errorEl.classList.remove('d-none');
    return;
  }

  editItemModal.hide();
  App.toast('Saved');
  if (currentUserId) await loadItems(currentUserId);
  await StatusWidget.refresh();
}
  </script>
