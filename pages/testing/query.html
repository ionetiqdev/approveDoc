<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-app-root="../../">
<head>
  <script>
    // Compute absolute app root URL for JS navigation
    (function() {
      var rel = document.documentElement.getAttribute('data-app-root') || './';
      window._appRootUrl = new URL(rel, window.location.href).href;
      if (!window._appRootUrl.endsWith('/')) window._appRootUrl += '/';
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Query - approveDoc</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/theme.css?r=d8140s93" />

  <script>
    (function() {
      try {
        var root = document.documentElement.dataset.appRoot || './';
        var absoluteRoot = new URL(root, window.location.href).pathname;
        var suffix = ':' + window.location.hostname + absoluteRoot;
        var savedTheme = localStorage.getItem('app_theme');
        var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
        var accent = localStorage.getItem('app_accent' + suffix);
        if (accent) {
          document.documentElement.style.setProperty('--tblr-primary', accent);
          var ah = accent.replace('#','');
          if (ah.length === 3) ah = ah.split('').map(function(c){return c+c;}).join('');
          document.documentElement.style.setProperty('--tblr-primary-rgb', parseInt(ah.slice(0,2),16) + ', ' + parseInt(ah.slice(2,4),16) + ', ' + parseInt(ah.slice(4,6),16));
        }
        var sidebarBg = localStorage.getItem('app_sidebar_bg' + suffix);
        if (sidebarBg) {
          document.documentElement.style.setProperty('--bg-sidebar', sidebarBg);
          var hex = sidebarBg.replace('#', '');
          if (hex.length === 3) hex = hex.split('').map(function(c){return c+c;}).join('');
          var r = parseInt(hex.slice(0,2),16) / 255, g = parseInt(hex.slice(2,4),16) / 255, b = parseInt(hex.slice(4,6),16) / 255;
          var toLinear = function(c){ return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
          var isLight = (0.2126*toLinear(r) + 0.7152*toLinear(g) + 0.0722*toLinear(b)) > 0.5;
          document.documentElement.style.setProperty('--sidebar-fg', isLight ? '#0f172a' : '#ffffff');
          document.documentElement.style.setProperty('--sidebar-fg-rgb', isLight ? '15,23,42' : '255,255,255');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    #sqlEditor {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 13px;
      min-height: 160px;
    }
    #resultsWrapper { max-height: 55vh; overflow: auto; }
  </style>
</head>
<body>

  <aside id="sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app-content-wrapper">

    <header class="navbar navbar-expand-md d-print-none border-bottom">
      <div class="container-fluid">
        <button id="sidebarToggle" class="btn btn-icon" aria-label="Toggle sidebar" title="Toggle sidebar">
          <i class="ti ti-menu-2"></i>
        </button>
        <h1 class="navbar-brand d-none d-sm-inline-block ms-2 mb-0 page-title-lg">Query</h1>
        <div class="navbar-nav flex-row order-md-last align-items-center gap-2">
          <div data-active-organisation></div>
          <button class="btn btn-icon" data-theme-toggle title="Toggle dark mode"><i class="ti ti-moon"></i></button>
          <button class="btn btn-icon" id="headerPreferencesBtn" title="Preferences">
            <i class="ti ti-adjustments"></i>
          </button>
          <span class="avatar avatar-sm rounded-circle bg-primary-lt" data-user-initials>?</span>
          <span class="d-none d-xl-block">
            <span class="d-block fw-semibold" style="font-size:.8125rem" data-user-name>—</span>
            <span class="d-block text-secondary" style="font-size:.7rem" data-user-email>—</span>
          </span>
        </div>
      </div>
    </header>

    <div class="page-body">
      <div class="container-fluid">

        <div class="alert alert-danger d-flex align-items-start">
          <i class="ti ti-alert-triangle me-2 mt-1"></i>
          <div>
            <strong>Super admin only, SELECT-only.</strong>
            Runs against the live database via <code>admin_execute_sql()</code>.
            Writes are blocked at the database level (read-only transaction),
            not just by keyword filtering. Every call is logged to
            <code>admin_sql_log</code>.
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">SQL</h3>
            <div class="card-actions">
              <button id="runBtn" class="btn btn-primary btn-sm">
                <i class="ti ti-player-play me-1"></i>Run
                <span class="text-secondary small ms-1">(Ctrl/Cmd+Enter)</span>
              </button>
            </div>
          </div>
          <div class="card-body">
            <textarea id="sqlEditor" class="form-control" spellcheck="false"
              placeholder="select distrib_item_id, status, created_at from ad_distribution_item order by created_at desc limit 50;"></textarea>
          </div>
        </div>

        <div id="statusLine" class="mt-2 text-secondary small d-none"></div>

        <div id="errorAlert" class="alert alert-danger mt-3 d-none">
          <i class="ti ti-x me-2"></i><span id="errorText"></span>
        </div>

        <div class="card mt-3 d-none" id="resultsCard">
          <div class="card-header">
            <h3 class="card-title">Results</h3>
            <div class="card-actions">
              <span id="rowCount" class="badge bg-blue-lt"></span>
            </div>
          </div>
          <div class="card-body p-0" id="resultsWrapper">
            <table class="table table-vcenter card-table table-striped mb-0" id="resultsTable">
              <thead><tr id="resultsHead"></tr></thead>
              <tbody id="resultsBody"></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/version.js?r=d8140s93"></script>
  <script src="../../assets/js/supabase-client.js?r=d8140s93"></script>
  <script src="../../assets/js/auth.js?r=d8140s93"></script>
  <script src="../../assets/js/app.js?r=d8140s93"></script>
  <script src="../../assets/js/theme.js?r=d8140s93"></script>
  <script src="../../assets/js/sidebar-html.js?r=d8140s93"></script>
  <script src="../../assets/js/sidebar.js?r=d8140s93"></script>
  <script src="../../assets/js/profile-modal.js?r=d8140s93"></script>
  <script src="../../assets/js/status-widget.js?r=d8140s93"></script>
  <script>
(async () => {
  const session = await Auth.requireAuth();
  if (!session) return;
  SidebarHtml.inject(window._appRootUrl || '../../');
  Sidebar.init();
  Auth.refreshUI();

  StatusWidget.init();

  if (!Auth.isSuperAdmin()) {
    App.toast('You do not have access to this page', 'danger');
    window.location.href = '../../index.html';
    return;
  }

  const editor      = document.getElementById('sqlEditor');
  const runBtn       = document.getElementById('runBtn');
  const statusLine   = document.getElementById('statusLine');
  const errorAlert   = document.getElementById('errorAlert');
  const errorText    = document.getElementById('errorText');
  const resultsCard  = document.getElementById('resultsCard');
  const resultsHead  = document.getElementById('resultsHead');
  const resultsBody  = document.getElementById('resultsBody');
  const rowCountEl   = document.getElementById('rowCount');

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderResults(rows) {
    resultsHead.innerHTML = '';
    resultsBody.innerHTML = '';

    if (!rows || rows.length === 0) {
      resultsCard.classList.remove('d-none');
      rowCountEl.textContent = '0 rows';
      resultsBody.innerHTML = '<tr><td class="text-secondary p-3">Query returned no rows.</td></tr>';
      return;
    }

    const columns = Object.keys(rows[0]);
    resultsHead.innerHTML = columns.map(c => `<th>${escapeHtml(c)}</th>`).join('');
    resultsBody.innerHTML = rows.map(row => {
      const cells = columns.map(c => {
        let val = row[c];
        if (val === null || val === undefined) {
          val = '<span class="text-secondary">null</span>';
        } else if (typeof val === 'object') {
          val = `<code>${escapeHtml(JSON.stringify(val))}</code>`;
        } else {
          val = escapeHtml(String(val));
        }
        return `<td>${val}</td>`;
      }).join('');
      return `<tr>${cells}</tr>`;
    }).join('');

    resultsCard.classList.remove('d-none');
    rowCountEl.textContent = `${rows.length} row${rows.length === 1 ? '' : 's'}`;
  }

  async function runQuery() {
    const query = editor.value.trim();
    if (!query) return;

    errorAlert.classList.add('d-none');
    statusLine.classList.remove('d-none');
    statusLine.textContent = 'Running…';
    runBtn.disabled = true;

    const started = performance.now();
    let succeeded = false;
    let rowCount = null;
    let errMessage = null;

    try {
      const { data, error } = await sb.rpc('admin_execute_sql', { query });
      if (error) throw error;

      succeeded = true;
      rowCount = Array.isArray(data) ? data.length : 0;

      const elapsed = Math.round(performance.now() - started);
      statusLine.textContent = `Completed in ${elapsed} ms`;
      renderResults(data);
    } catch (err) {
      errMessage = err.message || String(err);
      resultsCard.classList.add('d-none');
      statusLine.classList.add('d-none');
      errorAlert.classList.remove('d-none');
      errorText.textContent = errMessage;
      App.toast('Query failed: ' + errMessage, 'danger');
    } finally {
      const elapsedMs = Math.round(performance.now() - started);
      // Always log, regardless of outcome - separate RPC call/transaction
      // from admin_execute_sql, deliberately (see supabase/22-*.sql).
      try {
        await sb.rpc('admin_log_sql_call', {
          p_statement: query,
          p_succeeded: succeeded,
          p_row_count: rowCount,
          p_error_message: errMessage,
          p_duration_ms: elapsedMs
        });
      } catch (logErr) {
        console.error('admin_log_sql_call failed:', logErr);
      }
      runBtn.disabled = false;
    }
  }

  runBtn.addEventListener('click', runQuery);
  editor.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      runQuery();
    }
  });
})();
  </script>
</body>
</html>
