<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-app-root="../../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Trail - approveDoc</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <script>
    (function() {
      try {
        var root = document.documentElement.getAttribute('data-app-root') || './';
        var absoluteRoot = new URL(root, window.location.href).pathname;
        var suffix = ':' + window.location.hostname + absoluteRoot;
        window._appRootUrl = (new URL(root, window.location.href)).href;
        if (!window._appRootUrl.endsWith('/')) window._appRootUrl += '/';
        var savedTheme = localStorage.getItem('app_theme');
        var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
        var accent = localStorage.getItem('app_accent' + suffix);
        if (accent) {
          document.documentElement.style.setProperty('--tblr-primary', accent);
          var ah = accent.replace('#','');
          if (ah.length === 3) ah = ah.split('').map(function(c){return c+c;}).join('');
          document.documentElement.style.setProperty('--tblr-primary-rgb', parseInt(ah.slice(0,2),16) + ', ' + parseInt(ah.slice(2,4),16) + ', ' + parseInt(ah.slice(4,6),16));
        }
        var sidebarBg = localStorage.getItem('app_sidebar_bg' + suffix);
        if (sidebarBg) {
          document.documentElement.style.setProperty('--bg-sidebar', sidebarBg);
        }
      } catch(e) {}
    })();
  </script>
  <style>
    html, body { height: 100%; overflow: hidden; }
    .app-content-wrapper { height: 100vh; display: flex; flex-direction: column; }
    .page-body { flex: 1; min-height: 0; overflow-y: auto; }
    .audit-action-INSERT  { color: #2fb344; }
    .audit-action-UPDATE  { color: #f76707; }
    .audit-action-DELETE  { color: #d63939; }
    .audit-action-CUSTOM  { color: #4263eb; }
    .json-diff { font-size: .75rem; font-family: monospace; max-height: 200px; overflow-y: auto; }
    .diff-added   { background: rgba(47,179,68,.12);  border-left: 3px solid #2fb344; padding: 2px 6px; }
    .diff-removed { background: rgba(214,57,57,.12);  border-left: 3px solid #d63939; padding: 2px 6px; }
    .diff-same    { background: transparent; padding: 2px 6px; color: var(--tblr-secondary-color); }
  </style>
</head>
<body>
  <aside id="sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app-content-wrapper">
    <header class="navbar navbar-expand-md d-print-none border-bottom">
      <div class="container-fluid">
        <button id="sidebarToggle" class="btn btn-icon"><i class="ti ti-menu-2"></i></button>
        <h1 class="navbar-brand d-none d-sm-inline-block ms-2 mb-0 page-title-lg">Audit Trail</h1>
        <div class="navbar-nav flex-row order-md-last align-items-center gap-2">
          <div data-active-organisation></div>
          <button class="btn btn-icon" data-theme-toggle><i class="ti ti-moon"></i></button>
          <button class="btn btn-icon" id="headerPreferencesBtn"><i class="ti ti-adjustments"></i></button>
          <span class="avatar avatar-sm rounded-circle bg-primary-lt" data-user-initials>?</span>
          <span class="d-none d-xl-block">
            <span class="d-block fw-semibold" style="font-size:.8125rem" data-user-name>-</span>
            <span class="d-block text-secondary" style="font-size:.7rem" data-user-email>-</span>
          </span>
        </div>
      </div>
    </header>

    <div class="page-body">
      <div class="container-fluid py-3">

        <!-- Filters -->
        <div class="card mb-3">
          <div class="card-body">
            <div class="row g-2 align-items-end">
              <div class="col-md-2">
                <label class="form-label">Action</label>
                <select id="filterAction" class="form-select form-select-sm">
                  <option value="">All</option>
                  <option value="INSERT">Insert</option>
                  <option value="UPDATE">Update</option>
                  <option value="DELETE">Delete</option>
                  <option value="CUSTOM">Custom</option>
                </select>
              </div>
              <div class="col-md-2">
                <label class="form-label">Table</label>
                <select id="filterTable" class="form-select form-select-sm">
                  <option value="">All tables</option>
                </select>
              </div>
              <div class="col-md-2">
                <label class="form-label">From</label>
                <input type="date" id="filterFrom" class="form-control form-control-sm" />
              </div>
              <div class="col-md-2">
                <label class="form-label">To</label>
                <input type="date" id="filterTo" class="form-control form-control-sm" />
              </div>
              <div class="col-md-3">
                <label class="form-label">Search record ID or comment</label>
                <input type="text" id="filterSearch" class="form-control form-control-sm" placeholder="UUID or keyword..." />
              </div>
              <div class="col-md-1 d-flex gap-2">
                <button class="btn btn-primary btn-sm w-100" id="applyFilters">Filter</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Results -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Audit Log</h3>
            <div class="card-options">
              <span class="text-secondary small" id="resultCount"></span>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-vcenter table-hover card-table mb-0">
              <thead>
                <tr>
                  <th style="width:140px">When</th>
                  <th style="width:130px">User</th>
                  <th style="width:70px">Action</th>
                  <th style="width:160px">Table</th>
                  <th style="width:200px">Record ID</th>
                  <th>Changes</th>
                  <th style="width:160px">Comment</th>
                </tr>
              </thead>
              <tbody id="auditBody">
                <tr><td colspan="7" class="text-center py-4 text-secondary">
                  <div class="spinner-border spinner-border-sm me-2"></div>Loading...
                </td></tr>
              </tbody>
            </table>
          </div>
          <div class="card-footer d-flex justify-content-between align-items-center">
            <button class="btn btn-sm btn-outline-secondary" id="prevPage" disabled>
              <i class="ti ti-chevron-left"></i> Previous
            </button>
            <span class="text-secondary small" id="pageInfo"></span>
            <button class="btn btn-sm btn-outline-secondary" id="nextPage" disabled>
              Next <i class="ti ti-chevron-right"></i>
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/version.js"></script>
  <script src="../../assets/js/supabase-client.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/sidebar-html.js"></script>
  <script src="../../assets/js/sidebar.js"></script>
  <script src="../../assets/js/profile-modal.js"></script>
  <script src="../../assets/js/status-widget.js"></script>
  <script>
const PAGE_SIZE = 50;
let currentPage = 0;
let totalCount   = 0;
let userCache    = {};

(async () => {
  const session = await Auth.requireAuth();
  if (!session) return;
  if (!Auth.isAdmin()) {
    App.toast('Access denied', 'danger');
    window.location.href = window._appRootUrl + 'index.html';
    return;
  }
  SidebarHtml.inject(window._appRootUrl || '../../');
  Sidebar.init();
  Auth.refreshUI();
  StatusWidget.init();

  await loadTableList();
  await loadPage(0);

  document.getElementById('applyFilters').addEventListener('click', () => loadPage(0));
  document.getElementById('prevPage').addEventListener('click', () => loadPage(currentPage - 1));
  document.getElementById('nextPage').addEventListener('click', () => loadPage(currentPage + 1));
})();

async function loadTableList() {
  const { data } = await sb.from('audit_log').select('table_name').eq('organisation_id', Auth.getOrganisationId());
  if (!data) return;
  const tables = [...new Set(data.map(r => r.table_name))].sort();
  const sel = document.getElementById('filterTable');
  tables.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    sel.appendChild(opt);
  });
}

async function loadPage(page) {
  currentPage = page;
  const tbody = document.getElementById('auditBody');
  tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-secondary"><div class="spinner-border spinner-border-sm me-2"></div>Loading...</td></tr>';

  const action  = document.getElementById('filterAction').value;
  const table   = document.getElementById('filterTable').value;
  const from    = document.getElementById('filterFrom').value;
  const to      = document.getElementById('filterTo').value;
  const search  = document.getElementById('filterSearch').value.trim();
  const orgId   = Auth.getOrganisationId();

  let query = sb.from('audit_log').select('*', { count: 'exact' });

  if (!Auth.isSuperAdmin()) query = query.eq('organisation_id', orgId);
  if (action)  query = query.eq('action', action);
  if (table)   query = query.eq('table_name', table);
  if (from)    query = query.gte('created_at', from);
  if (to)      query = query.lte('created_at', to + 'T23:59:59');
  if (search)  query = query.or(`record_id.ilike.%${search}%,comment.ilike.%${search}%`);

  query = query.order('created_at', { ascending: false })
               .range(page * PAGE_SIZE, (page + 1) * PAGE_SIZE - 1);

  const { data, count, error } = await query;

  if (error) {
    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">${App.escHtml(error.message)}</td></tr>`;
    return;
  }

  totalCount = count || 0;
  document.getElementById('resultCount').textContent = `${totalCount.toLocaleString()} record${totalCount !== 1 ? 's' : ''}`;
  document.getElementById('pageInfo').textContent = `Page ${page + 1} of ${Math.max(1, Math.ceil(totalCount / PAGE_SIZE))}`;
  document.getElementById('prevPage').disabled = page === 0;
  document.getElementById('nextPage').disabled = (page + 1) * PAGE_SIZE >= totalCount;

  if (!data?.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-secondary py-4">No audit records found</td></tr>';
    return;
  }

  // Load user display names
  const userIds = [...new Set(data.filter(r => r.user_id).map(r => r.user_id))].filter(id => !userCache[id]);
  if (userIds.length) {
    const { data: profiles } = await sb.from('profiles').select('id, display_name').in('id', userIds);
    (profiles || []).forEach(p => { userCache[p.id] = p.display_name; });
  }

  tbody.innerHTML = data.map(row => {
    const userName = row.user_id ? (userCache[row.user_id] || row.user_id.slice(0,8) + '...') : 'System';
    const when = App.formatDateTime(row.created_at);
    const actionClass = `audit-action-${row.action}`;
    const changes = renderChanges(row);
    return `<tr>
      <td class="text-secondary small">${App.escHtml(when)}</td>
      <td class="small">${App.escHtml(userName)}</td>
      <td><span class="fw-semibold ${actionClass}">${row.action}</span></td>
      <td class="text-secondary small">${App.escHtml(row.table_name)}</td>
      <td class="small text-secondary" style="font-family:monospace;font-size:.7rem">${App.escHtml(row.record_id)}</td>
      <td>${changes}</td>
      <td class="text-secondary small">${App.escHtml(row.comment || '')}</td>
    </tr>`;
  }).join('');
}

function renderChanges(row) {
  if (row.action === 'INSERT') {
    return `<div class="json-diff"><div class="diff-added">+ ${summarise(row.new_values)}</div></div>`;
  }
  if (row.action === 'DELETE') {
    return `<div class="json-diff"><div class="diff-removed">- ${summarise(row.old_values)}</div></div>`;
  }
  if (row.action === 'UPDATE' && row.old_values && row.new_values) {
    const lines = [];
    const allKeys = new Set([...Object.keys(row.old_values), ...Object.keys(row.new_values)]);
    for (const key of allKeys) {
      const oldVal = JSON.stringify(row.old_values[key]);
      const newVal = JSON.stringify(row.new_values[key]);
      if (oldVal !== newVal) {
        lines.push(`<div class="diff-removed">- ${App.escHtml(key)}: ${App.escHtml(oldVal)}</div>`);
        lines.push(`<div class="diff-added">+ ${App.escHtml(key)}: ${App.escHtml(newVal)}</div>`);
      }
    }
    return lines.length
      ? `<div class="json-diff">${lines.join('')}</div>`
      : '<span class="text-secondary small">No field changes</span>';
  }
  if (row.action === 'CUSTOM') {
    return `<span class="text-secondary small">${App.escHtml(row.comment || '-')}</span>`;
  }
  return '';
}

function summarise(obj) {
  if (!obj) return '';
  const skip = ['organisation_id', 'created_at', 'updated_at'];
  return Object.entries(obj)
    .filter(([k]) => !skip.includes(k))
    .map(([k, v]) => `${k}: ${JSON.stringify(v)}`)
    .join(', ')
    .slice(0, 120);
}
  </script>
</body>
</html>
