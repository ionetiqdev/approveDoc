<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-app-root="../../">
<head>
  <script>
    // Compute absolute app root URL for JS navigation
    (function() {
      var rel = document.documentElement.getAttribute('data-app-root') || './';
      window._appRootUrl = new URL(rel, window.location.href).href;
      if (!window._appRootUrl.endsWith('/')) window._appRootUrl += '/';
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers - approveDoc</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/theme.css?r=r5jyubnf" />

  <script>
    (function() {
      try {
        var root = document.documentElement.dataset.appRoot || './';
        var absoluteRoot = new URL(root, window.location.href).pathname;
        var suffix = ':' + window.location.hostname + absoluteRoot;
        var savedTheme = localStorage.getItem('app_theme');
        var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
        var accent = localStorage.getItem('app_accent' + suffix);
        if (accent) {
          document.documentElement.style.setProperty('--tblr-primary', accent);
          var ah = accent.replace('#','');
          if (ah.length === 3) ah = ah.split('').map(function(c){return c+c;}).join('');
          document.documentElement.style.setProperty('--tblr-primary-rgb', parseInt(ah.slice(0,2),16) + ', ' + parseInt(ah.slice(2,4),16) + ', ' + parseInt(ah.slice(4,6),16));
        }
        var sidebarBg = localStorage.getItem('app_sidebar_bg' + suffix);
        if (sidebarBg) {
          document.documentElement.style.setProperty('--bg-sidebar', sidebarBg);
          var hex = sidebarBg.replace('#', '');
          if (hex.length === 3) hex = hex.split('').map(function(c){return c+c;}).join('');
          var r = parseInt(hex.slice(0,2),16) / 255, g = parseInt(hex.slice(2,4),16) / 255, b = parseInt(hex.slice(4,6),16) / 255;
          var toLinear = function(c){ return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
          var isLight = (0.2126*toLinear(r) + 0.7152*toLinear(g) + 0.0722*toLinear(b)) > 0.5;
          document.documentElement.style.setProperty('--sidebar-fg', isLight ? '#0f172a' : '#ffffff');
          document.documentElement.style.setProperty('--sidebar-fg-rgb', isLight ? '15,23,42' : '255,255,255');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <aside id="sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app-content-wrapper">

    <header class="navbar navbar-expand-md d-print-none border-bottom">
      <div class="container-fluid">
        <button id="sidebarToggle" class="btn btn-icon" aria-label="Toggle sidebar" title="Toggle sidebar">
          <i class="ti ti-menu-2"></i>
        </button>
        <h1 class="navbar-brand d-none d-sm-inline-block ms-2 mb-0 page-title-lg">Customers</h1>
        <div class="navbar-nav flex-row order-md-last align-items-center gap-2">
          <div data-active-organisation></div>
          <button class="btn btn-icon" data-theme-toggle title="Toggle dark mode"><i class="ti ti-moon"></i></button>
          <button class="btn btn-icon" id="headerPreferencesBtn" title="Preferences">
            <i class="ti ti-adjustments"></i>
          </button>
          <span class="avatar avatar-sm rounded-circle bg-primary-lt" data-user-initials>?</span>
          <span class="d-none d-xl-block">
            <span class="d-block fw-semibold" style="font-size:.8125rem" data-user-name>—</span>
            <span class="d-block text-secondary" style="font-size:.7rem" data-user-email>—</span>
          </span>
        </div>
      </div>
    </header>

    <div class="page-body">
      <div class="container-fluid">

        <div class="card">
          <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
            <h3 class="card-title mb-0">Customers</h3>
            <div class="d-flex align-items-center gap-2 flex-wrap">
              <span class="text-secondary small">Show</span>
              <select id="pageSizeSelect" class="form-select form-select-sm" style="width:auto">
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
              <span class="text-secondary small">entries</span>
              <select id="filterStatus" class="form-select form-select-sm ms-3" style="width:auto">
                <option value="">All status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
                <option value="prospect">Prospect</option>
              </select>
              <div class="input-icon" style="width:200px">
                <span class="input-icon-addon"><i class="ti ti-search"></i></span>
                <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search…" />
              </div>
              <button class="btn btn-primary btn-sm role-hidden" id="addCustomerBtn" data-require-role="user">
                <i class="ti ti-plus me-1"></i>Add customer
              </button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table card-table table-vcenter text-nowrap">
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Reference</th>
                  <th>Contact</th>
                  <th>Location</th>
                  <th>Status</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="customersBody">
                <tr><td colspan="6" class="text-center py-4 text-secondary">
                  <span class="spinner-border spinner-border-sm me-2"></span>Loading…
                </td></tr>
              </tbody>
            </table>
          </div>
          <div class="card-footer d-flex align-items-center justify-content-between flex-wrap gap-2">
            <p class="text-secondary small mb-0" id="recordCount"></p>
            <ul class="pagination pagination-sm mb-0" id="paginationControls"></ul>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="modal modal-blur fade" id="customerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="customerModalTitle">Add customer</h5>
          <button type="button" class="modal-close-btn" data-bs-dismiss="modal" aria-label="Close"><i class="ti ti-x"></i></button>
        </div>
        <div class="modal-body">
          <div id="customerModalError" class="alert alert-danger d-none py-2 small mb-3"></div>
          <input type="hidden" id="customerId" />

          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label">Customer name <span class="text-danger">*</span></label>
              <input type="text" id="customerName" class="form-control" placeholder="e.g. Acme Corporation" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Reference</label>
              <input type="text" id="customerRef" class="form-control" placeholder="e.g. ACME-001" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Contact name</label>
              <input type="text" id="customerContactName" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Status</label>
              <select id="customerStatus" class="form-select">
                <option value="prospect">Prospect</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" id="customerEmail" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="text" id="customerPhone" class="form-control" />
            </div>
            <div class="col-12">
              <label class="form-label">Address</label>
              <input type="text" id="customerAddress" class="form-control" placeholder="Street address" />
            </div>
            <div class="col-md-6">
              <label class="form-label">City</label>
              <input type="text" id="customerCity" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Postcode</label>
              <input type="text" id="customerPostcode" class="form-control" />
            </div>
            <div class="col-12">
              <label class="form-label">Notes</label>
              <textarea id="customerNotes" class="form-control" rows="2"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveCustomerBtn">
            <span id="saveCustomerLabel">Save customer</span>
            <span id="saveCustomerSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal modal-blur fade" id="deleteCustomerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-status bg-danger"></div>
        <div class="modal-body text-center py-4">
          <i class="ti ti-trash text-danger mb-2" style="font-size:2.2rem"></i>
          <h6 class="mb-1">Delete customer?</h6>
          <p class="text-secondary small mb-0" id="deleteCustomerName"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteCustomerBtn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/version.js?r=r5jyubnf"></script>
  <script src="../../assets/js/supabase-client.js?r=r5jyubnf"></script>
  <script src="../../assets/js/auth.js?r=r5jyubnf"></script>
  <script src="../../assets/js/app.js?r=r5jyubnf"></script>
  <script src="../../assets/js/theme.js?r=r5jyubnf"></script>
  <script src="../../assets/js/sidebar-html.js?r=r5jyubnf"></script>
  <script src="../../assets/js/sidebar.js?r=r5jyubnf"></script>
  <script src="../../assets/js/profile-modal.js?r=r5jyubnf"></script>
  <script src="../../assets/js/status-widget.js?r=r5jyubnf"></script>
  <script>
let customerModal, deleteCustomerModal;
let allCustomers = [];
let pendingDeleteId = null;
let currentPage = 1;
let pageSize = 10;

(async () => {
  const session = await Auth.requireAuth();
  if (!session) return;
  SidebarHtml.inject(window._appRootUrl || '../../');
  Sidebar.init();
  Auth.refreshUI();

  StatusWidget.init();

  customerModal       = new bootstrap.Modal(document.getElementById('customerModal'));
  deleteCustomerModal = new bootstrap.Modal(document.getElementById('deleteCustomerModal'));

  await loadCustomers();

  document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; renderTable(); });
  document.getElementById('filterStatus').addEventListener('change', () => { currentPage = 1; renderTable(); });
  document.getElementById('pageSizeSelect').addEventListener('change', e => {
    pageSize = parseInt(e.target.value, 10);
    currentPage = 1;
    renderTable();
  });
  document.getElementById('addCustomerBtn').addEventListener('click', () => openModal());
  document.getElementById('saveCustomerBtn').addEventListener('click', saveCustomer);
  document.getElementById('confirmDeleteCustomerBtn').addEventListener('click', confirmDelete);
  document.getElementById('customerModal').addEventListener('hidden.bs.modal', resetModal);
})();

async function loadCustomers() {
  const { data, error } = await sb.from('template_customer').select('*').order('name');
  if (error) { App.toast('Failed to load customers: ' + error.message, 'danger'); return; }
  allCustomers = data || [];
  renderTable();
}

function renderTable() {
  const search = (document.getElementById('searchInput').value || '').toLowerCase();
  const status = document.getElementById('filterStatus').value;

  const filtered = allCustomers.filter(c => {
    if (search && !c.name?.toLowerCase().includes(search) &&
        !c.reference?.toLowerCase().includes(search) &&
        !c.contact_name?.toLowerCase().includes(search) &&
        !c.city?.toLowerCase().includes(search)) return false;
    if (status && c.status !== status) return false;
    return true;
  });

  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  const startIdx = (currentPage - 1) * pageSize;
  const pageItems = filtered.slice(startIdx, startIdx + pageSize);

  const rangeStart = filtered.length ? startIdx + 1 : 0;
  const rangeEnd = Math.min(startIdx + pageSize, filtered.length);
  document.getElementById('recordCount').textContent =
    `Showing ${rangeStart} to ${rangeEnd} of ${filtered.length} entries`;

  const tbody = document.getElementById('customersBody');

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-secondary">
      <i class="ti ti-building-off mb-1 d-block" style="font-size:1.5rem"></i>No customers found
    </td></tr>`;
    _renderPagination(1, 1);
    return;
  }

  const canEdit = Auth.canEdit();

  tbody.innerHTML = pageItems.map(c => `
    <tr>
      <td>${App.escHtml(c.name)}</td>
      <td class="text-secondary">${c.reference ? App.escHtml(c.reference) : '—'}</td>
      <td class="text-secondary">
        ${c.contact_name ? App.escHtml(c.contact_name) : ''}
        ${c.email ? ` <span class="text-secondary">(${App.escHtml(c.email)})</span>` : ''}
        ${!c.contact_name && !c.email ? '—' : ''}
      </td>
      <td class="text-secondary">${[c.city, c.postcode].filter(Boolean).join(', ') || '—'}</td>
      <td>${_statusDot(c.status)}</td>
      <td class="text-end">
        ${canEdit ? `
        <div class="btn-list flex-nowrap justify-content-end">
          <button class="btn btn-icon btn-icon-lg edit-btn" data-id="${c.id}" title="Edit"><i class="ti ti-edit"></i></button>
          <button class="btn btn-icon btn-icon-lg text-danger delete-btn" data-id="${c.id}" data-name="${App.escHtml(c.name)}" title="Delete"><i class="ti ti-trash"></i></button>
        </div>` : ''}
      </td>
    </tr>`).join('');

  tbody.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const customer = allCustomers.find(c => c.id === btn.dataset.id);
      if (customer) openModal(customer);
    });
  });
  tbody.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      pendingDeleteId = btn.dataset.id;
      document.getElementById('deleteCustomerName').textContent = btn.dataset.name;
      deleteCustomerModal.show();
    });
  });

  _renderPagination(currentPage, totalPages);
}

function _renderPagination(page, totalPages) {
  const el = document.getElementById('paginationControls');
  if (totalPages <= 1) { el.innerHTML = ''; return; }

  let html = `<li class="page-item ${page === 1 ? 'disabled' : ''}">
    <a class="page-link" href="#" data-page="${page - 1}"><i class="ti ti-chevron-left"></i></a>
  </li>`;

  for (let p = 1; p <= totalPages; p++) {
    // Keep the control compact on pages with lots of pages - always show
    // first, last, current, and one neighbour either side; collapse the
    // rest into a non-interactive ellipsis.
    if (totalPages > 7 && p !== 1 && p !== totalPages && Math.abs(p - page) > 1) {
      if (p === 2 || p === totalPages - 1) html += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
      continue;
    }
    html += `<li class="page-item ${p === page ? 'active' : ''}">
      <a class="page-link" href="#" data-page="${p}">${p}</a>
    </li>`;
  }

  html += `<li class="page-item ${page === totalPages ? 'disabled' : ''}">
    <a class="page-link" href="#" data-page="${page + 1}"><i class="ti ti-chevron-right"></i></a>
  </li>`;

  el.innerHTML = html;
  el.querySelectorAll('a[data-page]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const target = parseInt(a.dataset.page, 10);
      if (target >= 1 && target <= totalPages && target !== currentPage) {
        currentPage = target;
        renderTable();
      }
    });
  });
}

function _statusDot(status) {
  const map = { active: 'var(--tblr-success)', inactive: 'var(--tblr-secondary)', prospect: 'var(--tblr-azure)' };
  const label = status ? status.charAt(0).toUpperCase() + status.slice(1) : 'Unknown';
  return `<span class="status-dot" style="background:${map[status] || 'var(--tblr-secondary)'}"></span>${label}`;
}

function openModal(customer = null) {
  resetModal();
  if (customer) {
    document.getElementById('customerModalTitle').textContent = 'Edit customer';
    document.getElementById('saveCustomerLabel').textContent  = 'Update customer';
    document.getElementById('customerId').value          = customer.id;
    document.getElementById('customerName').value        = customer.name || '';
    document.getElementById('customerRef').value         = customer.reference || '';
    document.getElementById('customerContactName').value = customer.contact_name || '';
    document.getElementById('customerStatus').value      = customer.status || 'prospect';
    document.getElementById('customerEmail').value       = customer.email || '';
    document.getElementById('customerPhone').value       = customer.phone || '';
    document.getElementById('customerAddress').value     = customer.address || '';
    document.getElementById('customerCity').value        = customer.city || '';
    document.getElementById('customerPostcode').value    = customer.postcode || '';
    document.getElementById('customerNotes').value       = customer.notes || '';
  }
  customerModal.show();
  setTimeout(() => document.getElementById('customerName').focus(), 300);
}

function resetModal() {
  document.getElementById('customerModalTitle').textContent = 'Add customer';
  document.getElementById('saveCustomerLabel').textContent  = 'Save customer';
  document.getElementById('customerModalError').classList.add('d-none');
  ['customerId','customerName','customerRef','customerContactName','customerEmail','customerPhone','customerAddress','customerCity','customerPostcode','customerNotes']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('customerStatus').value = 'prospect';
}

async function saveCustomer() {
  const errorEl = document.getElementById('customerModalError');
  errorEl.classList.add('d-none');

  const id   = document.getElementById('customerId').value;
  const name = document.getElementById('customerName').value.trim();
  if (!name) { errorEl.textContent = 'Customer name is required.'; errorEl.classList.remove('d-none'); return; }

  const payload = {
    name:         name,
    reference:    document.getElementById('customerRef').value.trim() || null,
    contact_name: document.getElementById('customerContactName').value.trim() || null,
    email:        document.getElementById('customerEmail').value.trim() || null,
    phone:        document.getElementById('customerPhone').value.trim() || null,
    address:      document.getElementById('customerAddress').value.trim() || null,
    city:         document.getElementById('customerCity').value.trim() || null,
    postcode:     document.getElementById('customerPostcode').value.trim() || null,
    status:       document.getElementById('customerStatus').value,
    notes:        document.getElementById('customerNotes').value.trim() || null,
    updated_at:   new Date().toISOString()
  };

  document.getElementById('saveCustomerLabel').textContent = id ? 'Saving…' : 'Adding…';
  document.getElementById('saveCustomerSpinner').classList.remove('d-none');
  document.getElementById('saveCustomerBtn').disabled = true;

  let error;
  if (id) {
    ({ error } = await sb.from('template_customer').update(payload).eq('id', id));
  } else {
    payload.organisation_id = Auth.getOrganisationId();
    ({ error } = await sb.from('template_customer').insert(payload));
  }

  document.getElementById('saveCustomerLabel').textContent = id ? 'Update customer' : 'Save customer';
  document.getElementById('saveCustomerSpinner').classList.add('d-none');
  document.getElementById('saveCustomerBtn').disabled = false;

  if (error) {
    errorEl.textContent = 'Save failed: ' + (error.message || 'Unknown error');
    errorEl.classList.remove('d-none');
    return;
  }

  customerModal.hide();
  App.toast(id ? 'Customer updated' : 'Customer added');
  await loadCustomers();
}

async function confirmDelete() {
  if (!pendingDeleteId) return;
  const { error } = await sb.from('template_customer').delete().eq('id', pendingDeleteId);
  deleteCustomerModal.hide();
  if (error) { App.toast('Delete failed: ' + error.message, 'danger'); return; }
  App.toast('Customer deleted');
  pendingDeleteId = null;
  await loadCustomers();
}
  </script>
</body>
</html>
