<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-app-root="../../">
<head>
  <script>
    // Compute absolute app root URL for JS navigation
    (function() {
      var rel = document.documentElement.getAttribute('data-app-root') || './';
      window._appRootUrl = new URL(rel, window.location.href).href;
      if (!window._appRootUrl.endsWith('/')) window._appRootUrl += '/';
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Distribution - approveDoc</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/theme.css?r=yiz4cojr" />

  <script>
    (function() {
      try {
        var root = document.documentElement.dataset.appRoot || './';
        var absoluteRoot = new URL(root, window.location.href).pathname;
        var suffix = ':' + window.location.hostname + absoluteRoot;
        var savedTheme = localStorage.getItem('app_theme');
        var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
        var accent = localStorage.getItem('app_accent' + suffix);
        if (accent) {
          document.documentElement.style.setProperty('--tblr-primary', accent);
          var ah = accent.replace('#','');
          if (ah.length === 3) ah = ah.split('').map(function(c){return c+c;}).join('');
          document.documentElement.style.setProperty('--tblr-primary-rgb', parseInt(ah.slice(0,2),16) + ', ' + parseInt(ah.slice(2,4),16) + ', ' + parseInt(ah.slice(4,6),16));
        }
        var sidebarBg = localStorage.getItem('app_sidebar_bg' + suffix);
        if (sidebarBg) {
          document.documentElement.style.setProperty('--bg-sidebar', sidebarBg);
          var hex = sidebarBg.replace('#', '');
          if (hex.length === 3) hex = hex.split('').map(function(c){return c+c;}).join('');
          var r = parseInt(hex.slice(0,2),16) / 255, g = parseInt(hex.slice(2,4),16) / 255, b = parseInt(hex.slice(4,6),16) / 255;
          var toLinear = function(c){ return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
          var isLight = (0.2126*toLinear(r) + 0.7152*toLinear(g) + 0.0722*toLinear(b)) > 0.5;
          document.documentElement.style.setProperty('--sidebar-fg', isLight ? '#0f172a' : '#ffffff');
          document.documentElement.style.setProperty('--sidebar-fg-rgb', isLight ? '15,23,42' : '255,255,255');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    html, body { height: 100%; overflow: hidden; }
    .app-content-wrapper { height: 100vh; display: flex; flex-direction: column; }
    .page-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 1rem; padding-bottom: 1rem; }
    .page-body > .container-fluid { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .distribution-card { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .distribution-card .table-scroll { flex: 1; min-height: 0; overflow-y: auto; }
    /* Direction toggle: hover changes text colour only, not background */
    .btn-check + .btn-outline-secondary:hover {
      background: transparent !important;
      color: var(--tblr-primary) !important;
      border-color: var(--tblr-border-color) !important;
    }
    .btn-check:checked + .btn-outline-secondary:hover {
      background: var(--tblr-secondary) !important;
      color: #fff !important;
    }
  </style>
</head>

  <script>
let distributionModal, deleteModal;
let _distSaved = false;
let allDistributions = [];
let allDocuments = [];
let allAudiences = [];
let pendingDeleteId = null;

(async () => {
  const session = await Auth.requireAuth();
  if (!session) return;
  SidebarHtml.inject(window._appRootUrl || '../../');
  Sidebar.init();
  Auth.refreshUI();

  StatusWidget.init();

  if (!Auth.isAdmin()) {
    App.toast('You do not have access to this page', 'danger');
    window.location.href = '../../index.html';
    return;
  }

  distributionModal = new bootstrap.Modal(document.getElementById('distributionModal'));

  // Dirty guard — warn if user closes with unsaved changes
  let _distSnapshot = null;
  let _distGuardWired = false;

  function _distSnapshot_take() {
    return [
      document.getElementById('distributionName').value,
      document.getElementById('distributionDoc').value,
      document.getElementById('distributionType').value,
      document.getElementById('distributionStartDate').value,
      document.getElementById('distributionDueDate').value,
      document.getElementById('distributionDaysToAck').value,
      document.querySelector('input[name="dueDateMode"]:checked')?.value,
      getSelectedAudiences().join(','),
    ].join('|');
  }

  const distModalEl = document.getElementById('distributionModal');
  distModalEl.addEventListener('shown.bs.modal', () => {
    _distSaved    = false;
    _distSnapshot = _distSnapshot_take();
    if (!_distGuardWired) {
      _distGuardWired = true;
      App.guardModalClose(distModalEl, distributionModal, () => !_distSaved && _distSnapshot_take() !== _distSnapshot);
    }
  });
  distModalEl.addEventListener('hidden.bs.modal', () => {
    _distSnapshot = null;
    _distSaved    = false;
    resetModal();
  });

  // Radio toggle: Due date vs Days to acknowledge
  document.querySelectorAll('input[name="dueDateMode"]').forEach(radio => {
    radio.addEventListener('change', () => {
      const isDays = radio.value === 'days';
      document.getElementById('dueDateField').classList.toggle('d-none', isDays);
      document.getElementById('daysToAckField').classList.toggle('d-none', !isDays);
    });
  });
  deleteModal       = new bootstrap.Modal(document.getElementById('deleteModal'));

  await Promise.all([loadDocuments(), loadAudiences(), loadDistributions()]);

  document.getElementById('searchInput').addEventListener('input', renderTable);
  document.getElementById('createDistributionBtn').addEventListener('click', () => openModal());
  document.getElementById('saveDistributionBtn').addEventListener('click', saveDistribution);
  document.getElementById('confirmDeleteBtn').addEventListener('click', confirmDelete);
  // Wire tab validation indicators — red asterisk when required fields missing
  function _updateTabIndicators() {
    const hasAudience = getSelectedAudiences().length > 0;
    const hasWarn1    = !!(document.getElementById('distributionWarn1Days').value &&
                           document.querySelector('input[name="warn1Dir"]:checked')?.value);
    const audTab  = document.querySelector('a[href="#distTabAudiences"]');
    const warnTab = document.querySelector('a[href="#distTabWarnings"]');
    if (audTab)  audTab.innerHTML  = hasAudience ? 'Audiences'  : 'Audiences <span class="text-danger">*</span>';
    if (warnTab) warnTab.innerHTML = hasWarn1    ? 'Warnings'   : 'Warnings <span class="text-danger">*</span>';
  }

  // Update indicators when audiences change
  document.getElementById('audienceList').addEventListener('change', _updateTabIndicators);
  document.getElementById('audienceList').addEventListener('click', _updateTabIndicators);
  document.getElementById('addAudienceBtn').addEventListener('click', () => {
    addAudienceRow();
    setTimeout(_updateTabIndicators, 0);
  });

  // Update indicators when warnings change
  ['distributionWarn1Days', 'warn1DirB', 'warn1DirA'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', _updateTabIndicators);
  });

  distModalEl.addEventListener('shown.bs.modal', _updateTabIndicators);

  // Wire direction toggle buttons
  document.querySelectorAll('.dir-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const newVal = btn.dataset.value === 'B' ? 'A' : 'B';
      const hiddenId = btn.id.replace('Toggle', 'Val');
      _setDirToggle(btn.id, hiddenId, newVal);
    });
  });})();

async function loadDocuments() {
  const { data, error } = await sb.from('ad_document').select('doc_id, name').eq('organisation_id', Auth.getOrganisationId()).order('name');
  if (error) { console.error('[Distribution] documents load error:', error); return; }
  allDocuments = data || [];

  const select = document.getElementById('distributionDoc');
  allDocuments.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.doc_id;
    opt.textContent = d.name;
    select.appendChild(opt);
  });
}

function _setDirToggle(btnId, hiddenId, value) {
  const btn = document.getElementById(btnId);
  const hid = document.getElementById(hiddenId);
  if (!btn || !hid) return;
  hid.value = value;
  btn.dataset.value = value;
  btn.textContent = value === 'B' ? 'Before' : 'After';
}

async function loadAudiences() {
  const { data, error } = await sb.from('ad_audience').select('audience_id, name').eq('organisation_id', Auth.getOrganisationId()).order('name');
  if (error) { console.error('[Distribution] audiences load error:', error); return; }
  allAudiences = data || [];
}

function audienceRowHtml() {
  return `<div class="input-group mb-2 audience-row" style="position:relative">
    <input type="text" class="form-control audience-search" placeholder="Search audiences…" autocomplete="off" />
    <input type="hidden" class="audience-id-input" />
    <button type="button" class="btn btn-outline-secondary remove-audience-btn" title="Remove"><i class="ti ti-x"></i></button>
    <div class="audience-dropdown dropdown-menu w-100" style="display:none;max-height:200px;overflow-y:auto;position:absolute;top:100%;left:0;z-index:9999"></div>
  </div>`;
}

function wireAudienceRow(row, selectedId = '') {
  const input    = row.querySelector('.audience-search');
  const hidden   = row.querySelector('.audience-id-input');
  const dropdown = row.querySelector('.audience-dropdown');
  const removeBtn = row.querySelector('.remove-audience-btn');

  // Pre-fill if editing
  if (selectedId) {
    const a = allAudiences.find(a => a.audience_id === selectedId);
    if (a) { input.value = a.name; hidden.value = selectedId; }
  }

  function showDropdown(term) {
    const lower = term.toLowerCase();
    // Exclude audiences already selected in other rows
    const allHiddens = [...document.querySelectorAll('#audienceList .audience-id-input')];
    const otherIds = new Set(allHiddens.filter(h2 => h2 !== hidden).map(h2 => h2.value).filter(v => v));
    const available = allAudiences.filter(a => !otherIds.has(a.audience_id));
    const matches = term
      ? available.filter(a => a.name.toLowerCase().includes(lower))
      : available;
    if (!matches.length) { dropdown.style.display = 'none'; return; }
    dropdown.innerHTML = matches.map(a =>
      `<button type="button" class="dropdown-item" data-id="${a.audience_id}">${App.escHtml(a.name)}</button>`
    ).join('');
    dropdown.querySelectorAll('.dropdown-item').forEach(btn => {
      btn.addEventListener('mousedown', e => {
        e.preventDefault();
        input.value  = btn.textContent;
        hidden.value = btn.dataset.id;
        dropdown.style.display = 'none';
      });
    });
    dropdown.style.display = 'block';
  }

  input.addEventListener('input', () => {
    hidden.value = '';
    showDropdown(input.value.trim());
  });
  input.addEventListener('focus', () => showDropdown(input.value.trim()));
  input.addEventListener('blur', () => setTimeout(() => { dropdown.style.display = 'none'; }, 150));
  removeBtn.addEventListener('click', () => row.remove());
}

function addAudienceRow(selectedId = '') {
  const list = document.getElementById('audienceList');
  const div  = document.createElement('div');
  div.innerHTML = audienceRowHtml();
  const row = div.firstElementChild;
  list.appendChild(row);
  wireAudienceRow(row, selectedId);
}

function getSelectedAudiences() {
  return [...document.querySelectorAll('#audienceList .audience-id-input')]
    .map(h => h.value).filter(v => !!v);
}

async function loadDistributions() {
  const { data, error } = await sb.from('ad_distribution').select('*').eq('organisation_id', Auth.getOrganisationId()).order('created_at', { ascending: false });

  if (error) {
    console.error('[Distribution] Load error:', error);
    App.toast('Failed to load distributions: ' + error.message, 'danger');
    return;
  }

  allDistributions = data || [];
  renderTable();
}

function getFiltered() {
  const search = (document.getElementById('searchInput').value || '').toLowerCase();
  if (!search) return allDistributions;
  return allDistributions.filter(d => {
    if (d.name?.toLowerCase().includes(search)) return true;
    const doc = allDocuments.find(doc => doc.doc_id === d.doc_id);
    if (doc?.name?.toLowerCase().includes(search)) return true;
    return false;
  });
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function typePill(d) {
  const type = d.distribution_type || '';
  if (type === 'ONEOFF')    return `<span class="badge bg-blue-lt">One off</span>`;
  if (type === 'FIXED_VAL') return `<span class="badge bg-purple-lt">Fixed validity</span>`;
  if (type === 'TO_CLOSE')  return `<span class="badge bg-orange-lt">Until closed</span>`;
  return `<span class="badge bg-secondary-lt">—</span>`;
}

function statusPill(d) {
  const status = (d.status || '').toLowerCase();
  if (status === 'active')   return `<span class="badge bg-success-lt">Active</span>`;
  if (status === 'complete') return `<span class="badge bg-secondary-lt">Complete</span>`;
  if (status === 'draft')    return `<span class="badge bg-warning-lt">Draft</span>`;
  if (status === 'cancelled') return `<span class="badge bg-danger-lt">Cancelled</span>`;
  return `<span class="badge bg-secondary-lt">—</span>`;
}

function renderTable() {
  const filtered = getFiltered();
  const tbody = document.getElementById('distributionBody');

  document.getElementById('pageInfo').textContent = filtered.length
    ? `${filtered.length} distribution${filtered.length === 1 ? '' : 's'}`
    : 'No distributions found';

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-secondary">
      <i class="ti ti-send mb-1 d-block" style="font-size:1.5rem"></i>No distributions yet
    </td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(d => {
    const doc = allDocuments.find(doc => doc.doc_id === d.doc_id);
    return `<tr>
      <td class="fw-semibold">${App.escHtml(d.name)}</td>
      <td class="text-secondary">${doc ? App.escHtml(doc.name) : '—'}</td>
      <td>${typePill(d)}</td>
      <td class="text-secondary">${formatDate(d.start_date)}</td>
      <td class="text-secondary">${formatDate(d.due_date)}</td>
      <td>${statusPill(d)}</td>
      <td>
        <div class="btn-list flex-nowrap">
          <button class="btn btn-icon btn-icon-lg edit-btn" data-id="${d.distribution_id}" title="Edit"><i class="ti ti-edit"></i></button>
          <button class="btn btn-icon btn-icon-lg text-danger delete-btn" data-id="${d.distribution_id}" data-name="${App.escHtml(d.name)}" title="Delete"><i class="ti ti-trash"></i></button>
        </div>
      </td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = allDistributions.find(d => d.distribution_id === btn.dataset.id);
      if (item) openModal(item);
    });
  });

  tbody.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      pendingDeleteId = btn.dataset.id;
      document.getElementById('deleteDistributionName').textContent = btn.dataset.name;
      deleteModal.show();
    });
  });
}

async function openModal(item = null) {
  resetModal();
  if (item) {
    document.getElementById('distributionModalTitle').textContent = 'Edit distribution';
    document.getElementById('saveDistributionLabel').textContent  = 'Update';
    document.getElementById('distributionId').value             = item.distribution_id;
    document.getElementById('distributionName').value           = item.name || '';
    document.getElementById('distributionDoc').value            = item.doc_id || '';
    document.getElementById('distributionType').value           = item.distribution_type || '';
    document.getElementById('distributionInstructions').value   = item.instructions || '';
    document.getElementById('distributionStartDate').value      = item.start_date || '';
    document.getElementById('distributionDueDate').value        = item.due_date || '';
    document.getElementById('distributionDaysToAck').value      = item.days_to_acknowledge ?? '';
    document.getElementById('distributionWarn1Days').value      = item.first_warning_days ?? '';
    const w1dir = item.first_warning_direction || 'B';
    document.getElementById('warn1DirB').checked = w1dir === 'B';
    document.getElementById('warn1DirA').checked = w1dir === 'A';
    document.getElementById('distributionWarn2Days').value      = item.second_warning_days ?? '';
    const w2dir = item.second_warning_direction || 'B';
    document.getElementById('warn2DirB').checked = w2dir === 'B';
    document.getElementById('warn2DirA').checked = w2dir === 'A';
    document.getElementById('distributionReqPassword').checked  = item.req_password ?? false;

    // Set radio based on whether days_to_acknowledge was used
    const useDays = !!item.days_to_acknowledge;
    document.getElementById(useDays ? 'dueDateModeDays' : 'dueDateModeDate').checked = true;
    document.getElementById('dueDateField').classList.toggle('d-none', useDays);
    document.getElementById('daysToAckField').classList.toggle('d-none', !useDays);

    // Load existing audience links in sort_order order
    const { data: links } = await sb.from('ad_distribution_audience')
      .select('audience_id')
      .eq('distribution_id', item.distribution_id)
      .order('sort_order');
    document.getElementById('audienceList').innerHTML = '';
    (links || []).forEach(link => addAudienceRow(link.audience_id));
    if (!links?.length) addAudienceRow();
  } else {
    addAudienceRow();
  }
  distributionModal.show();
  setTimeout(() => document.getElementById('distributionName').focus(), 300);
}

function resetModal() {
  document.getElementById('distributionModalTitle').textContent = 'Create distribution';
  document.getElementById('saveDistributionBtn').disabled  = false;
  document.getElementById('saveDistributionLabel').textContent  = 'Save';
  document.getElementById('distributionModalError').classList.add('d-none');
  document.getElementById('distributionId').value             = '';
  document.getElementById('distributionName').value           = '';
  document.getElementById('distributionDoc').value            = '';
  document.getElementById('distributionType').value           = '';
  document.getElementById('distributionInstructions').value   = '';
  document.getElementById('distributionStartDate').value      = '';
  document.getElementById('distributionDueDate').value        = '';
  document.getElementById('distributionDaysToAck').value      = '';
  document.getElementById('distributionWarn1Days').value      = '';
  document.getElementById('warn1DirB').checked = true;
  document.getElementById('distributionWarn2Days').value      = '';
  document.getElementById('warn2DirB').checked = true;
  document.getElementById('distributionReqPassword').checked  = false;
  // Reset radio to Due date mode
  document.getElementById('dueDateModeDate').checked = true;
  document.getElementById('dueDateField').classList.remove('d-none');
  document.getElementById('daysToAckField').classList.add('d-none');
  document.getElementById('audienceList').innerHTML = '';
}

async function saveDistribution() {
  const errorEl = document.getElementById('distributionModalError');
  errorEl.classList.add('d-none');

  const id               = document.getElementById('distributionId').value;
  const name             = document.getElementById('distributionName').value.trim();
  const docId            = document.getElementById('distributionDoc').value || null;
  const distributionType = document.getElementById('distributionType').value || null;
  const instructions     = document.getElementById('distributionInstructions').value.trim() || null;
  const startDate        = document.getElementById('distributionStartDate').value || null;
  const dueDateMode      = document.querySelector('input[name="dueDateMode"]:checked')?.value || 'date';
  const dueDateRaw       = document.getElementById('distributionDueDate').value || null;
  const daysToAck        = document.getElementById('distributionDaysToAck').value ? parseInt(document.getElementById('distributionDaysToAck').value) : null;
  const reqPassword      = document.getElementById('distributionReqPassword').checked;

  // Compute effective due date
  let dueDate = null;
  if (dueDateMode === 'date') {
    dueDate = dueDateRaw;
  } else if (dueDateMode === 'days' && startDate && daysToAck) {
    const d = new Date(startDate);
    d.setDate(d.getDate() + daysToAck);
    dueDate = d.toISOString().slice(0, 10);
  }

  // Comprehensive validation
  const errors = [];
  if (!name)             errors.push('Name');
  if (!docId)            errors.push('Document');
  if (!distributionType) errors.push('Distribution type');
  if (!startDate)        errors.push('Start date');
  if (!dueDate)          errors.push(dueDateMode === 'days' ? 'Days to acknowledge' : 'Due date');

  const selectedAudiences = getSelectedAudiences();
  if (!selectedAudiences.length) errors.push('At least one audience');

  const warn1Days = document.getElementById('distributionWarn1Days').value ? parseInt(document.getElementById('distributionWarn1Days').value) : null;
  const warn1Dir  = document.querySelector('input[name="warn1Dir"]:checked')?.value || null;
  if (!warn1Days || !warn1Dir) errors.push('At least first warning — days and direction');

  if (errors.length) {
    errorEl.innerHTML = `Please complete the following required fields:<ul class="mb-0 mt-1">${errors.map(e => `<li>${e}</li>`).join('')}</ul>`;
    errorEl.classList.remove('d-none');
    return;
  }
  const warn2Days = document.getElementById('distributionWarn2Days').value ? parseInt(document.getElementById('distributionWarn2Days').value) : null;
  const warn2Dir  = document.querySelector('input[name="warn2Dir"]:checked')?.value || null;

  document.getElementById('saveDistributionSpinner').classList.remove('d-none');
  document.getElementById('saveDistributionBtn').disabled = true;

  const payload = {
    name,
    doc_id: docId,
    distribution_type: distributionType,
    instructions,
    start_date: startDate,
    due_date: dueDate,
    days_to_acknowledge: dueDateMode === 'days' ? daysToAck : null,
    first_warning_days: warn1Days,
    first_warning_direction: warn1Dir,
    second_warning_days: warn2Days,
    second_warning_direction: warn2Dir,
    req_acknowledgement: true,
    req_password: reqPassword,
    owner: Auth.getSession()?.user?.id || null,
    organisation_id: Auth.getOrganisationId()
  };

  let error, newDistribId;
  if (id) {
    ({ error } = await sb.from('ad_distribution').update(payload).eq('distribution_id', id));
    newDistribId = id;
  } else {
    const { data: created, error: insertErr } = await sb.from('ad_distribution').insert(payload).select('distribution_id').single();
    error = insertErr;
    newDistribId = created?.distribution_id;
  }

  document.getElementById('saveDistributionSpinner').classList.add('d-none');
  // Keep button disabled until modal is fully closed to prevent double-save

  if (error) {
    errorEl.textContent = 'Save failed: ' + (error.message || 'Unknown error');
    errorEl.classList.remove('d-none');
    document.getElementById('saveDistributionBtn').disabled = false;
    return;
  }

  // Save audience links - delete existing and re-insert selected ones.
  // Done before build_distribution_items so the function picks up the
  // latest audience set.
  if (newDistribId) {
    await sb.from('ad_distribution_audience').delete().eq('distribution_id', newDistribId);

    const audienceRows = selectedAudiences
      .map((audienceId, i) => ({
        distribution_id: newDistribId,
        audience_id: audienceId,
        organisation_id: Auth.getOrganisationId(),
        sort_order: i
      }));

    if (audienceRows.length) {
      const { error: audErr } = await sb.from('ad_distribution_audience').insert(audienceRows);
      if (audErr) App.toast('Audience links could not be saved: ' + audErr.message, 'warning');
    }
  }

  _distSaved    = true;   // prevents dirty guard from prompting
  _distSnapshot = null;
  distributionModal.hide();
  App.toast(id ? 'Updated' : 'Created');
  await loadDistributions();

  if (newDistribId) {
    const { data: itemCount, error: rpcErr } = await sb.rpc('build_distribution_items', { p_distribution_id: newDistribId });
    if (rpcErr) {
      App.toast('Distribution saved but items could not be built: ' + rpcErr.message, 'warning');
    } else if (itemCount > 0) {
      App.toast(`${itemCount} distribution item${itemCount === 1 ? '' : 's'} created`);
    }
  }
}

async function confirmDelete() {
  if (!pendingDeleteId) return;
  const { error } = await sb.from('ad_distribution').delete().eq('distribution_id', pendingDeleteId);
  deleteModal.hide();
  if (error) { App.toast('Delete failed: ' + error.message, 'danger'); return; }
  App.toast('Deleted');
  pendingDeleteId = null;
  await loadDistributions();
}
  </script>
