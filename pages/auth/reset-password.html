<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-app-root="../../">
<head>
  <script>
    // Compute absolute app root URL for JS navigation
    (function() {
      var rel = document.documentElement.getAttribute('data-app-root') || './';
      window._appRootUrl = new URL(rel, window.location.href).href;
      if (!window._appRootUrl.endsWith('/')) window._appRootUrl += '/';
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - approveDoc</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/theme.css?r=r92c8j6l" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: .75rem; }
    .login-card { width: 100%; max-width: 400px; }
    .login-logo { width: 48px; height: 48px; background: rgb(var(--tblr-primary-rgb)); border-radius: var(--tblr-border-radius, .375rem); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #fff; margin: 0 auto 1rem; }
    .login-brand { font-weight: 700; font-size: 1.25rem; text-align: center; }
    .login-sub { text-align: center; color: var(--tblr-secondary-color); font-size: .8125rem; margin-top: .25rem; margin-bottom: 1.75rem; }
    .pw-wrapper { position: relative; }
    .pw-toggle { position: absolute; right: .75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--tblr-secondary-color); cursor: pointer; padding: 0; font-size: 1rem; }
    .login-footer { font-size: .7rem; color: var(--tblr-secondary-color); text-align: center; }
  </style>
</head>
<body>
  <div class="login-card p-3">
    <div class="card">
      <div class="card-body p-4">
        <div class="login-logo"><i class="ti ti-apps"></i></div>
        <div class="login-brand">approveDoc</div>

        <!-- Step 1: Request reset email -->
        <div id="stepRequest">
          <div class="login-sub">Enter your email to receive a password reset link</div>
          <div id="requestError" class="alert alert-danger d-none py-2 small mb-3"></div>
          <div id="requestSuccess" class="alert alert-success d-none py-2 small mb-3"></div>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" id="resetEmail" class="form-control" placeholder="you@example.com" />
          </div>
          <button id="sendResetBtn" class="btn btn-primary w-100 mb-3">
            <span id="sendLabel">Send Reset Link</span>
            <span id="sendSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
          </button>
          <div class="text-center">
            <a href="login.html" class="text-secondary small">Back to sign in</a>
          </div>
        </div>

        <!-- Step 2: Set new password (shown when token is in URL) -->
        <div id="stepNewPassword" style="display:none">
          <div class="login-sub">Enter your new password</div>
          <div id="newPwError" class="alert alert-danger d-none py-2 small mb-3"></div>
          <div class="mb-3">
            <label class="form-label">New password</label>
            <div class="pw-wrapper">
              <input type="password" id="newPassword" class="form-control" placeholder="Min. 8 characters" autocomplete="new-password" />
              <button type="button" class="pw-toggle" id="pwToggle1"><i class="ti ti-eye"></i></button>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Confirm password</label>
            <div class="pw-wrapper">
              <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" autocomplete="new-password" />
              <button type="button" class="pw-toggle" id="pwToggle2"><i class="ti ti-eye"></i></button>
            </div>
          </div>
          <button id="setPasswordBtn" class="btn btn-primary w-100">
            <span id="setPwLabel">Set New Password</span>
            <span id="setPwSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
          </button>
        </div>

      </div>
    </div>
  </div>
  <div class="login-footer">&copy; 2026 ionetiq</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/supabase-client.js?r=r92c8j6l"></script>
<script src="../../assets/js/theme.js?r=r92c8j6l"></script>
<script>
// Compute the app root correctly regardless of deploy depth (works for
// both /{project}/pages/auth/reset-password.html and /{project}/dev/pages/auth/reset-password.html)
function _appRoot() {
  const path = window.location.pathname;
  const idx = path.indexOf('/pages/auth/reset-password.html');
  if (idx === -1) return '../../';
  return path.substring(0, idx + 1);
}

(async () => {
  // Check if we have a recovery token in the URL hash
  // Supabase sends: #access_token=...&type=recovery
  const hash = window.location.hash;
  const params = new URLSearchParams(hash.replace('#', ''));
  const type = params.get('type');
  const accessToken = params.get('access_token');
  const refreshToken = params.get('refresh_token') || '';

  if ((type === 'recovery' || type === 'invite') && accessToken) {
    // Show the new password form immediately
    document.getElementById('stepRequest').style.display = 'none';
    document.getElementById('stepNewPassword').style.display = '';

    // Set session using Supabase directly - this establishes the auth context
    // needed for updateUser() to work
    const { data, error } = await sb.auth.setSession({
      access_token:  accessToken,
      refresh_token: refreshToken
    });

    if (error || !data.session) {
      document.getElementById('newPwError').textContent = 'Reset link is invalid or has expired. Please request a new one.';
      document.getElementById('newPwError').classList.remove('d-none');
      document.getElementById('setPasswordBtn').disabled = true;
    } else {
      // Also save to AppSession so our auth layer knows about it
      AppSession.save(data.session);
    }
  }

  // Password toggles
  ['pwToggle1', 'pwToggle2'].forEach((btnId, i) => {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    const inp = document.getElementById(i === 0 ? 'newPassword' : 'confirmPassword');
    btn.addEventListener('click', () => {
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.querySelector('i').className = inp.type === 'password' ? 'ti ti-eye' : 'ti ti-eye-off';
    });
  });

  // Send reset email
  document.getElementById('sendResetBtn').addEventListener('click', async () => {
    const email = document.getElementById('resetEmail').value.trim();
    const errorEl = document.getElementById('requestError');
    const successEl = document.getElementById('requestSuccess');
    errorEl.classList.add('d-none');
    successEl.classList.add('d-none');

    if (!email) { errorEl.textContent = 'Please enter your email.'; errorEl.classList.remove('d-none'); return; }

    document.getElementById('sendLabel').textContent = 'Sending…';
    document.getElementById('sendSpinner').classList.remove('d-none');
    document.getElementById('sendResetBtn').disabled = true;

    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + _appRoot() + 'pages/auth/reset-password.html'
    });

    document.getElementById('sendLabel').textContent = 'Send Reset Link';
    document.getElementById('sendSpinner').classList.add('d-none');
    document.getElementById('sendResetBtn').disabled = false;

    if (error) {
      errorEl.textContent = error.message;
      errorEl.classList.remove('d-none');
    } else {
      successEl.textContent = 'Reset link sent - check your email. The link will expire in 1 hour.';
      successEl.classList.remove('d-none');
      document.getElementById('resetEmail').value = '';
    }
  });

  // Set new password
  document.getElementById('setPasswordBtn')?.addEventListener('click', async () => {
    const pw1 = document.getElementById('newPassword').value;
    const pw2 = document.getElementById('confirmPassword').value;
    const errorEl = document.getElementById('newPwError');
    errorEl.classList.add('d-none');

    if (!pw1 || pw1.length < 8) { errorEl.textContent = 'Password must be at least 8 characters.'; errorEl.classList.remove('d-none'); return; }
    if (pw1 !== pw2) { errorEl.textContent = 'Passwords do not match.'; errorEl.classList.remove('d-none'); return; }

    document.getElementById('setPwLabel').textContent = 'Saving…';
    document.getElementById('setPwSpinner').classList.remove('d-none');
    document.getElementById('setPasswordBtn').disabled = true;

    const { error } = await sb.auth.updateUser({ password: pw1 });

    if (error) {
      document.getElementById('setPwLabel').textContent = 'Set New Password';
      document.getElementById('setPwSpinner').classList.add('d-none');
      document.getElementById('setPasswordBtn').disabled = false;
      errorEl.textContent = error.message;
      errorEl.classList.remove('d-none');
    } else {
      // Clear session and redirect to login
      await sb.auth.signOut();
      window.location.href = 'login.html?reset=1';
    }
  });
})();
</script>
</body>
</html>
