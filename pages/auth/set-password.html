<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Password - approveDoc</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <style>
    body { background: #f0f4f8; }
    .auth-card { max-width: 420px; margin: 80px auto; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="mb-2">
            <span class="avatar avatar-lg bg-primary-lt" style="width:56px;height:56px;font-size:1.5rem">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </span>
          </div>
          <h2 class="h3 mb-1">approveDoc</h2>
          <p class="text-secondary" id="pageSubtitle">Set your password</p>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none py-2 small mb-3"></div>
        <div id="successAlert" class="alert alert-success d-none py-2 small mb-3"></div>

        <div id="formArea">
          <div class="mb-3">
            <label class="form-label">New password</label>
            <div class="input-group">
              <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" autocomplete="new-password" />
              <button class="btn btn-outline-secondary" type="button" id="pwToggle1"><i class="ti ti-eye"></i></button>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Confirm password</label>
            <div class="input-group">
              <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm new password" autocomplete="new-password" />
              <button class="btn btn-outline-secondary" type="button" id="pwToggle2"><i class="ti ti-eye"></i></button>
            </div>
          </div>
          <button class="btn btn-primary w-100" id="setPasswordBtn">
            <span id="btnLabel">Set password</span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
          </button>
        </div>
      </div>
    </div>
    <div class="text-center mt-3 text-secondary small">
      <a href="login.html">Back to sign in</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/supabase-client.js"></script>
  <script>
  (async () => {
    // Detect if this is an invite (first-time) or recovery (reset)
    const { data: { session } } = await sb.auth.getSession();

    if (!session) {
      document.getElementById('errorAlert').textContent = 'Your link has expired or is invalid. Please request a new one.';
      document.getElementById('errorAlert').classList.remove('d-none');
      document.getElementById('formArea').style.display = 'none';
      return;
    }

    // Eye toggles
    function wireEye(btnId, inputId) {
      document.getElementById(btnId).addEventListener('click', () => {
        const input = document.getElementById(inputId);
        const icon  = document.querySelector(`#${btnId} i`);
        input.type  = input.type === 'password' ? 'text' : 'password';
        icon.className = input.type === 'password' ? 'ti ti-eye' : 'ti ti-eye-off';
      });
    }
    wireEye('pwToggle1', 'newPassword');
    wireEye('pwToggle2', 'confirmPassword');

    document.getElementById('setPasswordBtn').addEventListener('click', async () => {
      const newPw  = document.getElementById('newPassword').value;
      const confPw = document.getElementById('confirmPassword').value;
      const errEl  = document.getElementById('errorAlert');
      errEl.classList.add('d-none');

      if (!newPw) {
        errEl.textContent = 'Please enter a password.';
        errEl.classList.remove('d-none');
        return;
      }
      if (newPw !== confPw) {
        errEl.textContent = 'Passwords do not match.';
        errEl.classList.remove('d-none');
        return;
      }
      if (newPw.length < 8) {
        errEl.textContent = 'Password must be at least 8 characters.';
        errEl.classList.remove('d-none');
        return;
      }

      document.getElementById('btnSpinner').classList.remove('d-none');
      document.getElementById('setPasswordBtn').disabled = true;

      const { error } = await sb.auth.updateUser({ password: newPw });

      document.getElementById('btnSpinner').classList.add('d-none');
      document.getElementById('setPasswordBtn').disabled = false;

      if (error) {
        errEl.textContent = 'Could not set password: ' + error.message;
        errEl.classList.remove('d-none');
        return;
      }

      // Success — redirect to login with confirmation
      document.getElementById('formArea').style.display = 'none';
      document.getElementById('successAlert').textContent = 'Password set successfully. Redirecting to sign in…';
      document.getElementById('successAlert').classList.remove('d-none');
      setTimeout(() => { window.location.replace('login.html?reset=1'); }, 1500);
    });
  })();
  </script>
</body>
</html>
