<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-app-root="./">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - approveDoc</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="assets/css/theme.css?r=q2uaebjm" />

  <script>
    /* Apply saved theme/accent/sidebar colours immediately, before first
       paint, to avoid a flash of default colours/light-mode. Mirrors the
       logic in theme.js and sidebar-html.js but must be self-contained
       and synchronous since it runs before those files have loaded. */
    (function() {
      try {
        var root = document.documentElement.dataset.appRoot || './';
        var absoluteRoot = new URL(root, window.location.href).pathname;
        var suffix = ':' + absoluteRoot;

        var savedTheme = localStorage.getItem('app_theme');
        var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);

        var accent = localStorage.getItem('app_accent' + suffix);
        if (accent) {
          document.documentElement.style.setProperty('--tblr-primary', accent);
          var ah = accent.replace('#','');
          if (ah.length === 3) ah = ah.split('').map(function(c){return c+c;}).join('');
          var ar = parseInt(ah.slice(0,2),16), ag = parseInt(ah.slice(2,4),16), ab = parseInt(ah.slice(4,6),16);
          document.documentElement.style.setProperty('--tblr-primary-rgb', ar + ', ' + ag + ', ' + ab);
        }

        var sidebarBg = localStorage.getItem('app_sidebar_bg' + suffix);
        if (sidebarBg) {
          document.documentElement.style.setProperty('--bg-sidebar', sidebarBg);

          var hex = sidebarBg.replace('#', '');
          if (hex.length === 3) hex = hex.split('').map(function(c){return c+c;}).join('');
          var r = parseInt(hex.slice(0,2),16) / 255;
          var g = parseInt(hex.slice(2,4),16) / 255;
          var b = parseInt(hex.slice(4,6),16) / 255;
          var toLinear = function(c){ return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
          var luminance = 0.2126*toLinear(r) + 0.7152*toLinear(g) + 0.0722*toLinear(b);
          var isLight = luminance > 0.5;
          document.documentElement.style.setProperty('--sidebar-fg', isLight ? '#0f172a' : '#ffffff');
          document.documentElement.style.setProperty('--sidebar-fg-rgb', isLight ? '15,23,42' : '255,255,255');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- Sidebar -->
  <aside id="sidebar"></aside>
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="app-content-wrapper">

    <!-- Header -->
    <header class="navbar navbar-expand-md d-print-none border-bottom">
      <div class="container-fluid">
        <button id="sidebarToggle" class="btn btn-icon" aria-label="Toggle sidebar" title="Toggle sidebar">
          <i class="ti ti-menu-2"></i>
        </button>

        <h1 class="navbar-brand d-none d-sm-inline-block ms-2 mb-0 page-title-lg">Dashboard</h1>

        <div class="navbar-nav flex-row order-md-last align-items-center gap-2">
          <div data-active-organisation></div>

          <button class="btn btn-icon" data-theme-toggle title="Toggle dark mode">
            <i class="ti ti-moon"></i>
          </button>

          <button class="btn btn-icon" id="headerPreferencesBtn" title="Preferences">
            <i class="ti ti-adjustments"></i>
          </button>
          <span class="avatar avatar-sm rounded-circle bg-primary-lt" data-user-initials>?</span>
          <span class="d-none d-xl-block">
            <span class="d-block fw-semibold" style="font-size:.8125rem" data-user-name>—</span>
            <span class="d-block text-secondary" style="font-size:.7rem" data-user-email>—</span>
          </span>
        </div>
      </div>
    </header>

    <!-- Body -->
    <div class="page-body">
      <div class="container-fluid">

        <div class="row row-deck row-cards mb-3">
          <div class="col-sm-6 col-lg-3">
            <div class="card card-sm">
              <div class="card-body">
                <div class="row align-items-center">
                  <div class="col-auto"><span class="bg-primary text-white avatar"><i class="ti ti-files"></i></span></div>
                  <div class="col">
                    <div class="font-weight-medium">—</div>
                    <div class="text-secondary">Documents</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-lg-3">
            <div class="card card-sm">
              <div class="card-body">
                <div class="row align-items-center">
                  <div class="col-auto"><span class="bg-warning text-white avatar"><i class="ti ti-bug"></i></span></div>
                  <div class="col">
                    <div class="font-weight-medium">—</div>
                    <div class="text-secondary">Open issues</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-lg-3">
            <div class="card card-sm">
              <div class="card-body">
                <div class="row align-items-center">
                  <div class="col-auto"><span class="bg-green text-white avatar"><i class="ti ti-building"></i></span></div>
                  <div class="col">
                    <div class="font-weight-medium">—</div>
                    <div class="text-secondary">Organisations</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-lg-3">
            <div class="card card-sm">
              <div class="card-body">
                <div class="row align-items-center">
                  <div class="col-auto"><span class="bg-azure text-white avatar"><i class="ti ti-users"></i></span></div>
                  <div class="col">
                    <div class="font-weight-medium">—</div>
                    <div class="text-secondary">Users</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Welcome to approveDoc</h3>
          </div>
          <div class="card-body">
            <p class="text-secondary mb-0">This is the dashboard placeholder. Replace this card with whatever this project's home page should show.</p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/version.js?r=q2uaebjm"></script>
  <script src="assets/js/supabase-client.js?r=q2uaebjm"></script>
  <script src="assets/js/auth.js?r=q2uaebjm"></script>
  <script src="assets/js/app.js?r=q2uaebjm"></script>
  <script src="assets/js/theme.js?r=q2uaebjm"></script>
  <script src="assets/js/sidebar-html.js?r=q2uaebjm"></script>
  <script src="assets/js/sidebar.js?r=q2uaebjm"></script>
  <script src="assets/js/profile-modal.js?r=q2uaebjm"></script>
  <script>
    (async function() {
      const session = await Auth.requireAuth();
      if (!session) return;
      SidebarHtml.inject('./');
      Sidebar.init();
      Auth.refreshUI();
    })();
  </script>
</body>
